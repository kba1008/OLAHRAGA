<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>AtletTraning — Kehadiran & Rekod Latihan Atlet</title>
<meta name="description" content="Sistem kehadiran atlet dan rekod prestasi latihan pusat." />
<meta name="theme-color" content="#4f2df5" />
<link rel="manifest" href="./manifest.json" />
<style>
:root{
  --bg:#070b1e; --bg2:#0d1330; --card:rgba(255,255,255,.06); --line:rgba(255,255,255,.14);
  --txt:#f2f5ff; --mut:#9fb0d9;
  --p1:#6d28f9; --p2:#00c6ff; --p3:#ff2d95; --ok:#00e08a; --warn:#ffc400; --bad:#ff4d6d;
  --grad:linear-gradient(135deg,#6d28f9,#00c6ff 55%,#ff2d95);
  --sh:0 18px 40px -18px rgba(0,0,0,.85),0 2px 0 rgba(255,255,255,.09) inset;
  --r:20px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--txt);
  background:
    radial-gradient(900px 500px at 10% -5%,rgba(109,40,249,.45),transparent 60%),
    radial-gradient(800px 480px at 95% 8%,rgba(0,198,255,.32),transparent 60%),
    radial-gradient(700px 500px at 50% 105%,rgba(255,45,149,.28),transparent 60%),
    var(--bg);
  min-height:100vh;padding-bottom:96px
}
.wrap{max-width:880px;margin:0 auto;padding:16px}
.wrap.full{max-width:100%;padding:0}
.wrap.full .top{padding:16px 16px 0}
.wrap.full .mx-tools{padding:0 16px}
.hide{display:none!important}
h1,h2,h3{margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--sh);backdrop-filter:blur(14px);margin-bottom:14px}
.badge{display:inline-block;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:800;letter-spacing:.4px;background:var(--grad);box-shadow:0 6px 14px -6px var(--p1)}
.chip{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;background:rgba(255,255,255,.1);border:1px solid var(--line);color:var(--mut);margin:2px 4px 2px 0}
label{display:block;font-size:12px;font-weight:700;color:var(--mut);margin:10px 0 5px;letter-spacing:.3px}
input,select,textarea{width:100%;padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:rgba(4,8,26,.7);color:var(--txt);font-size:15px;outline:none;font-family:inherit}
input:focus,select:focus,textarea:focus{border-color:var(--p2);box-shadow:0 0 0 3px rgba(0,198,255,.2)}
option{background:#0d1330}
input[type=checkbox],input[type=radio]{width:18px;height:18px;min-width:18px;flex:0 0 auto;padding:0;margin:0;border-radius:5px;accent-color:var(--p2);cursor:pointer}
/* Senarai ahli pasukan (rekod berpasukan) */
.teamBox{max-height:42vh;overflow:auto;border:1px solid var(--line);border-radius:14px;padding:8px;margin-top:6px;background:rgba(4,8,26,.45)}
.teamKat{font-size:11px;font-weight:800;letter-spacing:.6px;color:var(--p2);text-transform:uppercase;margin:10px 4px 6px}
.teamKat:first-child{margin-top:2px}
.teamRow{display:flex;align-items:center;gap:10px;text-align:left;padding:9px 10px;margin:0 0 6px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.04);font-size:13px;font-weight:600;color:var(--txt);cursor:pointer}
.teamRow.off{opacity:.45;cursor:not-allowed}
.teamRow .tinfo{flex:1;min-width:0}
.teamRow .tnama{display:block;font-size:13px;font-weight:700;line-height:1.3;color:var(--txt)}
.teamRow .tsub{display:block;font-size:11px;font-weight:600;color:var(--mut);margin-top:2px}
.teamRow .tsub .ok{color:var(--ok)}
.teamRow .tsub .no{color:var(--warn)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px 16px;margin-top:12px;border:0;border-radius:16px;font-size:15px;font-weight:800;color:#fff;cursor:pointer;
  background:var(--grad);box-shadow:0 12px 26px -12px var(--p1),0 1px 0 rgba(255,255,255,.35) inset;transition:transform .12s,filter .12s}
.btn:active{transform:translateY(2px) scale(.99);filter:brightness(1.1)}
.btn:disabled{opacity:.55;cursor:not-allowed;filter:grayscale(.3)}
.btn.ghost{background:rgba(255,255,255,.07);border:1px solid var(--line);box-shadow:none}
.btn.sm{width:auto;padding:9px 14px;font-size:13px;margin-top:0}
.btn.ok{background:linear-gradient(135deg,#00e08a,#00b3ff)}
.btn.bad{background:linear-gradient(135deg,#ff4d6d,#ff9500)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1;min-width:140px}
.grid3{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:640px){.grid3{grid-template-columns:repeat(3,1fr)}}
.tile{position:relative;border-radius:26px;padding:26px 18px;text-align:center;cursor:pointer;color:#fff;border:1px solid rgba(255,255,255,.22);
  box-shadow:0 26px 44px -22px rgba(0,0,0,.95),0 2px 0 rgba(255,255,255,.4) inset,0 -8px 18px -12px rgba(0,0,0,.7) inset;
  transition:transform .16s ease, box-shadow .16s ease;overflow:hidden}
.tile:active{transform:translateY(4px) scale(.985)}
.tile:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.3),rgba(255,255,255,0) 45%);pointer-events:none}
.t1{background:linear-gradient(150deg,#7a2bff,#3d0fb0)}
.t2{background:linear-gradient(150deg,#00d4ff,#0067b8)}
.t3{background:linear-gradient(150deg,#ff2d95,#ff8a00)}
.tile .ic{font-size:40px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.5))}
.tile .tt{font-size:18px;font-weight:900;margin-top:8px;letter-spacing:.3px}
.tile .ts{font-size:12px;opacity:.9;margin-top:3px}
.dragHandle{cursor:grab;user-select:none;font-size:18px;line-height:1;color:var(--mut,#9aa);padding:4px 6px;border-radius:10px;background:rgba(255,255,255,.06);flex:0 0 auto}
.item.dragging{opacity:.45}
.item.dragOver{outline:2px dashed var(--p2,#7c5cff);outline-offset:2px}
.item{display:flex;align-items:center;gap:12px;padding:12px;border-radius:18px;background:rgba(255,255,255,.055);border:1px solid var(--line);margin-bottom:10px;box-shadow:0 10px 22px -18px #000}
.av{width:48px;height:48px;border-radius:14px;object-fit:cover;background:#111a3d;border:1px solid var(--line);flex:0 0 auto}
.nm{font-weight:800;font-size:14px;line-height:1.25}
.sub{font-size:11.5px;color:var(--mut);margin-top:3px}
.right{margin-left:auto;text-align:right}
.small{font-size:11.5px;color:var(--mut)}
.top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.back{background:rgba(255,255,255,.09);border:1px solid var(--line);color:#fff;border-radius:12px;padding:8px 12px;font-weight:800;cursor:pointer}
.rank{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:900;background:var(--grad);box-shadow:0 8px 18px -10px var(--p2)}
.rank{font-size:13px;letter-spacing:.3px;overflow:hidden;flex:0 0 auto}
.rank.ikonImg{padding:0}
.rank.ikonImg img{width:100%;height:100%;object-fit:cover;display:block}
.tagGugur{display:inline-block;padding:3px 9px;border-radius:999px;font-size:10px;font-weight:900;letter-spacing:.4px;background:rgba(255,77,109,.18);border:1px solid rgba(255,77,109,.5);color:#ff8fa3}
.item.gugur{opacity:.72}
.acara-acts{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap;justify-content:flex-end}
.acara-acts .btn{margin-top:0;padding:8px 12px;border-radius:12px}
.acara-acts .act-ic{font-size:16px;line-height:1}
.acara-acts .act-txt{margin-left:5px;font-size:12px;font-weight:700}
.acara-menu-btn{width:42px;height:42px;padding:0;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:20px;line-height:1;font-weight:700}
.dd-menu{position:fixed;z-index:9999;min-width:210px;background:var(--card,#fff);border:1px solid rgba(0,0,0,.12);border-radius:14px;box-shadow:0 12px 30px rgba(0,0,0,.18);padding:6px;overflow:hidden}
.dd-tajuk{font-size:11px;font-weight:800;opacity:.6;padding:6px 10px 8px;text-transform:uppercase;letter-spacing:.4px}
.dd-item{display:block;width:100%;text-align:left;background:none;border:0;padding:10px 12px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;color:inherit}
.dd-item:hover{background:rgba(0,0,0,.06)}
.dd-item.bad{color:#c62828}
.ikonPrev{width:96px;height:96px;border-radius:22px;overflow:hidden;background:var(--grad);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:26px;margin:8px auto}
.ikonPrev img{width:100%;height:100%;object-fit:cover;display:block}
.g1{background:linear-gradient(135deg,#ffd700,#ff9500)}
.g2{background:linear-gradient(135deg,#dfe7f5,#9aa9c4)}
.g3{background:linear-gradient(135deg,#d9822b,#8a4b12)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#101838;border:1px solid var(--line);padding:13px 18px;border-radius:14px;z-index:99;max-width:90%;font-size:13.5px;box-shadow:var(--sh);text-align:center}
.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(8,12,32,.93);border-top:1px solid var(--line);display:flex;padding:8px 6px calc(8px + env(safe-area-inset-bottom));backdrop-filter:blur(16px);z-index:50}
.nav button{flex:1;background:none;border:0;color:var(--mut);font-size:11px;font-weight:800;padding:6px 2px;cursor:pointer}
.nav button.on{color:#fff}
.nav .ni{display:block;font-size:19px}
.hd{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.logo{width:44px;height:44px;border-radius:14px;background:var(--grad);display:flex;align-items:center;justify-content:center;font-weight:900;box-shadow:0 12px 24px -10px var(--p1)}
.stat{text-align:center;padding:12px;border-radius:16px;background:rgba(255,255,255,.06);border:1px solid var(--line)}
.stat b{display:block;font-size:22px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px}
.tabs button{white-space:nowrap;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--mut);font-weight:800;font-size:12.5px;cursor:pointer}
.tabs button.on{background:var(--grad);color:#fff;border-color:transparent}

/* --- Susunan kad atlet lebih kemas & padat pada paparan telefon --- */
@media (max-width: 640px){
  .wrap{padding:10px}
  body{padding-bottom:84px}
  h1,h2,h3{margin:0 0 6px}
  h3{font-size:15px}
  .card{padding:11px 12px;border-radius:16px;margin-bottom:9px}
  .item{flex-wrap:wrap; align-items:center; gap:8px; padding:9px 10px; margin-bottom:7px; border-radius:14px}
  .item > .rank{width:28px;height:28px;border-radius:9px;font-size:12px}
  .item > .av{width:38px;height:38px;border-radius:11px}
  .item > div[style*="flex:1"]{min-width:0;flex:1 1 60%}
  .item .nm{font-size:13px}
  .item .sub{font-size:11px;margin-top:2px;line-height:1.35}
  .item .right{
    order:99; width:100%; margin-left:0; text-align:left;
    display:flex; align-items:center; gap:6px; flex-wrap:wrap;
    padding:7px 0 0; margin-top:5px; border-top:1px dashed var(--line);
  }
  .item .right .btn.sm{flex:1 1 auto;margin-top:0!important;padding:7px 10px;font-size:12px;border-radius:11px}
  .item .right .nm{font-size:15px;color:var(--p2)}
  .item .right .sub{margin-top:0}
  .item .right .sub:before{content:"• ";opacity:.55}
  .item .right .sub:first-of-type:before{content:""}
  .btn{padding:11px 13px;margin-top:9px;font-size:14px;border-radius:13px}
  .btn.sm{padding:7px 11px;font-size:12px}
  .pill{font-size:11px}
  .small{font-size:11px}
  .chip{font-size:10.5px;padding:2px 8px}
  .tabs{gap:6px;margin-bottom:8px}
  .tabs button{padding:6px 11px;font-size:11.5px}
  label{margin:8px 0 4px;font-size:11.5px}
  input,select,textarea{padding:10px 12px;font-size:14px;border-radius:12px}
  .stat{padding:8px;border-radius:13px}
  .stat b{font-size:18px}
  .row{gap:8px}
  .row>*{min-width:118px}
  .acara-acts{justify-content:flex-start;width:100%;margin-top:6px;gap:6px}
  .acara-acts .act-txt{display:none}
  .acara-acts .btn{width:38px;height:38px;padding:0;border-radius:50%;justify-content:center}
  .acara-acts .btn.bad{border-radius:50%}
}

.sp{width:34px;height:34px;border:3px solid rgba(255,255,255,.15);border-top-color:var(--p2);border-radius:50%;animation:s 1s linear infinite;margin:24px auto}
@keyframes s{to{transform:rotate(360deg)}}
.ov{position:fixed;inset:0;background:rgba(4,7,20,.82);display:flex;align-items:flex-end;justify-content:center;z-index:80;backdrop-filter:blur(6px)}
.sheet{background:#0d1330;border:1px solid var(--line);border-radius:24px 24px 0 0;padding:18px;width:100%;max-width:880px;max-height:88vh;overflow:auto;box-shadow:0 -20px 50px -20px #000}
.big{font-size:20px;font-weight:900}
hr{border:0;border-top:1px solid var(--line);margin:14px 0}
.pill{display:inline-block;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:800;background:rgba(0,224,138,.15);color:var(--ok);border:1px solid rgba(0,224,138,.35);margin:2px 4px 0 0}
.pill.warn{background:rgba(255,196,0,.12);color:var(--warn);border-color:rgba(255,196,0,.35)}
.sync{position:fixed;top:12px;right:12px;z-index:70;display:none;align-items:center;gap:8px;padding:7px 14px;background:linear-gradient(135deg,rgba(6,182,212,.14),rgba(139,92,246,.12)),rgba(8,12,32,.92);border:1px solid rgba(6,182,212,.5);border-radius:999px;box-shadow:0 0 22px rgba(6,182,212,.28),0 10px 28px -12px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.12);color:#c4f0ff;font-family:"SF Mono","Fira Code","Consolas","Monaco",monospace;font-size:11px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;text-shadow:0 0 10px rgba(6,182,212,.65);backdrop-filter:blur(12px);overflow:hidden}
.sync::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent,transparent 3px,rgba(6,182,212,.04) 3px,rgba(6,182,212,.04) 4px);pointer-events:none}
.sync.on{display:inline-flex}
.sync .dot{position:relative;z-index:1;width:8px;height:8px;border-radius:50%;background:#22d3ee;box-shadow:0 0 10px #22d3ee,0 0 22px #22d3ee;animation:pl 1.1s infinite}
@keyframes pl{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(.7)}}
.sync .txt{position:relative;z-index:1;display:inline-flex;gap:2px}
.sync .txt::after{content:"";display:inline-block;width:3ch;animation:ldot 1.4s steps(4) infinite}
@keyframes ldot{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
/* Cropper */
.cropbox{position:relative;width:100%;aspect-ratio:1/1;max-width:340px;margin:8px auto;border-radius:20px;overflow:hidden;background:#000;border:1px solid var(--line);touch-action:none;user-select:none}
.cropbox canvas{display:block;width:100%;height:100%}
.cropbox .mask{position:absolute;inset:0;box-shadow:0 0 0 9999px rgba(0,0,0,.55) inset;border-radius:20px;pointer-events:none}
.fileit{display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;background:rgba(255,255,255,.055);border:1px solid var(--line);margin-bottom:8px}
.fileic{width:38px;height:38px;border-radius:10px;background:var(--grad);display:flex;align-items:center;justify-content:center;font-size:16px;flex:0 0 auto}
@media (max-width:640px){.jl-acara{display:none!important}}

/* ===== Matriks Peserta × Acara (Cek List) ===== */
.mx-del{margin-left:6px;background:transparent;border:0;color:#e11d48;cursor:pointer;font-size:12px;padding:0 2px;line-height:1}
.mx-del:hover{transform:scale(1.15)}
.mx-editp{margin-left:6px;background:transparent;border:0;color:#2563eb;cursor:pointer;font-size:12px;padding:0 2px;line-height:1}
.mx-editp:hover{transform:scale(1.15)}
.mx-wrap{background:#fff;color:#0b1533;border-radius:16px;padding:18px;box-shadow:var(--sh);border:1px solid var(--line)}
.mx-head{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:3px solid #0b1533;padding-bottom:12px;margin-bottom:14px;flex-wrap:wrap}
.mx-title h2{font-size:20px;letter-spacing:.3px;color:#0b1533;margin:0}
.mx-title .mx-sub{font-size:12px;color:#5b6b8f;font-weight:600;letter-spacing:.6px;text-transform:uppercase;margin-top:4px}
.mx-brand{display:flex;align-items:center;gap:10px}
.mx-logo{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#6d28f9,#00c6ff 55%,#ff2d95);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:16px;letter-spacing:.5px}
.mx-tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.mx-tools input,.mx-tools select{background:#fff;color:#0b1533;border:1px solid #d9dfef;font-size:13px;padding:9px 12px;border-radius:10px}
.mx-btn{background:#0b1533;color:#fff;border:0;padding:9px 14px;border-radius:10px;font-weight:700;font-size:12.5px;cursor:pointer;letter-spacing:.3px}
.mx-btn.alt{background:#fff;color:#0b1533;border:1px solid #0b1533}
.mx-scroll{overflow:auto;border:1px solid #e1e6f2;border-radius:12px}
table.mx{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px;color:#0b1533;min-width:640px}
table.mx thead th{position:sticky;top:0;background:#0b1533;color:#fff;font-weight:700;font-size:11px;letter-spacing:.5px;text-transform:uppercase;padding:12px 10px;border-right:1px solid rgba(255,255,255,.1);z-index:2}
table.mx thead th.rot{writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;min-width:36px;height:150px;padding:10px 6px;font-size:11.5px}
table.mx thead th.nm{text-align:left;min-width:220px}
table.mx thead th.sk{text-align:left;min-width:150px}
table.mx thead th.kt{text-align:center;min-width:80px}
table.mx tbody td{padding:10px 10px;border-bottom:1px solid #eef1f8;border-right:1px solid #eef1f8;background:#fff}
table.mx tbody tr:nth-child(even) td{background:#f7f9fd}
table.mx tbody tr:hover td{background:#eef4ff}
table.mx tbody tr.group-start td{border-top:2px solid #0b1533}
table.mx tbody tr.group-start td.nm{font-weight:800}
table.mx td.nm{text-align:left;font-weight:600}
table.mx td.nm .no{color:#8390b3;font-weight:600;margin-right:8px}
table.mx td.sk,table.mx td.kt{text-align:left;color:#4a5878;font-weight:500}
table.mx td.kt{text-align:center}
table.mx td.cx{text-align:center;font-weight:800}
table.mx td.cx.on{color:#0a8f4b;background:#e6f6ee !important;font-size:15px}
table.mx td.cx.off{color:#c8ced9}
table.mx td.tot{text-align:center;font-weight:800;background:#fbfcff !important;color:#0b1533}
table.mx tfoot td{background:#0b1533 !important;color:#fff;font-weight:800;padding:10px;text-align:center;font-size:11.5px;letter-spacing:.4px;border:0}
table.mx tfoot td.lbl{text-align:right;text-transform:uppercase}
.mx-edit{background:transparent;border:0;padding:0;font:inherit;font-weight:700;color:#0b1533;text-align:left;cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}
.mx-edit:hover{color:#6d28f9}
.only-print{display:none}
@media print{.only-print{display:inline}}
.mx-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;color:#4a5878;font-size:12px}
.mx-legend .lg{display:flex;align-items:center;gap:6px}
.mx-legend .sw{display:inline-block;width:14px;height:14px;border-radius:4px;background:#e6f6ee;border:1px solid #0a8f4b}
.mx-foot{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding-top:12px;border-top:1px solid #e1e6f2;color:#5b6b8f;font-size:11.5px;letter-spacing:.3px}
@media print{
  @page{size:A4 landscape;margin:12mm}
  body{background:#fff !important;padding:0 !important}
  .nav,.sync,.top,.hd,.tabs,.btn,#nav,.mx-tools,.no-print{display:none !important}
  .wrap{max-width:none;padding:0;margin:0}
  .mx-wrap{border:0;box-shadow:none;padding:0;border-radius:0}
  table.mx{font-size:10.5px}
  table.mx thead th{background:#0b1533 !important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  table.mx thead th.rot{height:130px;font-size:10.5px}

<body>

<div class="wrap" id="app"><div class="sp"></div></div>
<div class="nav hide" id="nav"></div>
<div class="sync" id="sync"><span class="dot"></span><span class="txt" id="syncTxt">Loading</span></div>

<script>
/* ============================================================
   AtletTraning — PWA (versi kemas)
   SUMBER DATA TUNGGAL: Google Sheet (melalui Apps Script Web App)
   ============================================================ */
const API_URL_LALAI="https://script.google.com/macros/s/AKfycbx9YnGHgPzTiRAwioyItL-hXIuHN-szwwEK3D33FGqxCbOyLhzgw-4TqVlXxkq3Dy-4Pg/exec";
const LS_API="at_api_url", LS_USER="at_user", LS_TEK="at_teknision";
const PIN_TEKNISION="101010";
let API=localStorage.getItem(LS_API)||API_URL_LALAI;
let TEKNISION=localStorage.getItem(LS_TEK)==="1";
let U=null; try{U=JSON.parse(localStorage.getItem(LS_USER)||"null")}catch(e){}
let DB=null, VIEW="home", CTX={};
let PENDING=0; /* kiraan penulisan latar belakang */

const $=s=>document.querySelector(s), app=()=>$("#app");
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
/* ---------- Zon waktu Malaysia (Asia/Kuala_Lumpur, UTC+8) ---------- */
const TZ_MY="Asia/Kuala_Lumpur";
function bahagianMY(d){
  d=d||new Date();
  const f=new Intl.DateTimeFormat("en-GB",{timeZone:TZ_MY,year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false});
  const o={}; f.formatToParts(d).forEach(x=>{o[x.type]=x.value});
  if(o.hour==="24") o.hour="00";
  return o;
}
function tarikhMY(d){ const o=bahagianMY(d); return o.year+"-"+o.month+"-"+o.day; }
function jamMY(d){ const o=bahagianMY(d); return o.hour+":"+o.minute+":"+o.second; }
function capMY(d){ return tarikhMY(d)+" "+jamMY(d); }              /* yyyy-MM-dd HH:mm:ss */
function capMasaMY(d){ return fmtTarikh(tarikhMY(d))+" "+fmtMasa(jamMY(d)); } /* dd/MM/yyyy h.mmam */
const today=()=>tarikhMY();
const isMaster=()=>!!U&&String(U.peranan||"").toUpperCase()==="ADMIN";
const isSubAdmin=()=>!!U&&String(U.peranan||"").toUpperCase()==="SUBADMIN";
/* Sub Admin ada kuasa penuh sama seperti Master Admin (kecuali padam Master Admin) */
const isAdmin=()=>isMaster()||isSubAdmin();
const namaPeranan=()=>isMaster()?"MASTER ADMIN":(isSubAdmin()?"SUB ADMIN":"GURU");
/* Master Admin ATAU jurulatih yang telah dilantik untuk mana-mana acara */
const isJurulatihDilantik=()=>!!U&&((typeof DB!=="undefined"&&DB&&DB.jurulatih)||[]).some(j=>String(j["EMEL JURULATIH"]||"").toLowerCase().trim()===String(U.emel||"").toLowerCase().trim());
const bolehUrusAtlet=()=>isAdmin()||isJurulatihDilantik();
/* Padam atlet dari keseluruhan sistem — Master Admin sahaja */
const bolehPadamAtlet=()=>isAdmin();
/* Tambah acara: Master Admin ATAU jurulatih yang telah dilantik */
const bolehTambahAcara=()=>isAdmin()||isJurulatihDilantik();

function toast(m,ms=2400){const d=document.createElement("div");d.className="toast";d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),ms)}
function loading(t="Memuatkan data dari Google Sheet..."){app().innerHTML=`<div class="card" style="text-align:center"><div class="sp"></div><div class="small">${esc(t)}</div></div>`}
function syncShow(t){const s=$("#sync");if(!s)return; $("#syncTxt").textContent=t||"Loading"; s.classList.add("on");}
function syncHide(){const s=$("#sync"); if(s) s.classList.remove("on");}
function bumpPending(d){ PENDING=Math.max(0,PENDING+d); if(PENDING>0) syncShow(`Loading (${PENDING})`); else syncHide(); }

/* ============================================================
   Diagnostik pangkalan data
   ============================================================ */
const LOG=[];
function logTambah(jenis,mesej,butiran){
  LOG.unshift({masa:capMY(),jenis,mesej:String(mesej||""),butiran:String(butiran||"")});
  if(LOG.length>80) LOG.pop();
}
function urlSelamat(u){
  if(!u) return "(tiada)";
  if(TEKNISION) return u;
  const m=String(u).match(/\/macros\/s\/([^/]+)/);
  const id=m?m[1]:"";
  return "script.google.com/macros/s/••••••••"+id.slice(-4)+"/exec";
}
const RUJUKAN={
  "DB-001":["URL pangkalan data belum ditetapkan.","Teknision: Mod Teknision → tetapkan URL Web App Apps Script."],
  "DB-002":["Sambungan tamat masa. Google Sheet lambat/terputus.","Semak internet, cuba semula."],
  "DB-003":["Gagal menghubungi skrip.","Deploy → Manage deployments → Web app → Execute as Me, Access Anyone."],
  "DB-004":["Skrip Google Sheet membalas dengan ralat.","Lihat butiran / Apps Script Executions."],
  "DB-005":["Balasan tidak sah.","Kemas kini deployment selepas paste kod baharu."],
  "DB-006":["Sheet/lajur tiada.","Jalankan setupPangkalanData()."],
  "DB-007":["Skrip belum diberi kebenaran Google Drive.","Buka Apps Script → Pilih fungsi authorizeAll → tekan Run → benarkan akses Drive & Sheet. Kemudian Deploy > Manage deployments > Edit > New version."],
  "DB-100":["Fungsi baharu belum wujud pada Web App yang di-deploy.","Di Apps Script: tampal code.gs terkini, Save, kemudian Deploy → Manage deployments → Edit (pensel) → Version: New version → Deploy."]
};
function RalatDB(kod,mesej,mentah,aksi){
  const r=RUJUKAN[kod]||["Ralat tidak dikenali.","Hubungi teknision."];
  const e=new Error(mesej||r[0]);
  e.kod=kod; e.punca=r[0]; e.tindakan=r[1]; e.mentah=mentah||""; e.aksi=aksi||"";
  logTambah("RALAT",`[${kod}] ${e.message}`,`Aksi: ${e.aksi} | ${e.mentah}`);
  return e;
}
window.addEventListener("error",ev=>logTambah("JS",ev.message,(ev.filename||"")+":"+(ev.lineno||"")));
window.addEventListener("unhandledrejection",ev=>logTambah("JS",(ev.reason&&ev.reason.message)||String(ev.reason),""));

/* ---------- Panggilan API ----------
   JSONP untuk data ringan; POST no-cors untuk payload besar (fail/gambar) supaya laju & elak had URL. */
function apiJsonp(action,payload,timeoutMs){
  return new Promise((res,rej)=>{
    if(!API) return rej(RalatDB("DB-001","URL Google Apps Script belum ditetapkan.","",action));
    const mula=Date.now();
    const cb="cb_"+Math.random().toString(36).slice(2);
    const s=document.createElement("script");
    const to=setTimeout(()=>{cleanup();rej(RalatDB("DB-002","Sambungan tamat masa.","Tempoh: "+(timeoutMs||45000)+"ms",action))},timeoutMs||45000);
    function cleanup(){clearTimeout(to);delete window[cb];s.remove()}
    window[cb]=r=>{
      cleanup();
      const ms=Date.now()-mula;
      if(!r||typeof r!=="object") return rej(RalatDB("DB-005","Balasan tidak sah.","Balasan: "+String(r).slice(0,300),action));
      if(r.ok){ logTambah("OK",`Aksi '${action}' berjaya (${ms}ms)`,""); return res(r.data); }
      const kod=r.kod||(/setup|sheet|lajur|column/i.test(r.error||"")?"DB-006":/authoriz|permission|kebenaran/i.test(r.error||"")?"DB-007":"DB-004");
      rej(RalatDB(kod,r.error||"Ralat tidak diketahui.","Aksi: "+action+" | "+JSON.stringify(r).slice(0,600),action));
    };
    s.onerror=()=>{cleanup();rej(RalatDB("DB-003","Gagal menghubungi pangkalan data.","Aksi: "+action,action))};
    s.referrerPolicy="no-referrer";
    s.src=API+(API.includes("?")?"&":"?")+"callback="+cb+"&_="+Date.now()+"&payload="+encodeURIComponent(JSON.stringify({action,...(payload||{})}));
    logTambah("HANTAR",`Aksi '${action}' dihantar`,"");
    document.body.appendChild(s);
  });
}
function apiPost(action,payload){
  if(!API) return Promise.reject(RalatDB("DB-001","URL belum ditetapkan.","",action));
  return fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action,...(payload||{})})})
    .then(r=>r.json())
    .then(r=>{
      if(!r||typeof r!=="object") throw RalatDB("DB-005","Balasan tidak sah.","",action);
      if(r.ok) return r.data;
      const kod=r.kod||"DB-004"; throw RalatDB(kod,r.error||"Ralat",JSON.stringify(r).slice(0,600),action);
    })
    .catch(e=>{ if(e && e.kod) throw e; throw RalatDB("DB-003",String(e&&e.message||e),"",action); });
}
/* Fallback: sebahagian telefon/pelayar mudah alih menyekat <script> silang-domain
   (JSONP). Guna fetch GET (CORS) sebagai cadangan sebelum POST. */
function apiGetFetch(action,payload){
  if(!API) return Promise.reject(RalatDB("DB-001","URL belum ditetapkan.","",action));
  const url=API+(API.includes("?")?"&":"?")+"_="+Date.now()+"&payload="+encodeURIComponent(JSON.stringify({action,...(payload||{})}));
  return fetch(url,{method:"GET",redirect:"follow",cache:"no-store",credentials:"omit"})
    .then(r=>r.text())
    .then(t=>{
      let j=null;
      try{ j=JSON.parse(t); }
      catch(e){ const m=String(t).match(/^[^(]*\((\{[\s\S]*\})\)\s*;?\s*$/); if(m){ try{ j=JSON.parse(m[1]); }catch(e2){} } }
      if(!j||typeof j!=="object") throw RalatDB("DB-005","Balasan tidak sah.","Balasan: "+String(t).slice(0,300),action);
      if(j.ok){ logTambah("OK",`Aksi '${action}' berjaya (fetch)`,""); return j.data; }
      throw RalatDB(j.kod||"DB-004",j.error||"Ralat tidak diketahui.",JSON.stringify(j).slice(0,600),action);
    })
    .catch(e=>{ if(e&&e.kod) throw e; throw RalatDB("DB-003",String(e&&e.message||e),"fetch GET",action); });
}
const AKSI_BACA={data:1,ping:1,login:1,daftar:1};
function api(action,payload){
  // Data besar (base64) → POST supaya lebih laju & tanpa had URL
  const besar = payload && (payload.gambarBase64 || payload.dataBase64);
  const p = besar ? apiPost(action,payload) : apiJsonp(action,payload)
    .catch(e=>{
      // Telefon: JSONP kerap gagal (DB-003/DB-002). Cuba fetch GET, kemudian POST.
      if(e&&(e.kod==="DB-003"||e.kod==="DB-002"||e.kod==="DB-005")){
        logTambah("INFO","JSONP gagal — cuba fetch GET","Aksi: "+action);
        return apiGetFetch(action,payload).catch(e2=>{
          if(e2&&e2.kod&&e2.kod!=="DB-003"&&e2.kod!=="DB-005") throw e2;
          logTambah("INFO","fetch GET gagal — cuba POST","Aksi: "+action);
          return apiPost(action,payload);
        });
      }
      throw e;
    });
  // Setiap penulisan → segerak senyap supaya paparan sentiasa terkini tanpa refresh
  return p.then(r=>{ if(!AKSI_BACA[action]) jadualSegerak(600); return r; });
}

function laporanTeks(e){
  return ["=== LAPORAN RALAT ATLETTRANING ===",
  "Masa      : "+capMY()+" (Waktu Malaysia)",
  "Kod Ralat : "+(e.kod||"UI-000"),
  "Mesej     : "+(e.message||""),
  "Punca     : "+(e.punca||"-"),
  "Tindakan  : "+(e.tindakan||"-"),
  "Aksi API  : "+(e.aksi||"-"),
  "Butiran   : "+(e.mentah||"-"),
  "Pengguna  : "+(U?U.emel:"(belum log masuk)"),
  "Peranti   : "+navigator.userAgent,
  "Pangkalan : "+urlSelamat(API),
  "--- 15 LOG TERAKHIR ---",
  ...LOG.slice(0,15).map(l=>`[${l.masa}] ${l.jenis}: ${l.mesej} ${l.butiran}`)].join("\n");
}
function salinLaporan(e){
  const t=e?laporanTeks(e):laporanTeks({kod:"INFO",message:"Laporan diagnostik"});
  navigator.clipboard?.writeText(t).then(()=>toast("Laporan disalin"),()=>toast("Gagal menyalin"));
  window.__laporanTerakhir=t;
}
let RALAT_TERAKHIR=null;
function toastRalat(e){
  RALAT_TERAKHIR=e;
  toast("["+(e.kod||"UI-000")+"] "+(e.message||"Ralat")+(e.tindakan?" — "+e.tindakan:""),5500);
}
function kadRalat(e,cubaLagi){
  RALAT_TERAKHIR=e;
  return `<div class="card" style="border:1px solid rgba(255,60,90,.5)">
    <span class="badge" style="background:linear-gradient(90deg,#ff2d55,#ff9500)">KOD ${esc(e.kod||"UI-000")}</span>
    <h2 style="margin-top:10px">Masalah Pangkalan Data</h2>
    <p class="small"><b>Mesej:</b> ${esc(e.message||"")}</p>
    <p class="small"><b>Punca:</b> ${esc(e.punca||"Tidak diketahui")}</p>
    <p class="small"><b>Tindakan:</b> ${esc(e.tindakan||"Hubungi teknision.")}</p>
    ${e.mentah?`<details style="margin-top:8px"><summary class="small">Butiran teknikal</summary><div class="small" style="word-break:break-all">${esc(e.mentah)}</div></details>`:""}
    ${cubaLagi?`<button class="btn" onclick="${cubaLagi}">Cuba lagi</button>`:""}
    <button class="btn ghost sm" onclick="salinLaporan(RALAT_TERAKHIR)">📋 Salin laporan</button>
    <button class="btn ghost sm" onclick="modTeknision()">🔧 Mod Teknision</button>
  </div>`;
}
const who=()=>({olehNama:U?U.nama:"",olehEmel:U?U.emel:""});

/* ---------- Avatar ---------- */
function avatarLalai(jantina){
  const p=String(jantina||"").toUpperCase().startsWith("P");
  const c1=p?"#ff2d95":"#00c6ff", c2=p?"#8a2be2":"#6d28f9";
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><linearGradient id="a" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient></defs><rect width="100" height="100" fill="url(#a)"/><circle cx="50" cy="38" r="17" fill="#fff" opacity=".92"/><path d="M15 96c3-22 18-32 35-32s32 10 35 32z" fill="#fff" opacity=".92"/></svg>`;
  return "data:image/svg+xml;utf8,"+encodeURIComponent(svg);
}
/* Google menyekat "uc?export=view" untuk <img>. Tukar ke bentuk lh3 yang boleh dipapar. */
function urlGambarBoleh(u){
  const s=String(u||"").trim();
  if(!s) return "";
  if(s.indexOf("lh3.googleusercontent.com")>-1) return s;
  const m=s.match(/[-\w]{25,}/);
  if(s.indexOf("drive.google.com")>-1 && m) return "https://lh3.googleusercontent.com/d/"+m[0]+"=w600";
  return s;
}
function avatar(a){
  const u=urlGambarBoleh(a && a["GAMBAR (URL)"]);
  return esc(u || avatarLalai(a&&a["JANTINA"]));
}
/* Letak pada setiap <img> atlet: jika gambar Drive gagal dimuat, tunjuk avatar lalai. */
function avErr(a){
  return `onerror="this.onerror=null;this.src='${avatarLalai(a&&a["JANTINA"]).replace(/'/g,"%27")}'"`;
}


/* ---------- Bantuan data ---------- */
const acaraList=()=>((DB&&DB.acara)||[]).filter(a=>String(a.AKTIF||"YA").toUpperCase()!=="TIDAK")
  .map((a,i)=>({a,i,s:Number(a.SUSUNAN||0)||9999}))
  .sort((x,y)=>x.s-y.s||x.i-y.i).map(x=>x.a);
const acaraInfo=n=>acaraList().find(a=>a.ACARA===n)||{JENIS:"MASA",UNIT:"saat"};
/* ---------- Acara pecut: wajib dalam bentuk SAAT sahaja ----------
   100M, 200M, 400M dan 4x100M — semua nilai dipapar & disimpan sebagai saat
   (cth 1:15.45 auto tukar kepada 75.45 saat, tidak sekali dipapar m:ss).  */
const labelKeputusan=info=>info&&info.JENIS==="MASA"?(isSaatSahaja(info.ACARA)?"masa — saat sahaja":"masa — saat atau minit"):"meter";
const phKeputusan=info=>info&&info.JENIS==="MASA"?(isSaatSahaja(info.ACARA)?"Cth: 12.45 (saat sahaja — 1:12.45 auto tukar kepada 72.45)":"Cth: 15.45 (saat) atau 1:15.45 / 1.15.45 (1 min 15.45 saat)"):"Cth: 4.63";
function isSaatSahaja(nama){
  const t=String(nama||"").toUpperCase().replace(/\s+/g,"");
  return /^(100M?|200M?|400M?)$/.test(t) || /^4X100M?$/.test(t);
}
const atletById=id=>((DB&&DB.atlet)||[]).find(a=>String(a.ID)===String(id));
const jurulatihAcara=n=>((DB&&DB.jurulatih)||[]).filter(j=>j.ACARA===n);
/* ---------- Status pertandingan acara ---------- */
const acaraRow=n=>((DB&&DB.acara)||[]).find(x=>String(x.ACARA)===String(n))||null;
const dipertandingkan=n=>String((acaraRow(n)&&acaraRow(n).DIPERTANDINGKAN)||"YA").toUpperCase()!=="TIDAK";
/* Senarai acara yang benar-benar dipertandingkan (untuk analisis & ranking) */
const acaraDipertanding=()=>acaraList().filter(a=>dipertandingkan(a.ACARA));
const acaraDigugur=()=>acaraList().filter(a=>!dipertandingkan(a.ACARA));
const LABEL_GUGUR="TIDAK DIPERTANDINGKAN";
const tagGugur=n=>dipertandingkan(n)?"":`<span class="tagGugur">🚫 ${LABEL_GUGUR}</span>`;
/* ---------- Status kategori dalam acara (gugur / dipertandingkan) ---------- */
const LABEL_KAT_GUGUR="KATEGORI DIGUGURKAN";
const kunciKat=(n,k)=>String(n||"").toUpperCase().trim()+"||"+String(k||"").toUpperCase().trim();
const kategoriDigugur=(n,k)=>((DB&&DB.katGugur)||[]).some(r=>kunciKat(r.ACARA,r.KATEGORI)===kunciKat(n,k)&&String(r.STATUS||"").toUpperCase().trim()==="DIGUGURKAN");
/* Hanya Master Admin & Sub Admin boleh gugurkan kategori */
const bolehGugurKategori=()=>isAdmin();
const tagKatGugur=(n,k)=>kategoriDigugur(n,k)?`<span class="tagGugur">🚫 ${LABEL_KAT_GUGUR}</span>`:"";
async function tukarStatusKategori(n,k){
  if(!bolehGugurKategori()) return toast("Hanya Master Admin & Sub Admin boleh menggugurkan kategori.");
  const gugur=kategoriDigugur(n,k);
  const status=gugur?"AKTIF":"DIGUGURKAN";
  const msg=gugur
    ? `Kembalikan kategori "${k}" dalam acara "${n}" ke pertandingan?`
    : `Gugurkan kategori "${k}" daripada acara "${n}"?\n\nAtlet & rekod dikekalkan, tetapi kategori ini ditanda "${LABEL_KAT_GUGUR}" dan dikecualikan daripada perbandingan sasaran/analisis harapan pingat.`;
  if(!confirm(msg)) return;
  try{
    await api("tetapkanKategoriGugur",{acara:n,kategori:k,status,...who()});
    DB.katGugur=(DB.katGugur||[]).filter(r=>kunciKat(r.ACARA,r.KATEGORI)!==kunciKat(n,k));
    if(status==="DIGUGURKAN") DB.katGugur.push({ACARA:String(n).toUpperCase(),KATEGORI:String(k).toUpperCase(),STATUS:"DIGUGURKAN","OLEH":U.nama,"TARIKH & MASA":capMY()});
    render(); toast(gugur?"Kategori dikembalikan ke pertandingan":"Kategori digugurkan");
  }catch(e){ toastRalat(e); }
}
/* Label untuk laporan bercetak (dokumen putih) */
const lblGugurCetak=n=>dipertandingkan(n)?"":` <span style="font-size:10px;font-weight:800;color:#b42318;border:1px solid #f3b1a8;background:#fef3f2;border-radius:999px;padding:1px 7px;white-space:nowrap">🚫 ${LABEL_GUGUR}</span>`;
/* Nota ringkas senarai acara digugurkan — disisip pada setiap laporan */
function notaAcaraGugur(){
  const g=acaraDigugur();
  if(!g.length) return "";
  return `<div class="blok"><h2 class="acara">ACARA YANG TIDAK DIPERTANDINGKAN</h2>
  <div style="font-size:12px;padding:6px 0">Acara berikut telah digugurkan daripada pertandingan. Rekod latihan bagi acara ini <b>tidak wajib</b> diisi dan tidak diambil kira dalam analisis harapan pingat:</div>
  <table><thead><tr><th>#</th><th>Acara</th><th>Jenis</th><th>Status</th></tr></thead><tbody>
  ${g.map((a,i)=>`<tr><td class="no">${i+1}</td><td>${esc(a.ACARA)}</td><td>${esc(a.JENIS==="MASA"?"Masa":"Jarak")}</td><td>${LABEL_GUGUR}</td></tr>`).join("")}
  </tbody></table></div>`;
}
/* Boleh tukar status: Master/Sub Admin atau jurulatih acara berkenaan */
const bolehTukarStatus=n=>isAdmin();
/* ---------- Ikon acara (teks atau gambar — Master Admin sahaja) ---------- */
function ikonPos(a){ const p=String((a&&a["IKON POS"])||"").split("|");
  return {x:p[0]||"50%",y:p[1]||"50%",z:Number(p[2]||100)||100}; }
function ikonAcaraHtml(a,kelas=""){
  const n=String((a&&a.ACARA)||"");
  const url=String((a&&a["IKON URL"])||"").trim();
  const teks=(String((a&&a.IKON)||"").trim()||n.replace(/[^A-Za-z0-9]/g,"").slice(0,3)).toUpperCase();
  if(url){ const p=ikonPos(a);
    return `<div class="rank ikonImg ${kelas}"><img src="${esc(url)}" alt="${esc(n)}" style="object-position:${esc(p.x)} ${esc(p.y)};transform:scale(${p.z/100})"/></div>`; }
  return `<div class="rank ${kelas}">${esc(teks.slice(0,4))}</div>`;

const bolehRekod=n=>!!U&&(isAdmin()||jurulatihAcara(n).some(j=>String(j["EMEL JURULATIH"]).toLowerCase()===String((U&&U.emel)||"").toLowerCase()));

  return l.slice().sort((a,b)=>masa?Number(a.NILAI)-Number(b.NILAI):Number(b.NILAI)-Number(a.NILAI))[0];

/* Format ringkas: 13.30s / 2023  •  5.20m / 2024 */
function nilaiRingkas(rk,info){
  const x=Number(rk&&rk.NILAI);
  if(!isFinite(x)||!(x>0)) return String((rk&&rk.KEPUTUSAN)||"-");
  if((info&&info.JENIS)==="MASA"){
    const ss=isSaatSahaja(info&&info.ACARA);
    return fmtSaat(x,ss)+(ss||x<60?"s":"m");

  return x.toFixed(2)+"m";
}

const acaraMod=n=>{ const a=(DB.acara||[]).find(x=>String(x.ACARA).toUpperCase()===String(n).toUpperCase()); return String((a&&a.MOD)||"").toUpperCase(); };
const isBerpasukan=n=>{ const m=acaraMod(n); if(m==="BERPASUKAN") return true; if(m==="INDIVIDU") return false; return isBerpasukan(n); };
const idsRekod=r=>String((r&&r["ATLET ID"])||"").split(",").map(s=>s.trim()).filter(Boolean);

}

/* ---------- Format masa larian (jangan tukar semua kepada saat) ----------
   Input diterima: "15.45" (saat), "1:15.45" atau "1.15.45" (1 minit 15.45 saat),
   juga "1:02:03.5" (jam:minit:saat). Disimpan sebagai saat, dipapar semula
   dalam bentuk minit bagi acara jarak jauh (>= 60 saat).                  */
function huraiMasa(teks){
  const t=String(teks==null?"":teks).trim().replace(",",".");
  if(!t) return NaN;
  let bhg=[];
  if(t.indexOf(":")>-1){ bhg=t.split(":"); }
  else {
    const p=t.split(".");
    if(p.length===3) bhg=[p[0], p[1]+"."+p[2]];              /* 1.15.45 = 1 min 15.45 saat */
    else if(p.length===4) bhg=[p[0], p[1], p[2]+"."+p[3]];   /* 1.02.03.50 = 1 jam 2 min 3.50 saat */
    else bhg=[t];
  }
  bhg=bhg.map(x=>String(x).trim());
  if(bhg.some(x=>x===""||isNaN(Number(x)))) return NaN;
  if(bhg.length===1) return Number(bhg[0]);
  if(bhg.length===2) return Number(bhg[0])*60+Number(bhg[1]);
  return Number(bhg[0])*3600+Number(bhg[1])*60+Number(bhg[2]);
}
function fmtSaat(v,saatSahaja){
  const x=Number(v); if(!isFinite(x)) return "-";
  if(saatSahaja||x<60) return x.toFixed(2);
  const j=Math.floor(x/3600), b=x-j*3600;
  const m=Math.floor(b/60), s=b-m*60;
  const ss=(s<10?"0":"")+s.toFixed(2);
  return j>0 ? j+":"+(m<10?"0":"")+m+":"+ss : m+":"+ss;
}
/* Nilai + unit yang betul mengikut jenis acara */
function fmtNilai(v,info){
  const x=Number(v); if(v==null||!isFinite(x)) return "-";
  if((info&&info.JENIS)==="MASA"){
    const ss=isSaatSahaja(info&&info.ACARA);
    return fmtSaat(x,ss)+(ss||x<60?" saat":" min");
  }
  return x.toFixed(2)+((info&&info.UNIT)?" "+info.UNIT:"");
}
function fmtNilaiUnit(v,jenis,unit,nama){ return fmtNilai(v,{JENIS:jenis,UNIT:unit,ACARA:nama}); }


/* ---------- Format tarikh & masa ----------
   TARIKH : dd/MM/yyyy      MASA : 8.00am / 3.45pm                        */
function masaKunci(v){ /* HH:mm:ss untuk tujuan susunan sahaja */
  if(v===null||v===undefined||v==="") return "";
  if(v instanceof Date) return jamMY(v);
  const t=String(v).trim();
  if(t.indexOf("T")>-1 && /Z$/.test(t)){ const d=new Date(t); if(!isNaN(d)) return jamMY(d); }
  const m=t.match(/(\d{1,2}):(\d{2})(:(\d{2}))?/);
  return m?(("0"+m[1]).slice(-2)+":"+m[2]+":"+(m[4]||"00")):t;
}
function fmtMasa(v){
  const k=masaKunci(v);
  const m=k.match(/^(\d{2}):(\d{2})/);
  if(!m) return k;
  let h=Number(m[1]); const mm=m[2];
  const ap=h<12?"am":"pm";
  h=h%12; if(h===0) h=12;
  return h+"."+mm+ap;
}
function fmtTarikh(v){
  if(v===null||v===undefined||v==="") return "";
  let t;
  if(v instanceof Date) t=tarikhMY(v);
  else t=String(v).trim();
  const iso=t.match(/(\d{4})-(\d{2})-(\d{2})/);
  if(iso) return iso[3]+"/"+iso[2]+"/"+iso[1];
  const dmy=t.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);
  if(dmy) return ("0"+dmy[1]).slice(-2)+"/"+("0"+dmy[2]).slice(-2)+"/"+dmy[3];
  return t.slice(0,10);
}
/* Tarikh + masa penuh, cth: 27/07/2026 8.00am */
function fmtTarikhMasa(v){
  if(!v) return "";
  const s=String(v);
  const t=fmtTarikh(s), m=fmtMasa(s);
  return (t?t:"")+(m&&/\d{1,2}[:.]\d{2}/.test(s)?" "+m:"");
}

const HIST=[]; /* {view,ctx} tanpa entri semasa */
function go(v,c={}){
  if(VIEW && VIEW!==v){ HIST.push({view:VIEW,ctx:CTX}); }
  VIEW=v; CTX=c||{}; window.scrollTo(0,0); render();
  try{ history.pushState({view:v},"", "#"+v); }catch(e){}
}
function goBack(){
  const o=$("#ov"); if(o){ tutup(); return; }
  const p=HIST.pop();
  if(p){ VIEW=p.view; CTX=p.ctx; window.scrollTo(0,0); render(); }
  else { VIEW="home"; CTX={}; render(); }
}

function acaraAtlet(id){
  return ((DB&&DB.penyertaan)||[]).filter(p=>String(p["ATLET ID"])===String(id)).map(p=>String(p.ACARA||""));
}
function tapisKehadiran(){
  const q=kCari.trim().toLowerCase();
  const rec={}; (DB.kehadiran||[]).filter(k=>String(k.TARIKH).slice(0,10)===kTarikh).forEach(k=>rec[k["ATLET ID"]]=k);
  let list=(DB.atlet||[]).filter(a=>{
    if(!q) return true;
    if(String(a["NAMA PENUH"]).toLowerCase().includes(q)) return true;
    if(String(a.KATEGORI).toLowerCase().includes(q)) return true;
    if(String(a.SEKOLAH).toLowerCase().includes(q)) return true;
    return acaraAtlet(a.ID).some(n=>n.toLowerCase().includes(q));
  });
  if(kTapis!=="SEMUA"){
    list=list.filter(a=>{
      const st=rec[a.ID]?String(rec[a.ID].STATUS).toUpperCase():"";
      if(kTapis==="HADIR") return st==="HADIR";
      if(kTapis==="TIDAK") return st==="TIDAK HADIR";
      return !st; /* BELUM */
    });
  }
  return {list,rec};
}
function renderSenaraiKehadiran(){
  const kotak=$("#senaraiK"); if(!kotak) return;
  const {list,rec}=tapisKehadiran();
  kotak.innerHTML=list.map(a=>itemKehadiran(a,rec[a.ID])).join("")||`<div class="card small">Tiada atlet dijumpai.</div>`;
  const kk=$("#kKira"); if(kk) kk.textContent=list.length;
}
function cariKehadiran(el){
  kCari=el.value;
  renderSenaraiKehadiran();
}
function setTapisK(v){
  kTapis=v;
  document.querySelectorAll("#kTapisBar button").forEach(b=>b.classList.toggle("on", b.dataset.v===v));
  renderSenaraiKehadiran();
}
function vKehadiran(){
  const {list,rec}=tapisKehadiran();
  const semua=(DB.atlet||[]).length;
  const hadir=Object.values(rec).filter(k=>String(k.STATUS).toUpperCase()==="HADIR").length;
  const tidak=Object.values(rec).filter(k=>String(k.STATUS).toUpperCase()==="TIDAK HADIR").length;
  const belum=semua-hadir-tidak;
  const tab=(v,t)=>`<button class="${kTapis===v?"on":""}" data-v="${v}" onclick="setTapisK('${v}')">${t}</button>`;
  app().innerHTML=`${topbar("Kehadiran Atlet","home")}
  <div class="card">
    <div class="row"><div><label>Tarikh</label><input type="date" id="kt" value="${kTarikh}" onchange="kTarikh=this.value;render()"/></div>
    <div><label>Cari</label><input id="kc" value="${esc(kCari)}" placeholder="Nama / kategori / sekolah / acara (cth: 100M)" autocomplete="off" oninput="cariKehadiran(this)"/></div></div>
    <div class="tabs" id="kTapisBar" style="margin-top:10px">
      ${tab("SEMUA","Semua ("+semua+")")}
      ${tab("HADIR","Hadir ("+hadir+")")}
      ${tab("TIDAK","Tidak Hadir ("+tidak+")")}
      ${tab("BELUM","Belum Tanda ("+belum+")")}
    </div>
    <div class="small" style="margin-top:10px">Hadir: <b style="color:var(--ok)">${hadir}</b> / ${semua} atlet • Dipapar: <b id="kKira">${list.length}</b></div>
    ${bolehUrusAtlet()?`<button class="btn sm" style="margin-top:10px" onclick="formAtlet()">+ Tambah Atlet Baharu</button>`:`<div class="small" style="margin-top:8px">Hanya Master Admin atau jurulatih yang dilantik boleh menambah / memadam atlet.</div>`}
  </div>
  <div id="senaraiK">
  ${list.map(a=>itemKehadiran(a,rec[a.ID])).join("")||`<div class="card small">Tiada atlet dijumpai.</div>`}
  </div>`;
}
function itemKehadiran(a,k){
  const st=k?String(k.STATUS).toUpperCase():"";
  const bz=!!PENDING_KEH[a.ID];
  const ac=acaraAtlet(a.ID);
  return `<div class="item" id="ki-${esc(a.ID)}">
    <img class="av" src="${avatar(a)}" ${avErr(a)} alt="${esc(a["NAMA PENUH"])}"/>
    <div style="flex:1" onclick="go('profil',{id:'${esc(a.ID)}'})">
      <div class="nm">${esc(a["NAMA PENUH"])}</div>
      <div class="sub">${esc(a.KATEGORI)} • ${esc(a.SEKOLAH)}</div>
      ${ac.length?`<div class="sub" style="opacity:.85">🏃 ${esc(ac.slice(0,4).join(", "))}${ac.length>4?" +"+(ac.length-4):""}</div>`:``}
      ${st?`<div class="sub">Status: <b style="color:${st==="HADIR"?"var(--ok)":"var(--bad)"}">${esc(st)}</b>${bz?' <span class="pill warn">Loading</span>':''}</div>`:(bz?'<div class="sub"><span class="pill warn">Loading</span></div>':'')}
    </div>
    <div class="right">
      <button class="btn sm ${st==="HADIR"?"ok":"ghost"}" ${bz?"disabled":""} onclick="tandaHadir('${esc(a.ID)}','HADIR')">Hadir</button>
      <button class="btn sm ${st==="TIDAK HADIR"?"bad":"ghost"}" ${bz?"disabled":""} style="margin-top:6px" onclick="tandaHadir('${esc(a.ID)}','TIDAK HADIR')">Tidak</button>
    </div></div>`;
}
function kemasItemK(id){
  const el=document.getElementById("ki-"+id);
  const a=atletById(id); if(!a) return;
  const rec=(DB.kehadiran||[]).find(k=>String(k["ATLET ID"])===String(id) && String(k.TARIKH).slice(0,10)===kTarikh);
  if(kTapis!=="SEMUA" && !PENDING_KEH[id]){ renderSenaraiKehadiran(); return; }
  if(!el) return;
  el.outerHTML=itemKehadiran(a,rec);
}
async function tandaHadir(id,status){
  if(PENDING_KEH[id]) return;
  const a=atletById(id); if(!a) return;
  // Optimistic: kemas data tempatan + UI serta-merta
  setKehadiranLokal(id,kTarikh,status,a["NAMA PENUH"],a.KATEGORI,a.SEKOLAH);
  PENDING_KEH[id]=true; bumpPending(+1); kemasItemK(id);
  try{
    await api("kehadiran",{tarikh:kTarikh,atletId:id,nama:a["NAMA PENUH"],kategori:a.KATEGORI,sekolah:a.SEKOLAH,status,...who()});
  }catch(e){
    toastRalat(e);
  }finally{
    PENDING_KEH[id]=false; bumpPending(-1); kemasItemK(id);
  }
}

let MX_TAG_SELEPAS_DAFTAR=false;

/* ---------- Borang atlet (dengan gambar zoom/pan) ---------- */

    <label>Jantina</label><select id="fj"><option ${a&&String(a.JANTINA).startsWith("L")?"selected":""}>Lelaki</option><option ${a&&String(a.JANTINA).startsWith("P")?"selected":""}>Perempuan</option></select>

    <label>Sekolah</label><input id="fs" value="${esc(a?a.SEKOLAH:"")}"/>
    <label>Catatan / Maklumat Peribadi</label><textarea id="fc" rows="3">${esc(a?a.CATATAN:"")}</textarea>
    <button class="btn" id="btnSimpanAtlet" onclick="simpanAtlet(${a?"'"+esc(a.ID)+"'":"null"})">Simpan ke Google Sheet</button>
    <button class="btn ghost" onclick="tutup()">Batal</button>`);
}
async function simpanAtlet(id){
  const btn=$("#btnSimpanAtlet"); if(btn){btn.disabled=true;btn.textContent="Menyimpan…";}
  const p={nama:$("#fn").value.trim(),noIc:$("#fi").value.trim(),jantina:$("#fj").value,kategori:$("#fk").value.trim().toUpperCase(),sekolah:$("#fs").value.trim(),catatan:$("#fc").value.trim(),...who()};
  if(!p.nama){ if(btn){btn.disabled=false;btn.textContent="Simpan ke Google Sheet";} return toast("Nama wajib diisi"); }
  try{
    if(id){
      const r=await api("kemaskiniAtlet",{id,...p});
      // Gantikan rekod atlet tempatan dengan data terkini dari server supaya UI tak perlu refresh.
      const idx=(DB.atlet||[]).findIndex(a=>String(a.ID)===String(id));
      if(idx>-1 && r && r.atlet) DB.atlet[idx]=r.atlet;
      else{
        const at=atletById(id);
        if(at){ at["NAMA PENUH"]=p.nama; at["NO IC"]=p.noIc; at.JANTINA=p.jantina; at.KATEGORI=p.kategori; at.SEKOLAH=p.sekolah; at.CATATAN=p.catatan; }
      }
    }else{
      const r=await api("tambahAtlet",p);
      (DB.atlet=DB.atlet||[]).push({ID:r.id,"NAMA PENUH":p.nama,"NO IC":p.noIc,JANTINA:p.jantina,KATEGORI:p.kategori,SEKOLAH:p.sekolah,"GAMBAR (URL)":r.gambar||"",CATATAN:p.catatan,"DIDAFTAR OLEH":U.nama,"TARIKH DAFTAR":capMY()});
      if(MX_TAG_SELEPAS_DAFTAR&&isAdmin()){
        MX_TAG_SELEPAS_DAFTAR=false;
        tutup(); toast("Peserta didaftarkan — sila tag acara");
        VIEW="matriks"; vMatriks(); mxUbahAcara(r.id);
        return;
      }
    }
    MX_TAG_SELEPAS_DAFTAR=false;
    tutup(); render(); toast("Berjaya disimpan");
  }catch(e){ toastRalat(e); if(btn){btn.disabled=false;btn.textContent="Simpan ke Google Sheet";} }
}

/* Padam atlet — Master Admin atau jurulatih yang dilantik sahaja */
async function padamAtlet(id){
  if(!bolehPadamAtlet()) return toast("Hanya Master Admin boleh memadam atlet dari keseluruhan sistem.");
  const a=atletById(id); if(!a) return toast("Atlet tidak dijumpai");
  if(!confirm(`Padam atlet "${a["NAMA PENUH"]}"?\n\nSemua rekod kehadiran, penyertaan dan fail atlet ini akan turut dipadam. Tindakan ini tidak boleh dibatalkan.`)) return;
  try{
    await api("padamAtlet",{id,...who()});
    DB.atlet=(DB.atlet||[]).filter(x=>String(x.ID)!==String(id));
    DB.kehadiran=(DB.kehadiran||[]).filter(x=>String(x["ATLET ID"])!==String(id));
    DB.penyertaan=(DB.penyertaan||[]).filter(x=>String(x["ATLET ID"])!==String(id));
    DB.failAtlet=(DB.failAtlet||[]).filter(x=>String(x["ATLET ID"])!==String(id));
    if(DB.rekod) Object.keys(DB.rekod).forEach(k=>{ DB.rekod[k]=(DB.rekod[k]||[]).filter(x=>String(x["ATLET ID"])!==String(id)); });
    toast("Atlet dipadam dari semua acara & kehadiran"); go("kehadiran");
  }catch(e){ toastRalat(e); }
}

/* Menu tindakan acara (dropdown pada ikon ⋯) — Master Admin & Sub Admin sahaja */
function tutupDropdown(){ document.querySelectorAll(".dd-menu").forEach(m=>m.remove()); }
document.addEventListener("click",tutupDropdown);
window.addEventListener("resize",tutupDropdown);
window.addEventListener("scroll",tutupDropdown,true);

function menuAcara(n,btn){
  if(!isAdmin()) return toast("Hanya Master Admin & Sub Admin boleh menggunakan menu ini.");
  const buka=btn&&btn.dataset.ddOpen==="1";
  tutupDropdown();
  document.querySelectorAll("[data-dd-open]").forEach(b=>b.dataset.ddOpen="0");
  if(buka) return;
  const tanding=dipertandingkan(n);
  const m=document.createElement("div");
  m.className="dd-menu";
  m.onclick=e=>e.stopPropagation();
  m.innerHTML=`<div class="dd-tajuk">${esc(n)}</div>
  <button class="dd-item" onclick="tutupDropdown();formIkonAcara('${esc(n)}')">🎨 Ikon Acara</button>
  <button class="dd-item" onclick="tutupDropdown();tukarStatusAcara('${esc(n)}')">${tanding?"🚫 Tanda Digugurkan":"✅ Tanda Dipertandingkan"}</button>
  <button class="dd-item bad" onclick="tutupDropdown();padamAcara('${esc(n)}')">🗑 Padam Acara</button>`;
  document.body.appendChild(m);
  if(btn){
    btn.dataset.ddOpen="1";
    const r=btn.getBoundingClientRect(), lebar=m.offsetWidth||210, tinggi=m.offsetHeight||150;
    let kiri=r.right-lebar; if(kiri<8) kiri=8;
    if(kiri+lebar>window.innerWidth-8) kiri=window.innerWidth-lebar-8;
    let atas=r.bottom+6;
    if(atas+tinggi>window.innerHeight-8) atas=Math.max(8,r.top-tinggi-6);
    m.style.left=kiri+"px"; m.style.top=atas+"px";
  }
}



/* Drag & drop susunan acara — Master Admin sahaja */
let DRAG_EL=null;
function pasangDragAcara(){
  const wrap=document.getElementById("acaraWrap"); if(!wrap) return;
  wrap.querySelectorAll(".item[draggable=true]").forEach(el=>{
    el.addEventListener("dragstart",e=>{ DRAG_EL=el; el.classList.add("dragging"); e.dataTransfer.effectAllowed="move"; try{e.dataTransfer.setData("text/plain",el.dataset.acara)}catch(_){} });
    el.addEventListener("dragend",()=>{ el.classList.remove("dragging"); wrap.querySelectorAll(".item").forEach(x=>x.classList.remove("dragOver")); DRAG_EL=null; simpanSusunanAcara(); });
    el.addEventListener("dragover",e=>{ e.preventDefault(); if(!DRAG_EL||DRAG_EL===el) return; el.classList.add("dragOver");
      const r=el.getBoundingClientRect(); const selepas=(e.clientY-r.top)>r.height/2;
      wrap.insertBefore(DRAG_EL, selepas?el.nextSibling:el); });
    el.addEventListener("dragleave",()=>el.classList.remove("dragOver"));
    el.addEventListener("drop",e=>{ e.preventDefault(); el.classList.remove("dragOver"); });
    /* Sokongan sentuhan: tekan lama pada ikon untuk naik/turun */
    const h=el.querySelector(".dragHandle");
    if(h) h.addEventListener("touchstart",()=>{},{passive:true});
  });
}
async function simpanSusunanAcara(){
  const wrap=document.getElementById("acaraWrap"); if(!wrap) return;
  const senarai=[...wrap.querySelectorAll(".item")].map(el=>el.dataset.acara);
  if(!senarai.length) return;
  /* Kemaskini setempat dahulu supaya paparan kekal */
  senarai.forEach((n,i)=>{ const a=(DB.acara||[]).find(x=>String(x.ACARA)===String(n)); if(a) a.SUSUNAN=i+1; });
  try{ await api("susunAcara",{senarai,...who()}); toast("Susunan acara disimpan"); }
  catch(e){ toastRalat(e); }
}
async function padamAcara(n){
  if(!isAdmin()) return toast("Hanya Master Admin boleh memadam acara.");
  if(!confirm(`Padam acara "${n}"?\n\nSemua penyertaan, rekod latihan dan rekod kejohanan acara ini akan turut dipadam.`)) return;
  try{ await api("padamAcara",{acara:n,...who()});
    DB.acara=(DB.acara||[]).filter(a=>String(a.ACARA)!==String(n));
    DB.jurulatih=(DB.jurulatih||[]).filter(j=>String(j.ACARA)!==String(n));
    DB.penyertaan=(DB.penyertaan||[]).filter(p=>String(p.ACARA)!==String(n));
    DB.kejohanan=(DB.kejohanan||[]).filter(k=>String(k.ACARA)!==String(n));
    if(DB.rekod) delete DB.rekod[n];
    render(); toast("Acara dipadam");
  }catch(e){ toastRalat(e) }
}

    : `<div class="ikonPrev">${esc(String(IKON_EDIT.teks||"").slice(0,4))}</div>`;

async function ikonPilihFail(inp){
  const f=inp.files&&inp.files[0]; if(!f) return;
  try{
    syncShow("Memuat naik ikon");
    const dataUrl=await fileToDataUrl(f);
    const r=await api("muatNaikIkonAcara",{acara:IKON_EDIT.acara,gambarBase64:dataUrl,...who()});
    IKON_EDIT.url=r.url; IKON_EDIT.x=50; IKON_EDIT.y=50; IKON_EDIT.z=100;
    const w=document.getElementById("ikLaras"); if(w) w.classList.remove("hide");
    ["ikX","ikY"].forEach(id=>{const e=document.getElementById(id);if(e)e.value=50;});
    const z=document.getElementById("ikZ"); if(z) z.value=100;
    lukisIkonPrev(); toast("Gambar ikon dimuat naik");
  }catch(e){ toastRalat(e); }
  finally{ syncHide(); }
}
async function simpanIkonAcara(){
  if(!IKON_EDIT) return;

  const p={acara:IKON_EDIT.acara,ikon:String(IKON_EDIT.teks||"").toUpperCase().slice(0,4),
           ikonUrl:IKON_EDIT.url||"",ikonPos:IKON_EDIT.url?`${IKON_EDIT.x}%|${IKON_EDIT.y}%|${IKON_EDIT.z}`:""};
  try{
    await api("tetapkanIkonAcara",{...p,...who()});
    const a=acaraRow(p.acara);
    if(a){ a.IKON=p.ikon; a["IKON URL"]=p.ikonUrl; a["IKON POS"]=p.ikonPos; }
    tutup(); render(); toast("Ikon acara dikemas kini");
  }catch(e){ toastRalat(e); if(btn){btn.disabled=false;btn.textContent="Simpan Ikon";} }
}

/* ---------- Tag acara digugurkan / dipertandingkan ---------- */
async function tukarStatusAcara(n){
  if(!isAdmin()) return toast("Hanya Master Admin & Sub Admin boleh menggugurkan acara.");
  const tanding=dipertandingkan(n);
  const nilai=tanding?"TIDAK":"YA";
  const msg=tanding
    ? `Tandakan acara "${n}" sebagai TIDAK DIPERTANDINGKAN?\n\nAcara ini akan dipaparkan sebagai digugurkan dalam semua laporan dan rekod latihannya tidak lagi wajib diisi.`
    : `Tandakan semula acara "${n}" sebagai DIPERTANDINGKAN?`;
  if(!confirm(msg)) return;
  try{
    await api("tetapkanDipertandingkan",{acara:n,nilai,...who()});
    const a=acaraRow(n); if(a) a.DIPERTANDINGKAN=nilai;
    render(); toast(tanding?"Acara ditanda tidak dipertandingkan":"Acara ditanda dipertandingkan");
  }catch(e){ toastRalat(e); }
}

/* Acara MIX: lelaki & perempuan bertanding dalam acara yang sama, jadi
   senarai kategori BPL/BPP digabungkan menjadi satu kumpulan sahaja. */
function isAcaraMix(n){ return /(^|[^A-Z0-9])MIX([^A-Z0-9]|$)/i.test(String(n||"")); }
function katKunci(n,kat){
  const k=String(kat||"TANPA KATEGORI").toUpperCase().trim();
  if(!isAcaraMix(n)) return k;
  const g=k.replace(/[LP](?=\s*\d)/,"").replace(/\s+/g," ").trim();
  return "MIX "+(g||k);
}
let AD_KAT="__ALL__", AD_SORT="susun"; /* filter kategori + susunan */
const susunNo=p=>{const v=Number(p.SUSUNAN); return isFinite(v)&&v>0?v:9999;};
function vAcaraDetail(){
  const n=CTX.acara, info=acaraInfo(n), boleh=bolehRekod(n), jl=jurulatihAcara(n);
  const t=today();
  const semua=penyertaan(n);
  // Senarai kategori unik dalam acara ini (acara MIX: L & P digabung)
  const kats=[...new Set(semua.map(p=>katKunci(n,p.KATEGORI)).filter(Boolean))].sort();
  if(AD_KAT!=="__ALL__" && !kats.includes(AD_KAT)) AD_KAT="__ALL__";
  const pl=AD_KAT==="__ALL__"?semua:semua.filter(p=>katKunci(n,p.KATEGORI)===AD_KAT);
  // Susunan
  const nilai=(p)=>terbaik(n,p["ATLET ID"]);
  const bilHariIni=(p)=>rekodAcara(n).filter(r=>rekodMilik(r,p["ATLET ID"]) && String(r.TARIKH).slice(0,10)===t).length;
  const bilRekod=(p)=>rekodAcara(n).filter(r=>rekodMilik(r,p["ATLET ID"])).length;
  const asc=info.JENIS==="MASA"; /* MASA: kecil dulu; JARAK: besar dulu */
  const susun={
    susun:(a,b)=>susunNo(a)-susunNo(b) || String(a["NAMA ATLET"]).localeCompare(String(b["NAMA ATLET"])),
    nama:(a,b)=>String(a["NAMA ATLET"]).localeCompare(String(b["NAMA ATLET"])),
    terbaik:(a,b)=>{ const x=nilai(a),y=nilai(b); if(x==null&&y==null) return 0; if(x==null) return 1; if(y==null) return -1; return asc?x-y:y-x; },
    hariIni:(a,b)=>bilHariIni(b)-bilHariIni(a) || String(a["NAMA ATLET"]).localeCompare(String(b["NAMA ATLET"])),
    rekod:(a,b)=>bilRekod(b)-bilRekod(a) || String(a["NAMA ATLET"]).localeCompare(String(b["NAMA ATLET"])),
    sekolah:(a,b)=>String(a.SEKOLAH||"").localeCompare(String(b.SEKOLAH||"")) || String(a["NAMA ATLET"]).localeCompare(String(b["NAMA ATLET"]))
  };
  const sorted=pl.slice().sort(susun[AD_SORT]||susun.nama);
  // Pengumpulan mengikut kategori bila "Semua" dipilih
  const groups={};
  if(AD_KAT==="__ALL__"){
    sorted.forEach(p=>{ const k=katKunci(n,p.KATEGORI); (groups[k]=groups[k]||[]).push(p); });

    kats.map(k=>{

      return `<button class="${AD_KAT===k?"on":""}" onclick="AD_KAT='${esc(k)}';render()">${esc(k)} (${c})</button>`;
    }).join("")}</div>`;
  const dragOn=boleh && AD_SORT==="susun";
  const sortHtml=`<label>Susun ikut</label><select onchange="AD_SORT=this.value;render()">
    <option value="susun" ${AD_SORT==="susun"?"selected":""}>Susunan Jurulatih (seret ⠿)</option>
    <option value="nama" ${AD_SORT==="nama"?"selected":""}>Nama (A-Z)</option>
    <option value="terbaik" ${AD_SORT==="terbaik"?"selected":""}>Rekod Terbaik</option>
    <option value="hariIni" ${AD_SORT==="hariIni"?"selected":""}>Rekod Hari Ini (banyak dulu)</option>
    <option value="rekod" ${AD_SORT==="rekod"?"selected":""}>Jumlah Rekod (banyak dulu)</option>
    <option value="sekolah" ${AD_SORT==="sekolah"?"selected":""}>Sekolah</option>
  </select>`;

  app().innerHTML=`${topbar(n,"acara")}
  <div class="card">
    <span class="badge">${info.JENIS==="MASA"?"MASA (saat / minit — cth 1:15.45)":"JARAK (METER)"}</span>
    ${tagGugur(n)}
    ${dipertandingkan(n)?"":`<div class="small" style="margin-top:8px">⚠️ Acara ini telah digugurkan daripada pertandingan. Rekod latihan <b>tidak wajib</b> diisi dan acara ini ditandakan "${LABEL_GUGUR}" dalam semua laporan.</div>`}
    ${bolehTukarStatus(n)?`<div style="margin-top:8px"><button class="btn sm ghost" onclick="tukarStatusAcara('${esc(n)}')">${dipertandingkan(n)?"🚫 Tanda Digugurkan":"✅ Tanda Dipertandingkan"}</button></div>`:""}
    <div class="small" style="margin-top:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap">
      <span>Jurulatih dilantik (${jl.length}/10)</span>
      <button class="btn sm ghost" onclick="(function(el){var w=document.getElementById('jlListWrap');var show=w.style.display==='none';w.style.display=show?'block':'none';el.textContent=show?'Sembunyi senarai':'Papar senarai';})(this)">Papar senarai</button>
    </div>
    <div id="jlListWrap" style="display:none">${jl.map(j=>`<span class="chip">👤 ${esc(j["NAMA JURULATIH"])} ${boleh?`<a href="#" onclick="event.preventDefault();buangJ('${esc(n)}','${esc(j["EMEL JURULATIH"])}')" style="color:var(--bad)">✕</a>`:""}</span>`).join("")||'<span class="chip">Tiada</span>'}</div>
    ${boleh?`<button class="btn sm ghost" style="margin-top:10px" onclick="formJurulatih('${esc(n)}')">+ Lantik Jurulatih Pembantu</button>`:""}
    ${boleh?`<button class="btn sm" style="margin-top:10px" onclick="formPenyertaan('${esc(n)}')">+ Tambah Atlet ke Acara</button>`:`<div class="small" style="margin-top:10px">Hanya jurulatih acara ini atau Master Admin boleh menambah/merekod.</div>`}
    ${boleh && isBerpasukan(n)?`<button class="btn sm" style="margin-top:8px;background:var(--p2)" onclick="formRekodRelay('${esc(n)}')">👥 + Rekod Berpasukan</button><div class="small" style="margin-top:4px">Acara berpasukan — satu rekod dikongsi oleh semua atlet dalam pasukan.</div>`:""}
    <button class="btn ghost sm" style="margin-top:10px" onclick="go('sejarah',{acara:'${esc(n)}'})">🕘 Sejarah Rekod Acara</button>
  </div>
  <div class="card">
    <h3 style="margin:0 0 6px">Analisis Atlet</h3>
    <div class="small">Tapis mengikut kategori & susunan untuk memudahkan jurulatih menganalisis.</div>
    ${tabsHtml}
    ${sortHtml}
    ${boleh?`<div class="small" style="margin-top:8px">${dragOn
      ? "Seret ikon ⠿ untuk menyusun peserta. Susunan hanya boleh diubah <b>dalam kategori yang sama</b> dan disimpan automatik."
      : "Pilih <b>Susunan Jurulatih</b> untuk menyeret & menyusun peserta dalam kategori."}</div>`:""}
  </div>
  <div id="senaraiAD">
  ${Object.keys(groups).length===0?`<div class="card small">Belum ada atlet dalam acara ini.</div>`:
    Object.keys(groups).sort().map(k=>{
      const list=groups[k];
      const hdr=headerKategoriRekod(n,info,k,list.length,boleh);
      return hdr + `<div class="katGroup" data-kat="${esc(k)}">` + list.map(p=>itemAcaraDetail(n,p,info,boleh,t,dragOn)).join("") + `</div>`;
    }).join("")}
  </div>`;
  if(dragOn) pasangDragPeserta(n);
}

/* ---- Drag & drop susunan peserta (dalam kategori sahaja) ---- */
let DRAG_P=null;
function pasangDragPeserta(n){
  const wrap=document.getElementById("senaraiAD"); if(!wrap) return;
  wrap.querySelectorAll(".katGroup").forEach(grp=>{
    grp.querySelectorAll(".item[draggable=true]").forEach(el=>{
      el.addEventListener("dragstart",e=>{ DRAG_P=el; el.classList.add("dragging"); e.dataTransfer.effectAllowed="move"; try{e.dataTransfer.setData("text/plain",el.dataset.atlet||"")}catch(_){} });
      el.addEventListener("dragend",()=>{ el.classList.remove("dragging"); grp.querySelectorAll(".item").forEach(x=>x.classList.remove("dragOver")); const d=DRAG_P; DRAG_P=null; if(d) simpanSusunanPeserta(n,grp); });
      el.addEventListener("dragover",e=>{
        if(!DRAG_P||DRAG_P===el) return;
        if(DRAG_P.parentElement!==grp) return; /* kategori berbeza — tidak dibenarkan */
        e.preventDefault(); el.classList.add("dragOver");
        const r=el.getBoundingClientRect();
        const selepas=(e.clientY-r.top)>r.height/2;
        grp.insertBefore(DRAG_P, selepas?el.nextSibling:el);
      });
      el.addEventListener("dragleave",()=>el.classList.remove("dragOver"));
      el.addEventListener("drop",e=>{ e.preventDefault(); el.classList.remove("dragOver"); });
      const h=el.querySelector(".dragHandle");
      if(h){ h.addEventListener("touchstart",()=>{},{passive:true}); }
    });
  });
}
async function simpanSusunanPeserta(n,grp){
  const kategori=grp.dataset.kat||"";
  const senarai=[...grp.querySelectorAll(".item[data-atlet]")].map(x=>x.dataset.atlet);
  if(!senarai.length) return;
  senarai.forEach((id,i)=>{
    const p=(DB.penyertaan||[]).find(x=>x.ACARA===n && String(x["ATLET ID"])===String(id));
    if(p) p.SUSUNAN=i+1;
  });
  try{ await api("susunPeserta",{acara:n,kategori,senarai,...who()}); toast("Susunan peserta disimpan"); }
  catch(e){ toastRalat(e); render(); }
}

async function simpanKejohanan(n,id){
  const btn=$("#btnK"); const info=acaraInfo(n);
  const kategori=$("#kk").value.trim().toUpperCase();
  const mentah=$("#kv").value;
  const nilai=info.JENIS==="MASA"?huraiMasa(mentah):parseFloat(String(mentah).replace(",","."));
  if(!kategori) return toast("Kategori diperlukan");
  if(!(nilai>0)) return toast("Masukkan nilai rekod yang sah");
  if(btn){btn.disabled=true;btn.textContent="Menyimpan…";}
  const peringkat=$("#kn").value.trim().toUpperCase()||"MSSD";
  const p={acara:n,id:id||"",kategori,namaKejohanan:peringkat,tahun:$("#kt").value.trim(),
    pemegang:"",nilai,keputusan:fmtNilai(nilai,info),catatan:"",...who()};
  try{
    const r=await api("rekodKejohanan",p);
    DB.kejohanan=(DB.kejohanan||[]).filter(k=>!(String(k.ACARA)===n && String(k.KATEGORI).toUpperCase()===kategori && namaPeringkat(k)===peringkat) && String(k.ID)!==String(id||""));
    if(r&&r.rekod) DB.kejohanan.push(r.rekod);
    tutup(); render(); toast("Rekod kejohanan disimpan");
  }catch(e){ toastRalat(e); if(btn){btn.disabled=false;btn.textContent="Simpan";} }
}

function itemAcaraDetail(n,p,info,boleh,t,dragOn){
  const a=atletById(p["ATLET ID"])||{"NAMA PENUH":p["NAMA ATLET"],KATEGORI:p.KATEGORI,SEKOLAH:p.SEKOLAH,ID:p["ATLET ID"]};
  const b=terbaik(n,p["ATLET ID"]), hadir=hadirHariIni(p["ATLET ID"],t);
  const lagiBaik=(x,y)=>info.JENIS==="MASA"?x-y:y-x; /* terbaik dahulu */
  const rHariIni=rekodAcara(n).filter(r=>rekodMilik(r,p["ATLET ID"]) && String(r.TARIKH).slice(0,10)===t)
    .sort((x,y)=>{
      const vx=Number(x.NILAI), vy=Number(y.NILAI);
      const ox=isFinite(vx)&&vx>0, oy=isFinite(vy)&&vy>0;
      if(ox&&oy) return lagiBaik(vx,vy) || masaKunci(x.MASA).localeCompare(masaKunci(y.MASA));
      if(ox) return -1; if(oy) return 1;
      return masaKunci(x.MASA).localeCompare(masaKunci(y.MASA));
    });
  const bHariIni=rHariIni.length?Number(rHariIni[0].NILAI):null;
  const chips=rHariIni.length
    ? `<div style="margin-top:6px">${rHariIni.map((r,i)=>{
        const gaya=i===0?'style="cursor:pointer;border-color:var(--ok);color:var(--ok)"':'style="cursor:pointer"';
        return boleh
          ? `<span class="pill" ${gaya} onclick="event.stopPropagation();formEditRekod('${esc(n)}','${esc(r.ID)}')">${i===0?"★ ":""}${esc(r.KEPUTUSAN)} ✎</span>`
          : `<span class="pill" ${i===0?'style="border-color:var(--ok);color:var(--ok)"':""}>${i===0?"★ ":""}${esc(r.KEPUTUSAN)}</span>`;
      }).join("")}</div>`
    : "";
  const rp=String(p["REKOD PERIBADI"]||"").trim();
  /* Bandingkan pencapaian terbaik atlet dengan rekod kejohanan kategori dia */
  const rk=kejohananKat(n,p.KATEGORI);
  let jurang="";
  if(rk && b!==null && Number(rk.NILAI)>0){
    const target=Number(rk.NILAI);
    const capai=info.JENIS==="MASA"? b<=target : b>=target;
    const beza=Math.abs(b-target);
    jurang=capai
      ? `<span style="color:var(--ok)">• ✅ sudah mencapai rekod</span>`
      : `<span style="color:var(--warn)">• perlu ${info.JENIS==="MASA"?"laju":"tambah"} ${esc(fmtNilai(beza,info))} lagi</span>`;
  }
  const barisInfo=`<div class="sub" style="display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center">
    <span>🏅 Rekod Peribadi: <b>${rp?esc(rp):"-"}</b>${boleh?` <span class="pill" style="cursor:pointer" onclick="event.stopPropagation();formRekodPeribadi('${esc(n)}','${esc(p["ATLET ID"])}')">✎</span>`:""}</span>
    <span>⭐ Terbaik Latihan: <b>${b!==null?fmtNilai(b,info):"-"}</b></span>
    <span>📅 Terbaik Hari Ini: <b>${bHariIni!==null&&isFinite(bHariIni)&&bHariIni>0?fmtNilai(bHariIni,info):"-"}</b></span>
    ${rk?`<span>🏆 Sasaran (${esc(rk.KATEGORI)}): <b>${esc(rk.KEPUTUSAN||fmtNilai(Number(rk.NILAI),info))}</b></span>${jurang}`:""}

/* Keluarkan atlet dari acara — jurulatih acara atau Master Admin */
async function keluarAtletAcara(n,id){
  if(!bolehRekod(n)) return toast("Hanya jurulatih acara ini atau Master Admin boleh mengeluarkan atlet.");
  const a=atletById(id)||{}, nama=a["NAMA PENUH"]||id;
  if(!confirm(`Keluarkan "${nama}" dari acara ${n}?`)) return;
  const buangRekod=confirm("Padam sekali semua rekod latihan atlet ini bagi acara "+n+"?\n\nOK = padam rekod, Batal = simpan rekod.");
  try{
    await api("padamPenyertaan",{acara:n,atletId:id,padamRekod:buangRekod?1:0,...who()});
    DB.penyertaan=(DB.penyertaan||[]).filter(x=>!(x.ACARA===n && String(x["ATLET ID"])===String(id)));
    if(buangRekod && DB.rekod && DB.rekod[n]) DB.rekod[n]=DB.rekod[n].filter(x=>String(x["ATLET ID"])!==String(id));
    render(); toast("Atlet dikeluarkan dari acara");
  }catch(e){ toastRalat(e); }
}
/* Tanda kehadiran terus dari mod Rekod Latihan (jurulatih acara / Master Admin) */
async function tandaHadirAcara(n,id,status){
  if(!bolehRekod(n)) return toast("Hanya jurulatih acara ini atau Master Admin boleh menanda kehadiran.");
  if(PENDING_KEH[id]) return;
  const a=atletById(id)||{}; const t=today();
  setKehadiranLokal(id,t,status,a["NAMA PENUH"]||"",a.KATEGORI||"",a.SEKOLAH||"");
  PENDING_KEH[id]=true; bumpPending(+1); kemasItemAD(n,id);
  try{
    await api("kehadiran",{tarikh:t,atletId:id,nama:a["NAMA PENUH"]||"",kategori:a.KATEGORI||"",sekolah:a.SEKOLAH||"",status,...who()});
    toast(status==="HADIR"?"Kehadiran ditanda: HADIR":"Kehadiran ditanda: TIDAK HADIR");
  }catch(e){ toastRalat(e); }
  finally{ PENDING_KEH[id]=false; bumpPending(-1); kemasItemAD(n,id); }
}

async function padamRekod(n,id){

/* ---------- 8. Profil atlet — dengan Gambar (zoom/pan) + Fail lampiran ---------- */
/* ================= BMI ATLET =================
   Tinggi direkod SEKALI sahaja; berat boleh direkod bila-bila masa.
   Master Admin / Sub Admin / jurulatih dilantik boleh membetulkan kedua-duanya. */
const bolehUrusBmi=()=>bolehUrusAtlet();
const bmiSemua=()=>((DB&&DB.bmi)||[]);
const bmiAtlet=id=>bmiSemua().filter(b=>String(b["ATLET ID"])===String(id))
  .sort((a,b)=>String(b.TARIKH).localeCompare(String(a.TARIKH))||String(b["TARIKH & MASA"]).localeCompare(String(a["TARIKH & MASA"])));
const bmiTerkini=id=>bmiAtlet(id)[0]||null;
const tinggiAtlet=a=>Number((a&&(a["TINGGI (CM)"]||a.TINGGI))||0)||Number((bmiTerkini(a&&a.ID)||{})["TINGGI (CM)"]||0)||0;
function kiraBMI(berat,tinggi){ const b=Number(berat)||0,t=(Number(tinggi)||0)/100; if(!b||!t) return 0; return Math.round(b/(t*t)*10)/10; }
function statusBMI(v){ v=Number(v)||0; if(!v) return "-"; if(v<18.5) return "KURANG BERAT"; if(v<25) return "NORMAL"; if(v<30) return "BERLEBIHAN"; return "OBES"; }
function warnaBMI(v){ v=Number(v)||0; if(!v) return "var(--mut)"; if(v<18.5) return "var(--warn)"; if(v<25) return "var(--ok)"; if(v<30) return "var(--warn)"; return "var(--bad)"; }

/* Julat BMI optimum berbeza mengikut jenis acara olahraga */
const BMI_JULAT=[
  {ujian:/(lontar|peluru|cakera|lembing|tukul|balingan|rejam)/i, min:24.0, max:29.0, label:"Acara Balingan / Lontaran"},
  {ujian:/(bergalah|lompat\s*tinggi|lompat\s*kijang|lompat\s*tiga|lompat\s*jauh|lompat)/i, min:19.0, max:22.0, label:"Acara Lompatan"},
  {ujian:/(3000|5000|10000|merentas|marathon|maraton|jalan\s*kaki)/i, min:17.5, max:20.5, label:"Jarak Jauh"},
  {ujian:/(800|1500|2000)/i, min:18.5, max:21.5, label:"Jarak Sederhana"},
  {ujian:/(100|200|400|pagar|berganti|relay|lari\s*berganti)/i, min:20.0, max:23.5, label:"Pecut / Berpagar / Berganti-ganti"}
];
function bmiOptima(acara){
  const n=String(acara||"");
  for(const j of BMI_JULAT) if(j.ujian.test(n)) return j;
  return {min:18.5,max:24.0,label:"Umum"};
}
const bmiTeksJulat=o=>`${o.min.toFixed(1)} – ${o.max.toFixed(1)}`;
function nilaiBmiAcara(acara,bmi){
  const o=bmiOptima(acara), v=Number(bmi)||0;
  if(!v) return {status:"TIADA",o};
  if(v<o.min) return {status:"RENDAH",o,jurang:Math.round((o.min-v)*10)/10};
  if(v>o.max) return {status:"TINGGI",o,jurang:Math.round((v-o.max)*10)/10};
  return {status:"OPTIMUM",o,jurang:0};
}
/* Analisis BMI satu acara sepanjang sesi latihan */
function analisisBmiAcara(acara){
  const o=bmiOptima(acara);
  const senarai=penyertaan(acara).map(p=>{
    const id=String(p["ATLET ID"]), a=atletById(id)||{}, sej=bmiAtlet(id);
    const kini=sej[0]||null, awal=sej[sej.length-1]||null;
    const bmi=kini?Number(kini.BMI)||0:0;
    const n=nilaiBmiAcara(acara,bmi);
    return {id,nama:p["NAMA ATLET"]||a["NAMA PENUH"]||id,kategori:p.KATEGORI||a.KATEGORI||"-",sekolah:p.SEKOLAH||a.SEKOLAH||"-",
      tinggi:tinggiAtlet(a),berat:kini?Number(kini["BERAT (KG)"])||0:0,bmi,
      awal:awal?Number(awal.BMI)||0:0,ubah:(kini&&awal)?Math.round((Number(kini.BMI)-Number(awal.BMI))*10)/10:0,
      bilangan:sej.length,tarikh:kini?kini.TARIKH:"",status:n.status,jurang:n.jurang||0};
  }).sort((x,y)=>String(x.kategori).localeCompare(String(y.kategori))||String(x.nama).localeCompare(String(y.nama)));
  const adaData=senarai.filter(x=>x.bmi>0);
  const capai=adaData.filter(x=>x.status==="OPTIMUM");
  const belum=adaData.filter(x=>x.status!=="OPTIMUM");
  const tiada=senarai.filter(x=>!x.bmi);
  return {acara,o,senarai,adaData,capai,belum,tiada,
    purata:adaData.length?Math.round(adaData.reduce((s,x)=>s+x.bmi,0)/adaData.length*10)/10:0,
    peratus:adaData.length?Math.round(capai.length/adaData.length*100):0};
}

/* ---------- Kad BMI dalam profil atlet ---------- */
function kadBmi(a){
  const sej=bmiAtlet(a.ID), t=tinggiAtlet(a), kini=sej[0]||null;
  const bmi=kini?Number(kini.BMI)||0:0;
  const acaraDia=acaraList().filter(x=>penyertaan(x.ACARA).some(p=>String(p["ATLET ID"])===String(a.ID)));
  const boleh=bolehUrusBmi();
  const barisAcara=acaraDia.map(x=>{
    const n=nilaiBmiAcara(x.ACARA,bmi);
    const w=n.status==="OPTIMUM"?"var(--ok)":n.status==="TIADA"?"var(--mut)":"var(--warn)";
    const teks=n.status==="OPTIMUM"?"✅ Optimum":n.status==="TIADA"?"— Tiada data":(n.status==="RENDAH"?`▲ Perlu naik ${n.jurang}`:`▼ Perlu turun ${n.jurang}`);
    return `<div class="sub" style="display:flex;gap:8px;align-items:center"><span style="flex:1">${esc(x.ACARA)} <span style="opacity:.7">(optimum ${bmiTeksJulat(n.o)})</span></span><b style="color:${w}">${teks}</b></div>`;
  }).join("")||'<div class="sub">Belum ditag ke mana-mana acara.</div>';
  return `<div class="card">
    <div class="row" style="align-items:center"><div style="flex:1"><h3>⚖️ BMI &amp; Komposisi Badan</h3>
      <div class="small">Tinggi direkod sekali sahaja • berat boleh direkod bila-bila masa.</div></div>
      ${boleh?`<button class="btn sm" onclick="formBmi('${esc(a.ID)}')">+ Rekod Berat</button>`:""}
    </div>
    <div class="row" style="margin-top:10px">
      <div class="stat"><b>${t?t+" cm":"-"}</b><span class="small">Tinggi ${boleh?`<span class="pill" style="cursor:pointer" onclick="formTinggi('${esc(a.ID)}')">✎</span>`:""}</span></div>
      <div class="stat"><b>${kini?Number(kini["BERAT (KG)"]).toFixed(1)+" kg":"-"}</b><span class="small">Berat terkini</span></div>
      <div class="stat"><b style="color:${warnaBMI(bmi)}">${bmi?bmi.toFixed(1):"-"}</b><span class="small">${esc(statusBMI(bmi))}</span></div>
    </div>
    ${!t?`<div class="small" style="margin-top:8px;color:var(--warn)">⚠️ Tinggi belum ditetapkan — sila tetapkan tinggi sebelum merekod berat.</div>`:""}
    <hr/>
    <div class="small" style="margin-bottom:4px"><b>Penilaian BMI mengikut acara</b></div>
    ${barisAcara}
    <hr/>
    <div class="small" style="margin-bottom:4px"><b>Sejarah BMI sepanjang sesi latihan</b> (${sej.length} rekod)</div>
    ${sej.length?sejarahBmiHtml(sej,boleh):'<div class="sub">Belum ada rekod berat.</div>'}
  </div>`;
}
function sejarahBmiHtml(sej,boleh){
  const maxB=Math.max(...sej.map(x=>Number(x.BMI)||0),1);
  const graf=sej.slice(0,12).slice().reverse().map(x=>{
    const v=Number(x.BMI)||0, h=Math.max(6,Math.round(v/maxB*54));
    return `<div style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px" title="${esc(fmtTarikh(x.TARIKH))} — BMI ${v}">
      <span style="font-size:9px;color:var(--mut)">${v?v.toFixed(1):""}</span>
      <div style="width:100%;max-width:22px;height:${h}px;border-radius:6px 6px 0 0;background:${warnaBMI(v)};opacity:.85"></div></div>`;
  }).join("");
  return `<div style="display:flex;align-items:flex-end;gap:4px;height:78px;margin:6px 0 10px">${graf}</div>`
   + sej.slice(0,10).map(x=>`<div class="sub" style="display:flex;align-items:center;gap:8px">
      <span style="flex:1">• ${esc(fmtTarikh(x.TARIKH))} — <b>${Number(x["BERAT (KG)"]).toFixed(1)} kg</b> • BMI <b style="color:${warnaBMI(x.BMI)}">${Number(x.BMI).toFixed(1)}</b> <span class="chip">${esc(x.STATUS||statusBMI(x.BMI))}</span></span>
      ${boleh?`<button class="btn sm ghost" style="padding:2px 8px" onclick="formBmi('${esc(x["ATLET ID"])}','${esc(x.ID)}')">✎</button>
      <button class="btn sm bad" style="padding:2px 8px" onclick="padamBmi('${esc(x.ID)}')">🗑</button>`:""}
    </div>`).join("");
}

function formTinggi(id){
  const a=atletById(id); if(!a) return;
  const t=tinggiAtlet(a);

async function simpanTinggi(id){
  const b=$("#btnTinggi"), t=Number($("#bTinggi").value);

function formBmi(id,rekodId){
  const a=atletById(id); if(!a) return;

    <label>Berat (kg)</label><input id="bB" type="number" step="0.1" inputmode="decimal" value="${r?Number(r["BERAT (KG)"]):""}" placeholder="Cth: 52.5"/>
