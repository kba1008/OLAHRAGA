async function simpanBmi(id,rekodId){
  const a=atletById(id)||{}, btn=$("#btnBmi");
  const t=tinggiAtlet(a)||Number(($("#bT")||{}).value||0);
  const berat=Number($("#bB").value), tarikh=$("#bTk").value||today(), catatan=$("#bC").value.trim();
  if(!t) return toast("Sila isi tinggi atlet dahulu");
  if(!berat||berat<15||berat>250) return toast("Berat tidak munasabah (15–250 kg)");
  if(btn){btn.disabled=true;btn.textContent="Menyimpan…";}
  try{
    if(rekodId){
      const r=await api("kemaskiniBmi",{id:rekodId,tarikh,tinggi:t,berat,catatan,...who()});
      DB.bmi=(DB.bmi||[]).map(x=>String(x.ID)===String(rekodId)?(r&&r.rekod?r.rekod:x):x);
    }else{
      const r=await api("bmi",{atletId:id,nama:a["NAMA PENUH"]||"",kategori:a.KATEGORI||"",sekolah:a.SEKOLAH||"",tarikh,tinggi:t,berat,catatan,...who()});
      (DB.bmi=DB.bmi||[]).push((r&&r.rekod)||{ID:"tmp"+Date.now(),"ATLET ID":id,"NAMA ATLET":a["NAMA PENUH"]||"",KATEGORI:a.KATEGORI||"",SEKOLAH:a.SEKOLAH||"",TARIKH:tarikh,"TINGGI (CM)":t,"BERAT (KG)":berat,BMI:kiraBMI(berat,t),STATUS:statusBMI(kiraBMI(berat,t)),CATATAN:catatan});
      if(a && !a["TINGGI (CM)"]) a["TINGGI (CM)"]=t;
    }
    tutup(); render(); toast("Rekod BMI disimpan");
  }catch(e){ toastRalat(e); if(btn){btn.disabled=false;btn.textContent="Simpan";} }
}
async function padamBmi(rid){
  if(!confirm("Padam rekod BMI ini?")) return;
  try{ await api("padamBmi",{id:rid,...who()});
    DB.bmi=(DB.bmi||[]).filter(x=>String(x.ID)!==String(rid)); render(); toast("Rekod BMI dipadam");

}

async function onPilihFail(ev,id){
  const f=ev.target.files && ev.target.files[0]; if(!f) return;
  if(f.size > 8*1024*1024) return toast("Fail terlalu besar (>8MB). Sila mampatkan dahulu.");
  const b64=await fileToDataUrl(f);
  const list=$("#listFail");
  const tmp=document.createElement("div"); tmp.className="fileit"; tmp.innerHTML=`<div class="fileic">⏳</div><div style="flex:1"><div class="nm">${esc(f.name)}</div><div class="sub">Memuat naik…</div></div>`;
  list.prepend(tmp);
  bumpPending(+1);
  try{
    const r=await api("muatNaikFailAtlet",{atletId:id,namaFail:f.name,jenis:f.type,dataBase64:b64,...who()});
    (DB.failAtlet=DB.failAtlet||[]).push(r);
    tmp.outerHTML=itemFail(r);
    toast("Fail berjaya dimuat naik");
  }catch(e){ tmp.remove(); toastRalat(e); }
  finally{ bumpPending(-1); }
}
async function padamFail(id){
  if(!confirm("Padam fail ini?")) return;
  const el=document.getElementById("ff-"+id); if(el) el.style.opacity=.4;
  try{
    await api("padamFailAtlet",{id});
    DB.failAtlet=(DB.failAtlet||[]).filter(f=>String(f.ID)!==String(id));
    if(el) el.remove(); toast("Fail dipadam");
  }catch(e){ if(el) el.style.opacity=1; toastRalat(e); }
}
function fileToDataUrl(file){
  return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(file); });
}

function cropInit(){
  const box=$("#cropbox"), cv=$("#cropcv");
  CROP={img:null,scale:1,tx:0,ty:0};
  // muat gambar sedia ada jika ada URL
  const src=CTX && CTX.id ? (atletById(CTX.id)||{})["GAMBAR (URL)"] : "";
  if(src && src.startsWith("http")){
    const im=new Image(); im.crossOrigin="anonymous";
    im.onload=()=>{ CROP.img=im; cropReset(); };
    im.onerror=()=>{};
    im.src=src;
  }
  // interaksi
  let drag=false,lx=0,ly=0,pinch=null;
  const rect=()=>box.getBoundingClientRect();
  box.addEventListener("pointerdown",e=>{ box.setPointerCapture(e.pointerId); drag=true; lx=e.clientX; ly=e.clientY; });
  box.addEventListener("pointermove",e=>{
    if(!drag||!CROP.img) return;
    const r=rect(); const dx=(e.clientX-lx)*(cv.width/r.width); const dy=(e.clientY-ly)*(cv.height/r.height);
    CROP.tx+=dx; CROP.ty+=dy; lx=e.clientX; ly=e.clientY; cropDraw();
  });
  box.addEventListener("pointerup",()=>drag=false);
  box.addEventListener("pointercancel",()=>drag=false);
  box.addEventListener("wheel",e=>{ e.preventDefault(); cropZoom(e.deltaY<0?1.1:0.9); },{passive:false});
  cropDraw();
}
/* ---------- Kamera telefon (langsung) ---------- */
let CAM=null, CAM_FACE="environment";
function camSokong(){ return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia); }
async function cropKamera(face){
  if(face) CAM_FACE=face;
  if(!camSokong()) return $("#pkrKamera").click();   /* fallback: kamera asli telefon */
  camTutup();
  try{
    CAM=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:CAM_FACE},width:{ideal:1440},height:{ideal:1440}},audio:false});
    const v=$("#cropvid"); if(!v){ camTutup(); return; }
    v.srcObject=CAM; v.classList.remove("hide"); await v.play();
    const cb=$("#camBar"), rb=$("#cropBar"); if(cb) cb.hidden=false; if(rb) rb.hidden=true;
  }catch(e){ CAM=null; toast("Kamera tidak dapat dibuka — guna kamera telefon"); $("#pkrKamera").click(); }
}
function camTutup(){
  if(CAM){ try{ CAM.getTracks().forEach(t=>t.stop()); }catch(e){} CAM=null; }
  const v=$("#cropvid"); if(v){ v.classList.add("hide"); try{ v.srcObject=null; }catch(e){} }
  const cb=$("#camBar"), rb=$("#cropBar"); if(cb) cb.hidden=true; if(rb) rb.hidden=false;
}
function camTukar(){ cropKamera(CAM_FACE==="environment"?"user":"environment"); }
function camSnap(){
  const v=$("#cropvid");
  if(!v||!v.videoWidth) return toast("Kamera belum sedia, cuba sekejap lagi");
  const c=document.createElement("canvas"); c.width=v.videoWidth; c.height=v.videoHeight;
  c.getContext("2d").drawImage(v,0,0,c.width,c.height);
  const data=c.toDataURL("image/jpeg",0.92);
  camTutup();
  const im=new Image();
  im.onload=()=>{ CROP=CROP||{img:null,scale:1,tx:0,ty:0}; CROP.img=im; cropReset(); toast("Gambar diambil — laraskan zoom & kedudukan"); };
  im.src=data;
}
function cropReset(){
  if(!CROP||!CROP.img){ cropDraw(); return; }
  const cv=$("#cropcv"); const s=Math.max(cv.width/CROP.img.width, cv.height/CROP.img.height);
  CROP.scale=s; CROP.tx=(cv.width - CROP.img.width*s)/2; CROP.ty=(cv.height - CROP.img.height*s)/2; cropDraw();
}
function cropZoom(f){ if(!CROP||!CROP.img) return; const cv=$("#cropcv"); const cx=cv.width/2, cy=cv.height/2;
  CROP.tx = cx - (cx-CROP.tx)*f; CROP.ty = cy - (cy-CROP.ty)*f; CROP.scale*=f; cropDraw(); }
function cropDraw(){
  const cv=$("#cropcv"); if(!cv) return; const ctx=cv.getContext("2d");
  ctx.fillStyle="#050816"; ctx.fillRect(0,0,cv.width,cv.height);
  if(!CROP||!CROP.img){ ctx.fillStyle="#9fb0d9"; ctx.font="bold 22px system-ui"; ctx.textAlign="center"; ctx.fillText("Pilih gambar untuk mula",cv.width/2,cv.height/2); return; }
  ctx.drawImage(CROP.img, CROP.tx, CROP.ty, CROP.img.width*CROP.scale, CROP.img.height*CROP.scale);
}
function cropLoad(ev){
  const f=ev.target.files&&ev.target.files[0]; if(!f) return;
  const r=new FileReader(); r.onload=()=>{ const im=new Image(); im.onload=()=>{ CROP.img=im; cropReset(); }; im.src=r.result; }; r.readAsDataURL(f);
}
async function simpanGambar(id){
  if(!CROP||!CROP.img) return toast("Sila pilih gambar dahulu");
  const btn=$("#btnGmb"); if(btn){btn.disabled=true;btn.textContent="Menyimpan…";}
  const cv=$("#cropcv");
  const data=cv.toDataURL("image/jpeg",0.9);
  try{
    const r=await api("kemaskiniAtlet",{id, gambarBase64:data, ...who()});
    const at=atletById(id); if(at && r && r.gambar) at["GAMBAR (URL)"]=r.gambar;
    tutup(); render(); toast("Gambar dikemas kini");
  }catch(e){ toastRalat(e); if(btn){btn.disabled=false;btn.textContent="Simpan Gambar";} }
}

/* ================= LAPORAN RANKING BOLEH CETAK =================
   mod = "acara"  : Acara → Kategori → kedudukan atlet
   mod = "atlet"  : Kategori → Nama atlet (A-Z) → pencapaian setiap acara
   Kedua-duanya kekal tersusun mengikut KATEGORI.                 */
function kiraRanking(namaAcara){
  const info=acaraInfo(namaAcara), grp={};
  rekodAcara(namaAcara).forEach(r=>{
    const id=String(r["ATLET ID"]); if(!Number(r.NILAI)) return;
    const g=(grp[id]=grp[id]||{nama:r["NAMA ATLET"],kategori:katKunci(namaAcara,r.KATEGORI||"TIADA KATEGORI"),sekolah:r.SEKOLAH,v:[],rek:[]});
    g.v.push(Number(r.NILAI));
    g.rek.push({nilai:Number(r.NILAI),tarikh:r.TARIKH||""});
  });
  const asc=info.JENIS==="MASA";
  /* Rekod peribadi kejohanan lepas (dari senarai penyertaan) */
  const rpMap={};
  penyertaan(namaAcara).forEach(p=>{ const t=String(p["REKOD PERIBADI"]||"").trim(); if(t) rpMap[String(p["ATLET ID"])]=t; });
  const rank=Object.keys(grp).map(id=>({
    id,...grp[id],
    purata:purata(grp[id].v),
    terbaik:asc?Math.min.apply(null,grp[id].v):Math.max.apply(null,grp[id].v),
    rekodPeribadi:rpMap[id]||"",
    top3:grp[id].rek.slice().sort((a,b)=>asc?a.nilai-b.nilai:b.nilai-a.nilai).slice(0,3),
    n:grp[id].v.length
  }));
  /* Kedudukan dikira dalam kategori masing-masing */
  const ikutKat={};
  rank.forEach(r=>{ (ikutKat[r.kategori]=ikutKat[r.kategori]||[]).push(r); });
  Object.keys(ikutKat).forEach(k=>{
    ikutKat[k].sort((a,b)=>asc?a.terbaik-b.terbaik:b.terbaik-a.terbaik);
    ikutKat[k].forEach((r,i)=>{ r.kedudukan=i+1; });
  });
  return {info,rank,ikutKat,asc};
}

/* Rekod peribadi kejohanan lepas — dipaparkan merah */
function selRP(r){ return r.rekodPeribadi?`<span class="rp">${esc(r.rekodPeribadi)}</span>`:`<span style="color:#98a2b3">—</span>`; }
/* 3 rekod terbaik sepanjang tempoh latihan */
function selTop3(r,unit,jenis,nama){
  if(!r.top3||!r.top3.length) return `<span style="color:#98a2b3">—</span>`;
  return `<div class="t3">`+r.top3.map((t,i)=>`${i+1}. <b>${fmtNilaiUnit(t.nilai,jenis||(String(unit).toLowerCase()==="saat"?"MASA":"JARAK"),unit,nama||r.acara)}</b>${t.tarikh?` <span class="d">(${esc(fmtTarikh(t.tarikh))})</span>`:""}`).join("<br/>")+`</div>`;
}
/* Rekod kejohanan (per kategori) — untuk laporan */
function selRK(rk,info){
  const senarai=Array.isArray(rk)?rk:(rk?[rk]:[]);
  if(!senarai.length) return `<span style="color:#98a2b3">—</span>`;
  return senarai.map(x=>`<div><b style="color:#0b3b6f">🏆 ${esc(teksKejohanan(x,info))}</b></div>`).join("");
}

function cetakLaporan(mod){
  const senaraiAcara=acaraList();
  if(!senaraiAcara.length) return toast("Tiada acara untuk dilaporkan.");

  if(mod==="acara"){
    let isi="";
    senaraiAcara.forEach(ac=>{
      const n=ac.ACARA, {info,ikutKat}=kiraRanking(n);
      const kats=Object.keys(ikutKat).sort();
      isi+=`<div class="blok"><h2 class="acara">ACARA: ${esc(n)} <span style="font-weight:400;font-size:11px">(${esc(info.JENIS||"")}${info.UNIT?" • "+esc(info.UNIT):""}${info.JENIS==="MASA"?" • masa terendah = terbaik":" • nilai tertinggi = terbaik"})</span>${lblGugurCetak(n)}</h2>`;
      if(!dipertandingkan(n)) isi+=`<div class="kosong">Acara ini telah digugurkan — ${LABEL_GUGUR}. Rekod latihan tidak wajib diisi.</div>`;
      if(!kats.length){ isi+=`<div class="kosong">Tiada rekod bagi acara ini.</div></div>`; return; }
      kats.forEach(k=>{
        const rkSemua=kejohananKatSemua(n,k).filter(x=>Number(x.NILAI)>0);
        const rkTxt=rkSemua.length?` <span style="font-weight:400;text-transform:none;color:#0b3b6f">• 🏆 ${rkSemua.map(x=>esc(teksKejohanan(x,info))).join(" • ")}</span>`:"";
        isi+=`<h3 class="kat">Kategori: ${esc(k)} — ${ikutKat[k].length} atlet${rkTxt}</h3>
        <table><thead><tr><th>#</th><th>Nama Atlet</th><th>Sekolah</th><th style="text-align:right">Rekod Peribadi (Kejohanan Lepas)</th><th>3 Rekod Terbaik (Latihan)</th><th style="text-align:right">Terbaik</th><th style="text-align:right">Bil.</th></tr></thead><tbody>`;
        ikutKat[k].forEach(r=>{
          isi+=`<tr class="${r.kedudukan===1?"emas":""}"><td class="no">${r.kedudukan}</td><td>${esc(r.nama)}</td><td>${esc(r.sekolah||"-")}</td><td class="num">${selRP(r)}</td><td>${selTop3(r,info.UNIT,info.JENIS,info.ACARA)}</td><td class="num">${fmtNilai(r.terbaik,info)}</td><td class="num">${r.n}</td></tr>`;
        });
        isi+=`</tbody></table>`;
      });
      isi+=`</div>`;
    });
    return bukaLaporan("Laporan Ranking Mengikut Acara",isi+notaAcaraGugur());
  }

  /* mod === "atlet" : kekal tersusun mengikut kategori */
  const semua={}; /* kategori -> nama atlet -> baris */
  senaraiAcara.forEach(ac=>{
    const n=ac.ACARA, {info,ikutKat}=kiraRanking(n);
    Object.keys(ikutKat).forEach(k=>{
      ikutKat[k].forEach(r=>{
        const kat=semua[k]=semua[k]||{};
        (kat[r.nama]=kat[r.nama]||{sekolah:r.sekolah,baris:[]}).baris.push({
          acara:n,tanding:dipertandingkan(n),unit:info.UNIT||"",jenis:info.JENIS||"",terbaik:r.terbaik,n:r.n,kedudukan:r.kedudukan,jumlah:ikutKat[k].length,
          rekodPeribadi:r.rekodPeribadi,top3:r.top3,rk:PERINGKAT_KEJOHANAN.map(pk=>kejohananPeringkat(n,k,pk)).filter(Boolean),info:info
        });
      });
    });
  });
  const kats=Object.keys(semua).sort();
  if(!kats.length) return toast("Tiada rekod untuk dijana.");
  let isi="";
  kats.forEach(k=>{
    isi+=`<div class="blok"><h2 class="acara">KATEGORI: ${esc(k)}</h2>`;
    Object.keys(semua[k]).sort((a,b)=>a.localeCompare(b)).forEach(nama=>{
      const d=semua[k][nama];
      isi+=`<h3 class="kat">${esc(nama)} <span style="font-weight:400;text-transform:none;color:#667085">— ${esc(d.sekolah||"-")}</span></h3>
      <table><thead><tr><th>Acara</th><th style="text-align:right">Rekod Kejohanan (Kategori)</th><th style="text-align:right">Rekod Peribadi (Kejohanan Lepas)</th><th>3 Rekod Terbaik (Latihan)</th><th style="text-align:right">Terbaik</th><th style="text-align:right">Bil.</th><th style="text-align:right">Kedudukan Kategori</th></tr></thead><tbody>`;
      d.baris.sort((x,y)=>x.acara.localeCompare(y.acara)).forEach(b=>{
        isi+=`<tr class="${b.kedudukan===1?"emas":""}"><td>${esc(b.acara)}${b.tanding?"":lblGugurCetak(b.acara)}</td><td class="num">${selRK(b.rk,b.info)}</td><td class="num">${selRP(b)}</td><td>${selTop3(b,b.unit,b.jenis,b.acara)}</td><td class="num">${fmtNilaiUnit(b.terbaik,b.jenis,b.unit,b.acara)}</td><td class="num">${b.n}</td><td class="num">${b.kedudukan} / ${b.jumlah}</td></tr>`;
      });
      isi+=`</tbody></table>`;
    });
    isi+=`</div>`;
  });
  bukaLaporan("Laporan Ranking Mengikut Nama Atlet",isi+notaAcaraGugur());
}


/* ========== ANALISIS ANGGARAN PINGAT (banding MSSK & NO.3 MSSK) ==========
   Rekod TERBAIK LATIHAN setiap atlet dibandingkan dengan DUA sasaran:
     • Rekod MSSK        → jika dilepasi = HARAPAN EMAS
     • Rekod NO.3 MSSK   → jika dilepasi = HARAPAN PODIUM
   Jika belum melepasi NO.3 MSSK, jurang usaha dinyatakan.                */
function jurangPingat(terbaik,sasaran,jenis){
  return jenis==="MASA" ? (Number(terbaik)-Number(sasaran)) : (Number(sasaran)-Number(terbaik));
}
function fmtJurang(g,info){
  const x=Math.abs(Number(g));
  if((info&&info.JENIS)==="MASA") return x.toFixed(2)+" saat";
  return x.toFixed(2)+((info&&info.UNIT)?" "+info.UNIT:" meter");
}
/* Taraf harapan pingat */
const TARAF={
  EMAS:{kod:"EMAS",label:"HARAPAN EMAS",ikon:"🥇",warna:"#b45309"},
  PODIUM:{kod:"PODIUM",label:"HARAPAN PODIUM",ikon:"🥈",warna:"#0f766e"},
  HAMPIR:{kod:"HAMPIR",label:"HAMPIR PODIUM",ikon:"🔸",warna:"#b54708"},
  USAHA:{kod:"USAHA",label:"PERLU USAHA",ikon:"⬜",warna:"#667085"},
  TIADA_REKOD:{kod:"TIADA_REKOD",label:"TIADA REKOD LATIHAN",ikon:"⛔",warna:"#b42318"},
  TIADA_SASARAN:{kod:"TIADA_SASARAN",label:"TIADA REKOD KEJOHANAN",ikon:"⚠️",warna:"#b54708"}
};
const TARAF_URUTAN=["EMAS","PODIUM","HAMPIR","USAHA","TIADA_SASARAN","TIADA_REKOD"];
function analisisPingat(namaAcara){
  const info=acaraInfo(namaAcara), {ikutKat}=kiraRanking(namaAcara);
  /* Gabung kategori daripada rekod latihan + senarai penyertaan supaya
     atlet yang langsung TIADA rekod latihan turut dipaparkan. */
  const peta={};
  const kunci=k=>String(k||"TIADA KATEGORI").toUpperCase().trim()||"TIADA KATEGORI";
  Object.keys(ikutKat).forEach(k=>{
    const kk=kunci(k); peta[kk]=peta[kk]||{kategori:k,atlet:{}};
    ikutKat[k].forEach(r=>{ peta[kk].atlet[String(r.id)]={id:String(r.id),nama:r.nama,sekolah:r.sekolah,terbaik:Number(r.terbaik)}; });
  });
  penyertaan(namaAcara).forEach(p=>{
    const kk=kunci(p.KATEGORI); const id=String(p["ATLET ID"]);
    peta[kk]=peta[kk]||{kategori:String(p.KATEGORI||"TIADA KATEGORI"),atlet:{}};
    if(!peta[kk].atlet[id]) peta[kk].atlet[id]={id:id,nama:p["NAMA ATLET"],sekolah:p.SEKOLAH,terbaik:null};
  });
  const kategori=[];
  Object.keys(peta).sort().forEach(kk=>{
    const g=peta[kk];
    if(kategoriDigugur(namaAcara,g.kategori)) return; /* kategori digugurkan — tidak dibanding */
    const rkE=kejohananPeringkat(namaAcara,g.kategori,"MSSK");
    const rkP=kejohananPeringkat(namaAcara,g.kategori,"NO.3 MSSK");
    const adaEmas=!!(rkE&&Number(rkE.NILAI)>0);
    const adaPodium=!!(rkP&&Number(rkP.NILAI)>0);
    const sasEmas=adaEmas?Number(rkE.NILAI):null;
    const sasPodium=adaPodium?Number(rkP.NILAI):null;
    /* Sasaran utama untuk jurang usaha = NO.3 MSSK, jika tiada guna MSSK */
    const adaSasaran=adaPodium||adaEmas;
    const baris=Object.keys(g.atlet).map(id=>{
      const r=g.atlet[id];
      const adaRekod=Number(r.terbaik)>0;
      const jE=(adaRekod&&adaEmas)?jurangPingat(r.terbaik,sasEmas,info.JENIS):null;
      const jP=(adaRekod&&adaPodium)?jurangPingat(r.terbaik,sasPodium,info.JENIS):null;
      const lepasEmas=(jE!==null&&jE<=0);
      const lepasPodium=(jP!==null&&jP<=0);
      /* Jurang usaha yang dilaporkan */
      const jurang = jP!==null ? jP : jE;
      const sasaranRujuk = jP!==null ? sasPodium : sasEmas;
      let taraf;
      if(!adaRekod) taraf="TIADA_REKOD";
      else if(!adaSasaran) taraf="TIADA_SASARAN";
      else if(lepasEmas) taraf="EMAS";
      else if(lepasPodium) taraf="PODIUM";
      else taraf=(sasaranRujuk>0 && Math.abs(jurang)/sasaranRujuk<=0.10)?"HAMPIR":"USAHA";
      return Object.assign({},r,{
        adaRekod:adaRekod, adaSasaran:adaSasaran, adaEmas:adaEmas, adaPodium:adaPodium,
        jurangEmas:jE, jurangPodium:jP, jurang:jurang,
        lepasEmas:lepasEmas, lepasPodium:lepasPodium,
        layak:lepasEmas||lepasPodium, taraf:taraf,
        isyarat:(taraf==="TIADA_REKOD"||taraf==="TIADA_SASARAN")?TARAF[taraf].label:""
      });
    }).sort((a,b)=>{
      const w=x=>TARAF_URUTAN.indexOf(x.taraf);
      return w(a)-w(b) || ((a.jurang===null?0:a.jurang)-(b.jurang===null?0:b.jurang));
    });
    const bil=t=>baris.filter(b=>b.taraf===t).length;
    kategori.push({kategori:g.kategori, rkE:rkE, rkP:rkP, rk:rkP||rkE,
      adaEmas:adaEmas, adaPodium:adaPodium, adaSasaran:adaSasaran,
      sasaranEmas:sasEmas, sasaranPodium:sasPodium, sasaran:sasPodium!==null?sasPodium:sasEmas,
      baris:baris,
      bilEmas:bil("EMAS"), bilPodium:bil("PODIUM"), bilHampir:bil("HAMPIR"),
      bilLayak:baris.filter(b=>b.layak).length,
      bilTiadaRekod:bil("TIADA_REKOD")});
  });
  return {info:info,kategori:kategori};
}
/* Teks catatan bagi kolum "Anggaran / Usaha Diperlukan" */
function remakPingat(b,info){
  if(b.taraf==="TIADA_REKOD") return `<b style="color:#b42318">⛔ TIADA REKOD LATIHAN</b> — sila masukkan rekod latihan atlet ini.`;

  const perlu=info.JENIS==="MASA"?"pantaskan masa":"tambah jarak";
  return `<b style="color:${b.taraf==="HAMPIR"?"#b54708":"#667085"}">${b.taraf==="HAMPIR"?"🔸 HAMPIR PODIUM":"⬜ PERLU USAHA"}</b> — perlu ${perlu} <b>${fmtJurang(b.jurang,info)}</b> lagi untuk capai NO.3 MSSK${b.adaEmas&&b.jurangEmas!==null?`, atau <b>${fmtJurang(b.jurangEmas,info)}</b> untuk rekod MSSK`:""}.`;

/* ========== LAPORAN PRESTASI SETIAP ATLET (ringkas & padat) ==========
   Setiap atlet → senarai acara yang disertai + taraf (harapan emas /
   podium / menghampiri podium) + jurang tepat (masa atau jarak) yang
   masih perlu diperbaiki untuk naik ke podium & emas + strategi ringkas. */
function prestasiAtletSemua(){
  const peta={};
  acaraDipertanding().forEach(ac=>{
    const n=ac.ACARA, a=analisisPingat(n);
    a.kategori.forEach(g=>g.baris.forEach(b=>{
      const p=peta[b.id]=peta[b.id]||{id:String(b.id),nama:b.nama,sekolah:b.sekolah,kategori:g.kategori,acara:[]};
      if(!p.kategori) p.kategori=g.kategori;
      p.acara.push({acara:n,info:a.info,b:b,g:g});
    }));
  });
  Object.keys(peta).forEach(id=>{
    const p=peta[id];
    p.acara.sort((x,y)=>TARAF_URUTAN.indexOf(x.b.taraf)-TARAF_URUTAN.indexOf(y.b.taraf)||String(x.acara).localeCompare(String(y.acara)));
    p.bil={};
    TARAF_URUTAN.forEach(t=>{ p.bil[t]=p.acara.filter(r=>r.b.taraf===t).length; });
    p.taraf=(p.acara[0]&&p.acara[0].b.taraf)||"TIADA_REKOD";
  });
  return peta;
}
/* Jurang dalam bentuk peratus (untuk menilai acara paling hampir podium) */
function pctJurang(r){
  const s=Number(r.g.sasaran);
  if(!(s>0)||r.b.jurang===null) return null;
  return Math.abs(Number(r.b.jurang))/s*100;
}
/* Apa yang perlu dicapai untuk podium / emas */
function perluCapai(r){
  const info=r.info, b=r.b, g=r.g;
  if(b.taraf==="TIADA_REKOD") return "Belum ada rekod latihan — masukkan rekod dahulu.";
  if(b.taraf==="TIADA_SASARAN") return "Rekod MSSK / NO.3 MSSK belum ditetapkan.";
  const kerja=info.JENIS==="MASA"?"pantaskan":"tambah";
  const sasarEmas=g.adaEmas?`Sasaran emas: <b>${fmtNilai(g.sasaranEmas,info)}</b>`:"";
  if(b.taraf==="EMAS") return `✅ Sudah lepasi MSSK (+${fmtJurang(b.jurangEmas,info)}). Kekalkan prestasi & kestabilan.`;
  if(b.taraf==="PODIUM") return `✅ Podium selamat (+${fmtJurang(b.jurangPodium,info)} dari NO.3). Untuk emas: ${kerja} <b>${b.jurangEmas!==null?fmtJurang(b.jurangEmas,info):"—"}</b> lagi. ${sasarEmas}`;
  const kePodium=`Untuk podium: ${kerja} <b>${fmtJurang(b.jurang,info)}</b> lagi (sasaran <b>${fmtNilai(g.adaPodium?g.sasaranPodium:g.sasaranEmas,info)}</b>)`;
  const keEmas=(g.adaEmas&&b.jurangEmas!==null)?`; untuk emas: ${kerja} <b>${fmtJurang(b.jurangEmas,info)}</b>`:"";
  return kePodium+keEmas+".";
}
/* Strategi ringkas untuk ketua jurulatih */
function strategiAtlet(p){
  const emas=p.acara.filter(r=>r.b.taraf==="EMAS");
  const podium=p.acara.filter(r=>r.b.taraf==="PODIUM");
  const calon=p.acara.filter(r=>r.b.taraf==="HAMPIR"||r.b.taraf==="USAHA")
    .map(r=>({r:r,pct:pctJurang(r)}))
    .filter(x=>x.pct!==null).sort((a,b)=>a.pct-b.pct);
  const t=[];
  if(emas.length) t.push(`Pertahan emas di <b>${emas.map(r=>esc(r.acara)).join(", ")}</b> — kekalkan beban latihan & elak kecederaan.`);
  if(podium.length) t.push(`Tolak ke emas di <b>${esc(podium[0].acara)}</b> (perlu ${podium[0].b.jurangEmas!==null?fmtJurang(podium[0].b.jurangEmas,podium[0].info):"—"}).`);
  if(calon.length){
    const c=calon[0];
    t.push(`Fokus utama: <b>${esc(c.r.acara)}</b> — paling hampir podium (jurang ${fmtJurang(c.r.b.jurang,c.r.info)} ≈ ${c.pct.toFixed(1)}%).`);
    if(calon.length>1 && calon[calon.length-1].pct>25) t.push(`Pertimbang lepaskan <b>${esc(calon[calon.length-1].r.acara)}</b> (jurang ${calon[calon.length-1].pct.toFixed(0)}%) dan tumpu acara berpotensi.`);
  }
  if(p.bil.TIADA_REKOD) t.push(`${p.bil.TIADA_REKOD} acara tiada rekod latihan — perlu ujian prestasi.`);
  if(!t.length) t.push("Tetapkan rekod kejohanan (MSSK / NO.3 MSSK) supaya analisis boleh dibuat.");
  return t.join(" ");
}

/* Laporan boleh cetak — semua acara, disusun mengikut acara */
function cetakLaporanPingat(){
  const senarai=acaraDipertanding();
  if(!senarai.length) return toast("Tiada acara dipertandingkan untuk dilaporkan.");
  let isi="", ada=0;
  /* Ringkasan keseluruhan */
  const S={acara:0,unit:0,atlet:0,emas:0,podium:0,potensi:0,jauh:0,tiadaLatihan:0,tiadaSasaran:0,
           atletEmas:0,atletPodium:0,atletPotensi:0,atletJauh:0,atletTiadaLatihan:0,atletTiadaSasaran:0};
  const senaraiHarapan=[], senaraiPodium=[], senaraiPotensi=[], senaraiTiadaLatihan=[], senaraiTiadaSasaran=[];
  senarai.slice().sort((x,y)=>String(x.ACARA).localeCompare(String(y.ACARA))).forEach(ac=>{
    const n=ac.ACARA, a=analisisPingat(n), info=a.info;
    if(!a.kategori.length) return;
    ada++; S.acara++;
    isi+=`<div class="blok"><h2 class="acara">ACARA: ${esc(n)} <span style="font-weight:400;font-size:11px">(${esc(info.JENIS||"")}${info.UNIT?" • "+esc(info.UNIT):""})</span></h2>`;
    a.kategori.forEach(g=>{
      S.unit++; S.atlet+=g.baris.length;
      g.baris.forEach(b=>{
        if(b.taraf==="TIADA_REKOD") S.atletTiadaLatihan++;
        else if(b.taraf==="TIADA_SASARAN") S.atletTiadaSasaran++;
        else if(b.taraf==="EMAS") S.atletEmas++;
        else if(b.taraf==="PODIUM") S.atletPodium++;
        else if(b.taraf==="HAMPIR") S.atletPotensi++;
        else S.atletJauh++;
      });
      const semuaTiadaLatihan = g.bilTiadaRekod===g.baris.length;
      if(!g.adaSasaran){ S.tiadaSasaran++; senaraiTiadaSasaran.push(`${n} — ${g.kategori}`); }
      else if(semuaTiadaLatihan){ S.tiadaLatihan++; senaraiTiadaLatihan.push(`${n} — ${g.kategori}`); }
      else if(g.bilEmas>0){ S.emas++; senaraiHarapan.push(`${n} — ${g.kategori} (${g.bilEmas} atlet)`); }
      else if(g.bilPodium>0){ S.podium++; senaraiPodium.push(`${n} — ${g.kategori} (${g.bilPodium} atlet)`); }
      else if(g.bilHampir>0){ S.potensi++; senaraiPotensi.push(`${n} — ${g.kategori}`); }
      else S.jauh++;
      isi+=`<h3 class="kat">Kategori: ${esc(g.kategori)} — 🏆 MSSK: ${g.adaEmas?esc(nilaiRingkas(g.rkE,info)):"—"} • 🏆 NO.3 MSSK: ${g.adaPodium?esc(nilaiRingkas(g.rkP,info)):"—"}
        • <span style="color:#b45309">${g.bilEmas} harapan emas</span> • <span style="color:#0f766e">${g.bilPodium} harapan podium</span>${g.bilTiadaRekod?` • <span style="color:#b42318">${g.bilTiadaRekod} tiada rekod latihan</span>`:""}${g.adaSasaran?"":` • <span style="color:#b54708">⚠️ TIADA REKOD KEJOHANAN</span>`}</h3>
      <table><thead><tr><th>#</th><th>Nama Atlet</th><th>Sekolah</th><th style="text-align:right">Terbaik Latihan</th><th style="text-align:right">MSSK</th><th style="text-align:right">NO.3 MSSK</th><th>Taraf</th><th style="text-align:right">Jurang</th><th>Anggaran / Usaha Diperlukan</th></tr></thead><tbody>`;
      g.baris.forEach((b,i)=>{
        const d=TARAF[b.taraf]||TARAF.USAHA;
        isi+=`<tr class="${b.taraf==="EMAS"?"emas":""}"><td class="no">${i+1}</td><td>${esc(b.nama)}</td><td>${esc(b.sekolah||"-")}</td>
        <td class="num">${b.adaRekod?fmtNilai(b.terbaik,info):"—"}</td><td class="num">${g.adaEmas?fmtNilai(g.sasaranEmas,info):"—"}</td><td class="num">${g.adaPodium?fmtNilai(g.sasaranPodium,info):"—"}</td>
        <td style="color:${d.warna};font-weight:700">${d.ikon} ${d.label}</td>
        <td class="num" style="color:${d.warna};font-weight:700">${b.jurang===null?"—":(b.layak?"+":"-")+fmtJurang(b.jurang,info)}</td>
        <td>${remakPingat(b,info)}</td></tr>`;
      });
      isi+=`</tbody></table>`;
    });
    isi+=`</div>`;
  });
  if(!ada) return toast("Tiada data untuk laporan anggaran pingat.");
  const kotak=(warna,tajuk,nilai,nota)=>`<div style="flex:1;min-width:135px;border:1px solid #e5e7eb;border-left:4px solid ${warna};border-radius:8px;padding:8px 10px">

      <div style="font-size:10px;color:#667085">${nota}</div></div>`;
  const senaraiBlok=(tajuk,warna,arr)=>{
    const a=arr.filter(Boolean);
    if(!a.length) return "";
    return `<div style="margin-top:6px;font-size:11px"><b style="color:${warna}">${tajuk}:</b> ${esc(a.join(" ; "))}</div>`;
  };
  const ringkasan=`<div class="blok">
    <h2 class="acara">RINGKASAN ANGGARAN PUNGUTAN PINGAT</h2>
    <div style="display:flex;flex-wrap:wrap;gap:8px;margin:8px 0">

      ${kotak("#b45309","🥇 Harapan emas",S.emas,`${S.atletEmas} atlet lepasi rekod MSSK`)}
      ${kotak("#0f766e","🥈 Harapan podium",S.podium,`${S.atletPodium} atlet lepasi NO.3 MSSK`)}
      ${kotak("#b54708","Hampir podium (≤10%)",S.potensi,`${S.atletPotensi} atlet hampir sasaran`)}
      ${kotak("#667085","Perlu usaha lebih",S.jauh,`${S.atletJauh} atlet jurang >10%`)}
      ${kotak("#b42318","Belum ada rekod latihan",S.tiadaLatihan,`${S.atletTiadaLatihan} atlet tiada rekod langsung`)}
      ${kotak("#b54708","Tiada rekod kejohanan",S.tiadaSasaran,`Tidak dapat dibanding — sila tetapkan`)}
    </div>
    <div style="font-size:11px;color:#475467">Anggaran pungutan pingat: <b style="color:#b45309">${S.atletEmas} emas</b> dan <b style="color:#0f766e">${S.atletPodium} podium</b> berkemungkinan besar${S.atletPotensi?`, tambahan <b style="color:#b54708">${S.atletPotensi} atlet</b> jika berjaya menutup jurang ≤10%`:""}.</div>

    ${senaraiBlok("Acara tiada rekod kejohanan","#b54708",senaraiTiadaSasaran)}
  </div>`;

let mxCari="", mxSekolah="", mxKategori="", mxSortAtlet="kat-nama";
function sortAtlet(arr){
  const byNama=(x,y)=>String(x["NAMA PENUH"]||"").localeCompare(String(y["NAMA PENUH"]||""));
  const byKat=(x,y)=>String(x.KATEGORI||"").localeCompare(String(y.KATEGORI||""));
  const bySek=(x,y)=>String(x.SEKOLAH||"").localeCompare(String(y.SEKOLAH||""));
  const a=arr.slice();
  switch(mxSortAtlet){
    case "nama": return a.sort(byNama);
    case "sekolah-nama": return a.sort((x,y)=>bySek(x,y)||byNama(x,y));
    case "sekolah-kat": return a.sort((x,y)=>bySek(x,y)||byKat(x,y)||byNama(x,y));
    case "kat-sekolah": return a.sort((x,y)=>byKat(x,y)||bySek(x,y)||byNama(x,y));
    case "kat-nama": default: return a.sort((x,y)=>byKat(x,y)||byNama(x,y));
  }
}
function mxTapis(){
  const senaraiA=acaraList();
  const q=mxCari.trim().toLowerCase();
  const atlet=((DB&&DB.atlet)||[]).filter(a=>{
    if(mxSekolah && String(a.SEKOLAH||"")!==mxSekolah) return false;
    if(mxKategori && String(a.KATEGORI||"")!==mxKategori) return false;
    if(q){
      const s=(a["NAMA PENUH"]+" "+a.KATEGORI+" "+a.SEKOLAH+" "+(a["NO IC"]||"")).toLowerCase();
      if(!s.includes(q)) return false;
    }
    return true;
  });
  const atletSorted=sortAtlet(atlet);
  return {atlet:atletSorted, acara:senaraiA};
}

                return `<td class="cx ${on?"on":"off"}">${on?"✕":"·"}</td>`;
              }).join("")}
              <td class="tot">${set.size}${isAdmin()?`<button class="mx-editp no-print" title="Edit maklumat peserta" onclick="mxEditPeserta('${esc(id)}')">✎</button><button class="mx-del no-print" title="Padam peserta ini" onclick="mxPadamPeserta('${esc(id)}')">🗑</button>`:""}</td>
            </tr>`;
          }).join("")})()}
        </tbody>
        <tfoot>
          <tr>
            <td class="lbl" colspan="3">Jumlah Peserta / Acara</td>
            ${acara.map(ev=>`<td>${totLajur(ev.ACARA)}</td>`).join("")}
            <td>${totKeseluruhan}</td>
          </tr>
        </tfoot>
      </table>
    </div>
    <div class="mx-legend">
      <div class="lg"><span class="sw"></span> ✕ = Peserta berdaftar dalam acara</div>
      <div class="lg">· = Tidak menyertai</div>
      <div class="lg"><b>${atlet.length}</b> peserta • <b>${acara.length}</b> acara</div>
    </div>
    <div class="mx-foot">
      <div>Dokumen dijana oleh sistem AtletTraning</div>
      <div>Disahkan oleh: ${esc((U&&U.nama)||"—")} • ${esc((U&&U.jawatan)||"")}</div>
    </div>`}
  </div>`;
}

/* ---------- Matriks: tambah / padam peserta terus dari matriks ---------- */
function mxTambahPeserta(){
  if(!isAdmin()) return toast("Hanya Master Admin / Sub Admin boleh menambah peserta.");
  MX_TAG_SELEPAS_DAFTAR=true;
  formAtlet();
}
function mxEditPeserta(id){
  if(!isAdmin()) return toast("Hanya admin boleh edit peserta");
  formAtlet(id);
}
async function mxPadamPeserta(id){
  if(!isAdmin()) return toast("Hanya Master Admin / Sub Admin boleh memadam peserta.");
  const a=atletById(id); if(!a) return toast("Peserta tidak dijumpai");
  if(!confirm(`Padam peserta "${a["NAMA PENUH"]}"?\n\nSemua penyertaan acara, kehadiran, rekod dan fail peserta ini akan turut dipadam.`)) return;
  try{
    await api("padamAtlet",{id,...who()});
    DB.atlet=(DB.atlet||[]).filter(x=>String(x.ID)!==String(id));
    DB.kehadiran=(DB.kehadiran||[]).filter(x=>String(x["ATLET ID"])!==String(id));
    DB.penyertaan=(DB.penyertaan||[]).filter(x=>String(x["ATLET ID"])!==String(id));
    DB.failAtlet=(DB.failAtlet||[]).filter(x=>String(x["ATLET ID"])!==String(id));
    if(DB.rekod) Object.keys(DB.rekod).forEach(k=>{ DB.rekod[k]=(DB.rekod[k]||[]).filter(x=>String(x["ATLET ID"])!==String(id)); });
    toast("Peserta dipadam"); vMatriks();
  }catch(e){ toastRalat(e); }
}

/* ---------- Master Admin: ubah acara peserta secara pukal ---------- */
function mxUbahAcara(id){
  if(!isAdmin()) return toast("Hanya Master Admin boleh mengubah acara peserta.");
  const a=atletById(id); if(!a) return toast("Atlet tidak dijumpai");
  const semua=acaraList();
  const ada=new Set(semua.filter(ev=>penyertaan(ev.ACARA).some(p=>String(p["ATLET ID"])===String(id))).map(ev=>ev.ACARA));
  const baris=semua.map(ev=>{
    const cari=(String(ev.ACARA||"")+" "+String(ev.JENIS||"")).toLowerCase();
    return `<label class="atletPick" data-cari="${esc(cari)}" style="display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.06);cursor:pointer">
      <input type="checkbox" class="mxAc" value="${esc(ev.ACARA)}" ${ada.has(ev.ACARA)?"checked":""}/>
      <span style="flex:1;min-width:0"><div style="font-weight:600">${esc(ev.ACARA)}</div><div class="small">${esc(ev.JENIS==="MASA"?"Masa":"Jarak")}${ev.MOD?" • "+esc(ev.MOD):""}</div></span>
    </label>`;
  }).join("");
  overlay(`<div class="big">Ubah Acara — ${esc(a["NAMA PENUH"]||"")}</div>
  <div class="small">${esc(a.KATEGORI||"")} • ${esc(a.SEKOLAH||"")}</div>
  <p class="small">Tanda semua acara yang disertai peserta ini, kemudian Simpan. Tiada syarat kehadiran bagi Master Admin.</p>
  <label>Cari acara</label>
  <input id="paCari" placeholder="Taip nama acara…" autocomplete="off" oninput="tapisAtletPick(this.value)"/>
  <div id="paSenarai" style="max-height:45vh;overflow:auto;border:1px solid rgba(255,255,255,.12);border-radius:10px;margin-top:6px">${baris||'<div class="small" style="padding:10px">Tiada acara aktif.</div>'}</div>
  <div class="small" id="paKira" style="margin-top:4px">${semua.length} acara</div>
  <button class="btn" id="btnMX" onclick="simpanAcaraAtlet('${esc(id)}')">Simpan</button>
  <button class="btn ghost" onclick="tutup()">Batal</button>`);
}
async function simpanAcaraAtlet(id){
  const btn=$("#btnMX"); if(btn){btn.disabled=true;btn.textContent="Menyimpan…";}
  const a=atletById(id)||{};
  const pilih=[...document.querySelectorAll("#paSenarai input.mxAc:checked")].map(el=>el.value);
  try{
    await api("tetapkanAcaraAtlet",{atletId:id,acara:pilih.join("|"),...who()});
    const kekal=new Set(pilih);
    DB.penyertaan=(DB.penyertaan||[]).filter(p=>String(p["ATLET ID"])!==String(id)||kekal.has(p.ACARA));
    const sedia=new Set((DB.penyertaan||[]).filter(p=>String(p["ATLET ID"])===String(id)).map(p=>p.ACARA));
    pilih.forEach(n=>{ if(!sedia.has(n)) DB.penyertaan.push({ACARA:n,"ATLET ID":id,"NAMA ATLET":a["NAMA PENUH"],KATEGORI:a.KATEGORI,SEKOLAH:a.SEKOLAH,"REKOD PERIBADI":"","DIMASUKKAN OLEH":U.nama,TARIKH:capMY()}); });
    tutup(); render(); toast("Acara peserta dikemas kini ("+pilih.length+" acara)");
  }catch(e){ toastRalat(e); if(btn){btn.disabled=false;btn.textContent="Simpan";} }
}

  </div>
  <div class="card"><button class="btn bad" onclick="keluarTeknision()">Keluar Mod Teknision</button></div>`;

/* ---------- Overlay ---------- */
function overlay(html){
  const d=document.createElement("div"); d.className="ov"; d.id="ov";
  d.innerHTML=`<div class="sheet">${html}</div>`;
  d.addEventListener("click",e=>{ if(e.target===d) tutup(); });
  document.body.appendChild(d);
  try{ history.pushState({ov:1},"", "#ov"); }catch(e){}
}
function tutup(){ try{ camTutup(); }catch(e){} const o=$("#ov"); if(o) o.remove(); }

/* ---------- Mula ---------- */
if("serviceWorker" in navigator){
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("./sw.js").then(reg=>{
      /* Semak versi baharu app secara berkala & bila app dibuka semula */
      const semak=()=>{ try{ reg.update(); }catch(e){} };
      setInterval(semak,60000);
      document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") semak(); });
    }).catch(()=>{});
    /* Bila SW baharu mengambil alih → muat semula sekali supaya app terus terkini */
    let dahMuatSemula=false;
    navigator.serviceWorker.addEventListener("controllerchange",()=>{
      if(dahMuatSemula) return; dahMuatSemula=true; location.reload();
    });
  });
}
try{ history.replaceState({view:"home"},"", "#home"); }catch(e){}
render();
</script>
