<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>AtletTrack — Kehadiran & Rekod Latihan Atlet</title>
<meta name="description" content="Sistem kehadiran atlet dan rekod prestasi latihan pusat. Pangkalan data Google Sheet." />
<meta name="theme-color" content="#4f2df5" />
<link rel="manifest" href="./manifest.json" />
<style>
:root{
  --bg:#070b1e; --bg2:#0d1330; --card:rgba(255,255,255,.06); --line:rgba(255,255,255,.14);
  --txt:#f2f5ff; --mut:#9fb0d9;
  --p1:#6d28f9; --p2:#00c6ff; --p3:#ff2d95; --ok:#00e08a; --warn:#ffc400; --bad:#ff4d6d;
  --grad:linear-gradient(135deg,#6d28f9,#00c6ff 55%,#ff2d95);
  --sh:0 18px 40px -18px rgba(0,0,0,.85),0 2px 0 rgba(255,255,255,.09) inset;
  --r:20px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--txt);
  background:
    radial-gradient(900px 500px at 10% -5%,rgba(109,40,249,.45),transparent 60%),
    radial-gradient(800px 480px at 95% 8%,rgba(0,198,255,.32),transparent 60%),
    radial-gradient(700px 500px at 50% 105%,rgba(255,45,149,.28),transparent 60%),
    var(--bg);
  min-height:100vh;padding-bottom:96px
}
.wrap{max-width:880px;margin:0 auto;padding:16px}
.hide{display:none!important}
h1,h2,h3{margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--sh);backdrop-filter:blur(14px);margin-bottom:14px}
.badge{display:inline-block;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:800;letter-spacing:.4px;background:var(--grad);box-shadow:0 6px 14px -6px var(--p1)}
.chip{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;background:rgba(255,255,255,.1);border:1px solid var(--line);color:var(--mut);margin:2px 4px 2px 0}
label{display:block;font-size:12px;font-weight:700;color:var(--mut);margin:10px 0 5px;letter-spacing:.3px}
input,select,textarea{width:100%;padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:rgba(4,8,26,.7);color:var(--txt);font-size:15px;outline:none;font-family:inherit}
input:focus,select:focus,textarea:focus{border-color:var(--p2);box-shadow:0 0 0 3px rgba(0,198,255,.2)}
option{background:#0d1330}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px 16px;margin-top:12px;border:0;border-radius:16px;font-size:15px;font-weight:800;color:#fff;cursor:pointer;
  background:var(--grad);box-shadow:0 12px 26px -12px var(--p1),0 1px 0 rgba(255,255,255,.35) inset;transition:transform .12s,filter .12s}
.btn:active{transform:translateY(2px) scale(.99);filter:brightness(1.1)}
.btn.ghost{background:rgba(255,255,255,.07);border:1px solid var(--line);box-shadow:none}
.btn.sm{width:auto;padding:9px 14px;font-size:13px;margin-top:0}
.btn.ok{background:linear-gradient(135deg,#00e08a,#00b3ff)}
.btn.bad{background:linear-gradient(135deg,#ff4d6d,#ff9500)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1;min-width:140px}
.grid3{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:640px){.grid3{grid-template-columns:repeat(3,1fr)}}
.tile{position:relative;border-radius:26px;padding:26px 18px;text-align:center;cursor:pointer;color:#fff;border:1px solid rgba(255,255,255,.22);
  box-shadow:0 26px 44px -22px rgba(0,0,0,.95),0 2px 0 rgba(255,255,255,.4) inset,0 -8px 18px -12px rgba(0,0,0,.7) inset;
  transition:transform .16s ease, box-shadow .16s ease;overflow:hidden}
.tile:active{transform:translateY(4px) scale(.985)}
.tile:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.3),rgba(255,255,255,0) 45%);pointer-events:none}
.t1{background:linear-gradient(150deg,#7a2bff,#3d0fb0)}
.t2{background:linear-gradient(150deg,#00d4ff,#0067b8)}
.t3{background:linear-gradient(150deg,#ff2d95,#ff8a00)}
.tile .ic{font-size:40px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.5))}
.tile .tt{font-size:18px;font-weight:900;margin-top:8px;letter-spacing:.3px}
.tile .ts{font-size:12px;opacity:.9;margin-top:3px}
.item{display:flex;align-items:center;gap:12px;padding:12px;border-radius:18px;background:rgba(255,255,255,.055);border:1px solid var(--line);margin-bottom:10px;box-shadow:0 10px 22px -18px #000}
.av{width:48px;height:48px;border-radius:14px;object-fit:cover;background:#111a3d;border:1px solid var(--line);flex:0 0 auto}
.nm{font-weight:800;font-size:14px;line-height:1.25}
.sub{font-size:11.5px;color:var(--mut);margin-top:3px}
.right{margin-left:auto;text-align:right}
.small{font-size:11.5px;color:var(--mut)}
.top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.back{background:rgba(255,255,255,.09);border:1px solid var(--line);color:#fff;border-radius:12px;padding:8px 12px;font-weight:800;cursor:pointer}
.rank{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:900;background:var(--grad);box-shadow:0 8px 18px -10px var(--p2)}
.g1{background:linear-gradient(135deg,#ffd700,#ff9500)}
.g2{background:linear-gradient(135deg,#dfe7f5,#9aa9c4)}
.g3{background:linear-gradient(135deg,#d9822b,#8a4b12)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#101838;border:1px solid var(--line);padding:13px 18px;border-radius:14px;z-index:99;max-width:90%;font-size:13.5px;box-shadow:var(--sh);text-align:center}
.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(8,12,32,.93);border-top:1px solid var(--line);display:flex;padding:8px 6px calc(8px + env(safe-area-inset-bottom));backdrop-filter:blur(16px);z-index:50}
.nav button{flex:1;background:none;border:0;color:var(--mut);font-size:11px;font-weight:800;padding:6px 2px;cursor:pointer}
.nav button.on{color:#fff}
.nav .ni{display:block;font-size:19px}
.hd{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.logo{width:44px;height:44px;border-radius:14px;background:var(--grad);display:flex;align-items:center;justify-content:center;font-weight:900;box-shadow:0 12px 24px -10px var(--p1)}
.stat{text-align:center;padding:12px;border-radius:16px;background:rgba(255,255,255,.06);border:1px solid var(--line)}
.stat b{display:block;font-size:22px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px}
.tabs button{white-space:nowrap;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--mut);font-weight:800;font-size:12.5px;cursor:pointer}
.tabs button.on{background:var(--grad);color:#fff;border-color:transparent}
.sp{width:34px;height:34px;border:3px solid rgba(255,255,255,.15);border-top-color:var(--p2);border-radius:50%;animation:s 1s linear infinite;margin:24px auto}
@keyframes s{to{transform:rotate(360deg)}}
.ov{position:fixed;inset:0;background:rgba(4,7,20,.82);display:flex;align-items:flex-end;justify-content:center;z-index:80;backdrop-filter:blur(6px)}
.sheet{background:#0d1330;border:1px solid var(--line);border-radius:24px 24px 0 0;padding:18px;width:100%;max-width:880px;max-height:88vh;overflow:auto;box-shadow:0 -20px 50px -20px #000}
.big{font-size:20px;font-weight:900}
hr{border:0;border-top:1px solid var(--line);margin:14px 0}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="sp"></div></div>
<div class="nav hide" id="nav"></div>

<script>
/* ============================================================
   AtletTrack — PWA
   SUMBER DATA TUNGGAL: Google Sheet (melalui Apps Script Web App)
   Tiada data disimpan dalam app kecuali sesi log masuk peranti.
   ============================================================ */
/* === URL GOOGLE APPS SCRIPT (PANGKALAN DATA GOOGLE SHEET) === */
const API_URL_LALAI="https://script.google.com/macros/s/AKfycbyvn_u8mavtiVeMdjkLSVVxv8fA9vjh9nL8LTZE3O1xt2UP5t3lZcZZqAbEfGEcaib9BQ/exec";
const LS_API="at_api_url", LS_USER="at_user";
let API=localStorage.getItem(LS_API)||API_URL_LALAI;
let U=null; try{U=JSON.parse(localStorage.getItem(LS_USER)||"null")}catch(e){}
let DB=null, VIEW="home", CTX={};

const $=s=>document.querySelector(s), app=()=>$("#app");
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const isAdmin=()=>U&&U.peranan==="ADMIN";

function toast(m,ms=2600){const d=document.createElement("div");d.className="toast";d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),ms)}
function loading(t="Memuatkan data dari Google Sheet..."){app().innerHTML=`<div class="card" style="text-align:center"><div class="sp"></div><div class="small">${esc(t)}</div></div>`}

/* ---------- Panggilan API (JSONP -> tiada isu CORS) ---------- */
function api(action,payload={}){
  return new Promise((res,rej)=>{
    if(!API) return rej(new Error("URL Google Apps Script belum ditetapkan."));
    const cb="cb_"+Math.random().toString(36).slice(2);
    const s=document.createElement("script");
    const t=setTimeout(()=>{cleanup();rej(new Error("Sambungan tamat masa. Semak URL / sambungan internet."))},45000);
    function cleanup(){clearTimeout(t);delete window[cb];s.remove()}
    window[cb]=r=>{cleanup(); r&&r.ok?res(r.data):rej(new Error(r&&r.error||"Ralat tidak diketahui"))};
    s.onerror=()=>{cleanup();rej(new Error("Gagal menghubungi Google Sheet."))};
    s.src=API+(API.includes("?")?"&":"?")+"callback="+cb+"&payload="+encodeURIComponent(JSON.stringify({action,...payload}));
    document.body.appendChild(s);
  });
}
const who=()=>({olehNama:U?U.nama:"",olehEmel:U?U.emel:""});

/* ---------- Avatar ikut jantina ---------- */
function avatar(a){
  if(a["GAMBAR (URL)"]) return esc(a["GAMBAR (URL)"]);
  const p=String(a["JANTINA"]||"").toUpperCase().startsWith("P");
  const c1=p?"#ff2d95":"#00c6ff", c2=p?"#8a2be2":"#6d28f9";
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><linearGradient id="a" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient></defs><rect width="100" height="100" fill="url(#a)"/><circle cx="50" cy="38" r="17" fill="#fff" opacity=".92"/><path d="M15 96c3-22 18-32 35-32s32 10 35 32z" fill="#fff" opacity=".92"/></svg>`;
  return "data:image/svg+xml;utf8,"+encodeURIComponent(svg);
}

/* ---------- Bantuan data ---------- */
const acaraList=()=>((DB&&DB.acara)||[]).filter(a=>String(a.AKTIF||"YA").toUpperCase()!=="TIDAK");
const acaraInfo=n=>acaraList().find(a=>a.ACARA===n)||{JENIS:"MASA",UNIT:"saat"};
const atletById=id=>((DB&&DB.atlet)||[]).find(a=>String(a.ID)===String(id));
const jurulatihAcara=n=>((DB&&DB.jurulatih)||[]).filter(j=>j.ACARA===n);
const bolehRekod=n=>isAdmin()||jurulatihAcara(n).some(j=>String(j["EMEL JURULATIH"]).toLowerCase()===String(U.emel).toLowerCase());
const penyertaan=n=>((DB&&DB.penyertaan)||[]).filter(p=>p.ACARA===n);
const rekodAcara=n=>((DB&&DB.rekod&&DB.rekod[n])||[]);
const hadirHariIni=(id,tarikh)=>((DB&&DB.kehadiran)||[]).some(k=>String(k.TARIKH).slice(0,10)===tarikh&&String(k["ATLET ID"])===String(id)&&String(k.STATUS).toUpperCase()==="HADIR");
function terbaik(n,id){
  const r=rekodAcara(n).filter(x=>String(x["ATLET ID"])===String(id)&&Number(x.NILAI)>0).map(x=>Number(x.NILAI));
  if(!r.length) return null;
  return acaraInfo(n).JENIS==="MASA"?Math.min.apply(null,r):Math.max.apply(null,r);
}
const purata=arr=>arr.reduce((a,b)=>a+b,0)/arr.length;

/* ---------- Muat data ---------- */
async function muat(){
  loading();
  try{ DB=await api("data"); render(); }
  catch(e){ app().innerHTML=`<div class="card"><h2>Gagal memuatkan data</h2><p class="small">${esc(e.message)}</p><button class="btn" onclick="muat()">Cuba lagi</button><button class="btn ghost" onclick="tetapApi()">Tukar URL Google Sheet</button></div>`; }
}
function tetapApi(){ localStorage.removeItem(LS_API); API=API_URL_LALAI; render(); }
function logout(){ localStorage.removeItem(LS_USER); U=null; DB=null; VIEW="home"; render(); }
function go(v,c={}){ VIEW=v; CTX=c; window.scrollTo(0,0); render(); }

/* ============================ SKRIN ============================ */
function render(){
  $("#nav").classList.add("hide");
  if(!API) return skrinApi();
  if(!U) return skrinAuth();
  if(!DB) return muat();
  $("#nav").classList.remove("hide");
  navBar();
  ({home:vHome,kehadiran:vKehadiran,acara:vAcara,acaraDetail:vAcaraDetail,dashboard:vDashboard,profil:vProfil,atlet:vAtlet,sejarah:vSejarah,admin:vAdmin,saya:vSaya}[VIEW]||vHome)();
}
function navBar(){
  const t=[["home","🏠","Utama"],["kehadiran","✅","Kehadiran"],["acara","🏆","Rekod"],["dashboard","📊","Dashboard"],["saya","👤","Saya"]];
  $("#nav").innerHTML=t.map(([k,i,l])=>`<button class="${VIEW===k?"on":""}" onclick="go('${k}')"><span class="ni">${i}</span>${l}</button>`).join("");
}
function head(title,sub){
  return `<div class="hd"><div class="logo">AT</div><div><div class="big">${esc(title)}</div><div class="small">${esc(sub||"")}</div></div></div>`;
}
function topbar(title,back){
  return `<div class="top"><button class="back" onclick="go('${back}')">←</button><div><div class="big">${esc(title)}</div></div></div>`;
}

/* ---------- 1. Sambungan Google Sheet ---------- */
function skrinApi(){
  app().innerHTML=`${head("AtletTrack","Sambung pangkalan data Google Sheet")}
  <div class="card">
    <span class="badge">LANGKAH PERTAMA</span>
    <h3 style="margin-top:10px">URL Google Apps Script</h3>
    <p class="small">Buka Google Sheet anda → Extensions → Apps Script → tampal <b>code.gs</b> → Run <b>setupPangkalanData</b> → Deploy sebagai <b>Web app</b> (Anyone). Tampal URL <code>/exec</code> di bawah.</p>
    <label>URL Web App</label>
    <input id="u" value="${esc(API_URL_LALAI)}" placeholder="https://script.google.com/macros/s/..../exec" />
    <button class="btn" onclick="simpanApi()">Sambung</button>
  </div>`;
}
async function simpanApi(){
  const v=$("#u").value.trim();
  if(!/^https:\/\/script\.google\.com\/.*\/exec/.test(v)) return toast("URL tidak sah (mesti berakhir /exec)");
  API=v; loading("Menguji sambungan...");
  try{ await api("setup"); localStorage.setItem(LS_API,v); toast("Sambungan berjaya!"); render(); }
  catch(e){ API=""; toast("Gagal: "+e.message); render(); }
}

/* ---------- 2. Daftar / Log Masuk ---------- */
let modeAuth="login";
function skrinAuth(){
  const L=modeAuth==="login";
  app().innerHTML=`${head("AtletTrack","Sistem Kehadiran & Rekod Latihan Atlet")}
  <div class="card">
    <div class="tabs">
      <button class="${L?"on":""}" onclick="modeAuth='login';render()">Log Masuk</button>
      <button class="${!L?"on":""}" onclick="modeAuth='daftar';render()">Daftar Baharu</button>
    </div>
    ${L?`
      <label>Emel</label><input id="e" autocomplete="username" />
      <label>Kata Laluan</label><input id="p" type="password" autocomplete="current-password" />
      <button class="btn" onclick="doLogin()">Log Masuk</button>
      <p class="small" style="margin-top:12px">Akaun akan kekal log masuk dalam telefon ini sehingga anda log keluar.</p>
    `:`
      <label>Nama Penuh Guru</label><input id="n" />
      <label>Emel</label><input id="e" />
      <label>Kata Laluan</label><input id="p" type="password" />
      <label>Jawatan Semasa Sesi Latihan</label><input id="j" placeholder="Cth: Jurulatih 100M / Pengurus" />
      <label>Sekolah</label><input id="s" />
      <label>No Telefon</label><input id="t" inputmode="tel" />
      <button class="btn" onclick="doDaftar()">Daftar Akaun</button>
    `}
  </div>
  <div class="card"><p class="small">Semua rekod disimpan <b>hanya</b> di dalam Google Sheet.</p>
  <button class="btn ghost sm" onclick="tetapApi()">Tukar URL Google Sheet</button></div>`;
}
async function doLogin(){
  const emel=$("#e").value.trim(), kataLaluan=$("#p").value;
  if(!emel||!kataLaluan) return toast("Sila isi emel dan kata laluan");
  loading("Mengesahkan...");
  try{ U=await api("login",{emel,kataLaluan}); localStorage.setItem(LS_USER,JSON.stringify(U)); toast("Selamat datang, "+U.nama); muat(); }
  catch(e){ toast(e.message); render(); }
}
async function doDaftar(){
  const p={nama:$("#n").value.trim(),emel:$("#e").value.trim(),kataLaluan:$("#p").value,jawatan:$("#j").value.trim(),sekolah:$("#s").value.trim(),telefon:$("#t").value.trim()};
  if(Object.values(p).some(v=>!v)) return toast("Sila lengkapkan semua maklumat");
  loading("Mendaftar...");
  try{ U=await api("daftar",p); localStorage.setItem(LS_USER,JSON.stringify(U)); toast("Pendaftaran berjaya"); muat(); }
  catch(e){ toast(e.message); render(); }
}

/* ---------- 3. Utama ---------- */
function vHome(){
  const t=today();
  const hadir=(DB.kehadiran||[]).filter(k=>String(k.TARIKH).slice(0,10)===t&&String(k.STATUS).toUpperCase()==="HADIR").length;
  const jumRekod=Object.values(DB.rekod||{}).reduce((a,b)=>a+b.length,0);
  app().innerHTML=`${head("Hai, "+U.nama,(isAdmin()?"MASTER ADMIN":U.jawatan)+" • "+U.sekolah)}
  <div class="card"><div class="row" style="gap:10px">
    <div class="stat"><b>${(DB.atlet||[]).length}</b><span class="small">Atlet</span></div>
    <div class="stat"><b>${hadir}</b><span class="small">Hadir Hari Ini</span></div>
    <div class="stat"><b>${jumRekod}</b><span class="small">Rekod Latihan</span></div>
  </div></div>
  <div class="grid3">
    <div class="tile t1" onclick="go('kehadiran')"><div class="ic">✅</div><div class="tt">KEHADIRAN</div><div class="ts">Tanda kehadiran atlet</div></div>
    <div class="tile t2" onclick="go('acara')"><div class="ic">🏆</div><div class="tt">REKOD LATIHAN</div><div class="ts">Ikut acara & atlet</div></div>
    <div class="tile t3" onclick="go('dashboard')"><div class="ic">📊</div><div class="tt">DASHBOARD</div><div class="ts">Ranking pencapaian</div></div>
  </div>
  <div class="card" style="margin-top:14px"><div class="small">Tarikh: <b>${t}</b> • Kehadiran wajib ditanda sebelum rekod latihan boleh diambil.</div>
  <button class="btn ghost sm" style="margin-top:10px" onclick="muat()">↻ Segar semula data Google Sheet</button></div>`;
}

/* ---------- 4. Kehadiran ---------- */
let kTarikh=today(), kCari="";
function vKehadiran(){
  const list=(DB.atlet||[]).filter(a=>{
    const q=kCari.toLowerCase();
    return !q||String(a["NAMA PENUH"]).toLowerCase().includes(q)||String(a.KATEGORI).toLowerCase().includes(q)||String(a.SEKOLAH).toLowerCase().includes(q);
  });
  const rec={}; (DB.kehadiran||[]).filter(k=>String(k.TARIKH).slice(0,10)===kTarikh).forEach(k=>rec[k["ATLET ID"]]=k);
  const hadir=Object.values(rec).filter(k=>String(k.STATUS).toUpperCase()==="HADIR").length;
  app().innerHTML=`${topbar("Kehadiran Atlet","home")}
  <div class="card">
    <div class="row"><div><label>Tarikh</label><input type="date" id="kt" value="${kTarikh}" onchange="kTarikh=this.value;render()"/></div>
    <div><label>Cari</label><input id="kc" value="${esc(kCari)}" placeholder="Nama / kategori / sekolah" oninput="kCari=this.value;clearTimeout(window._d);window._d=setTimeout(render,350)"/></div></div>
    <div class="small" style="margin-top:10px">Hadir: <b style="color:var(--ok)">${hadir}</b> / ${(DB.atlet||[]).length} atlet</div>
    ${isAdmin()?`<button class="btn sm" style="margin-top:10px" onclick="formAtlet()">+ Tambah Atlet Baharu</button>`:`<div class="small" style="margin-top:8px">Hanya Master Admin boleh menambah atlet baharu.</div>`}
  </div>
  ${list.map(a=>{
    const k=rec[a.ID], st=k?String(k.STATUS).toUpperCase():"";
    return `<div class="item">
      <img class="av" src="${avatar(a)}" alt="${esc(a["NAMA PENUH"])}"/>
      <div style="flex:1" onclick="go('profil',{id:'${esc(a.ID)}'})">
        <div class="nm">${esc(a["NAMA PENUH"])}</div>
        <div class="sub">${esc(a.KATEGORI)} • ${esc(a.SEKOLAH)}</div>
        ${k?`<div class="sub">Dicatat oleh: <b>${esc(k["DICATAT OLEH"])}</b> • ${esc(k["TARIKH & MASA"])}</div>`:""}
      </div>
      <div class="right">
        <button class="btn sm ${st==="HADIR"?"ok":"ghost"}" onclick="tandaHadir('${esc(a.ID)}','HADIR')">Hadir</button>

async function tandaHadir(id,status){
  const a=atletById(id); if(!a) return;
  toast("Menyimpan ke Google Sheet...",1200);
  try{ await api("kehadiran",{tarikh:kTarikh,atletId:id,nama:a["NAMA PENUH"],kategori:a.KATEGORI,sekolah:a.SEKOLAH,status,...who()});
    DB=await api("data"); render(); toast(status+" — direkod oleh "+U.nama);
  }catch(e){ toast(e.message) }
}

/* ---------- 6. Butiran Acara ---------- */
function vAcaraDetail(){

  app().innerHTML=`${topbar(n,"acara")}

    <span class="badge">${info.JENIS==="MASA"?"MASA (SAAT)":"JARAK (METER)"}</span>

    <div>${jl.map(j=>`<span class="chip">👤 ${esc(j["NAMA JURULATIH"])} ${isAdmin()?`<a href="#" onclick="event.preventDefault();buangJ('${esc(n)}','${esc(j["EMEL JURULATIH"])}')" style="color:var(--bad)">✕</a>`:""}</span>`).join("")||'<span class="chip">Tiada</span>'}</div>

    <button class="btn ghost sm" style="margin-top:10px" onclick="go('sejarah',{acara:'${esc(n)}'})">🕘 Sejarah Rekod Acara</button>
  </div>
  ${pl.map(p=>{
    const a=atletById(p["ATLET ID"])||{"NAMA PENUH":p["NAMA ATLET"],KATEGORI:p.KATEGORI,SEKOLAH:p.SEKOLAH,ID:p["ATLET ID"]};

        <div class="sub">${esc(p.KATEGORI)} • ${esc(p.SEKOLAH)}</div>
        <div class="sub">Terbaik: <b>${b!==null?b+" "+info.UNIT:esc(p["REKOD PERIBADI"]||"Tiada rekod")}</b> ${hadir?'<span style="color:var(--ok)">• hadir hari ini</span>':'<span style="color:var(--warn)">• belum tanda kehadiran</span>'}</div>
      </div>
      ${boleh?`<button class="btn sm" onclick="formRekod('${esc(n)}','${esc(p["ATLET ID"])}')">+ Rekod</button>`:""}

function formJurulatih(n){
  const opts=(DB.guru||[]).map(g=>`<option value="${esc(g.emel)}|${esc(g.nama)}">${esc(g.nama)} — ${esc(g.sekolah)}</option>`).join("");
  overlay(`<div class="big">Lantik Jurulatih — ${esc(n)}</div><label>Guru Berdaftar</label><select id="jg">${opts||'<option value="">Tiada guru berdaftar</option>'}</select>

async function simpanJ(n){

  try{ await api("lantikJurulatih",{acara:n,emel,nama,...who()}); DB=await api("data"); render(); toast("Jurulatih dilantik"); }catch(e){ toast(e.message) }
}
async function buangJ(n,emel){
  try{ await api("buangJurulatih",{acara:n,emel,...who()}); DB=await api("data"); render(); toast("Dibuang"); }catch(e){ toast(e.message) }
}
function formPenyertaan(n){
  const ada=new Set(penyertaan(n).map(p=>String(p["ATLET ID"])));
  const list=(DB.atlet||[]).filter(a=>!ada.has(String(a.ID)));
  overlay(`<div class="big">Tambah Atlet — ${esc(n)}</div>
  <p class="small">Hanya atlet yang telah ditanda <b>HADIR</b> hari ini boleh dimasukkan.</p>
  <label>Atlet</label><select id="pa">${list.map(a=>`<option value="${esc(a.ID)}">${esc(a["NAMA PENUH"])} — ${esc(a.KATEGORI)} ${hadirHariIni(a.ID,today())?"✓ hadir":"(belum hadir)"}</option>`).join("")}</select>
  <button class="btn" onclick="simpanP('${esc(n)}')">Tambah</button><button class="btn ghost" onclick="tutup()">Batal</button>`);
}
async function simpanP(n){
  const id=$("#pa").value, a=atletById(id); if(!a) return toast("Pilih atlet");
  tutup();
  try{ await api("tambahPenyertaan",{acara:n,atletId:id,nama:a["NAMA PENUH"],kategori:a.KATEGORI,sekolah:a.SEKOLAH,tarikh:today(),...who()}); DB=await api("data"); render(); toast("Atlet ditambah ke acara"); }

function formRekod(n,id){
  const a=atletById(id)||{}, info=acaraInfo(n);
  overlay(`<div class="big">Rekod Latihan</div>
  <div class="small">${esc(n)} • ${esc(a["NAMA PENUH"]||"")}</div>
  <label>Tarikh</label><input type="date" id="rt" value="${today()}"/>
  <label>Keputusan (${esc(info.JENIS==="MASA"?"saat":"meter")})</label><input id="rv" inputmode="decimal" placeholder="${info.JENIS==="MASA"?"Cth: 13.94":"Cth: 4.63"}"/>
  <label>Catatan</label><textarea id="rc" rows="2" placeholder="Cth: pusingan ke-2, angin belakang"></textarea>
  <button class="btn" onclick="simpanR('${esc(n)}','${esc(id)}')">Simpan Rekod</button><button class="btn ghost" onclick="tutup()">Batal</button>`);

async function simpanR(n,id){
  const a=atletById(id)||{}, nilai=parseFloat($("#rv").value), tarikh=$("#rt").value, catatan=$("#rc").value.trim();

  const info=acaraInfo(n); tutup(); toast("Menyimpan ke Google Sheet...",1200);
  try{ await api("rekod",{acara:n,atletId:id,nama:a["NAMA PENUH"],kategori:a.KATEGORI,sekolah:a.SEKOLAH,keputusan:nilai+" "+info.UNIT,nilai,catatan,tarikh,...who()});
    DB=await api("data"); render(); toast("Rekod disimpan oleh "+U.nama);

}

    ${a.CATATAN?`<div class="small" style="margin-top:8px">📝 ${esc(a.CATATAN)}</div>`:""}

      <div class="stat"><b>${hadir}</b><span class="small">Kali Hadir</span></div>
      <div class="stat"><b>${acaraDia.length}</b><span class="small">Acara</span></div>
      <div class="stat"><b>${acaraDia.reduce((s,x)=>s+rekodAcara(x.ACARA).filter(r=>String(r["ATLET ID"])===String(a.ID)).length,0)}</b><span class="small">Rekod</span></div>
    </div>
    <button class="btn sm ghost" style="margin-top:12px" onclick="formAtlet('${esc(a.ID)}')">✎ Tambah / Kemaskini Maklumat</button>
    <div class="small" style="margin-top:6px">Didaftar oleh: ${esc(a["DIDAFTAR OLEH"]||"-")}</div>
  </div>
  <h3>Rekod Peribadi Mengikut Acara</h3>
  ${acaraDia.map(x=>{
    const n=x.ACARA, rs=rekodAcara(n).filter(r=>String(r["ATLET ID"])===String(a.ID)).sort((p,q)=>String(q.TARIKH).localeCompare(String(p.TARIKH)));
    const b=terbaik(n,a.ID);
    return `<div class="card"><div class="row" style="align-items:center">
      <div><div class="nm">${esc(n)}</div><div class="small">${rs.length} rekod • Purata ${rs.length?purata(rs.map(r=>Number(r.NILAI)||0)).toFixed(2):"-"} ${esc(x.UNIT)}</div></div>
      <div class="right"><span class="badge">TERBAIK ${b!==null?b+" "+x.UNIT:"-"}</span></div></div>
      ${rs.slice(0,8).map(r=>`<div class="sub">• ${esc(String(r.TARIKH).slice(0,10))} ${esc(r.MASA)} — <b>${esc(r.KEPUTUSAN)}</b> (oleh ${esc(r["DICATAT OLEH"])})</div>`).join("")||'<div class="sub">Tiada rekod</div>'}
    </div>`;
  }).join("")||`<div class="card small">Atlet ini belum dimasukkan ke mana-mana acara.</div>`}`;
}

/* ---------- 9. Dashboard ---------- */
let dAcara=null;
function vDashboard(){
  const list=acaraList(); if(!dAcara&&list.length) dAcara=list[0].ACARA;
  const info=acaraInfo(dAcara);
  const grp={};
  rekodAcara(dAcara).forEach(r=>{ const id=String(r["ATLET ID"]); if(!Number(r.NILAI))return; (grp[id]=grp[id]||{nama:r["NAMA ATLET"],kategori:r.KATEGORI,sekolah:r.SEKOLAH,v:[]}).v.push(Number(r.NILAI)); });
  let rank=Object.keys(grp).map(id=>({id,...grp[id],purata:purata(grp[id].v),terbaik:info.JENIS==="MASA"?Math.min.apply(null,grp[id].v):Math.max.apply(null,grp[id].v),n:grp[id].v.length}));
  rank.sort((a,b)=>info.JENIS==="MASA"?a.purata-b.purata:b.purata-a.purata);
  app().innerHTML=`${topbar("Dashboard Ranking","home")}
  <div class="tabs">${list.map(a=>`<button class="${a.ACARA===dAcara?"on":""}" onclick="dAcara='${esc(a.ACARA)}';render()">${esc(a.ACARA)}</button>`).join("")}</div>
  <div class="card"><div class="small">Ranking disusun mengikut <b>purata pencapaian</b> ${info.JENIS==="MASA"?"(masa terendah = terbaik)":"(jarak tertinggi = terbaik)"} bagi acara <b>${esc(dAcara||"-")}</b>.</div></div>
  ${rank.map((r,i)=>{
    const a=atletById(r.id)||{JANTINA:"",};
    return `<div class="item" onclick="go('profil',{id:'${esc(r.id)}'})">
      <div class="rank ${i===0?"g1":i===1?"g2":i===2?"g3":""}">${i+1}</div>
      <img class="av" src="${avatar(a)}"/>
      <div style="flex:1"><div class="nm">${esc(r.nama)}</div><div class="sub">${esc(r.kategori)} • ${esc(r.sekolah)} • ${r.n} rekod</div></div>
      <div class="right"><div class="nm" style="color:var(--p2)">${r.purata.toFixed(2)}</div><div class="sub">purata ${esc(info.UNIT)}</div><div class="sub">terbaik ${r.terbaik.toFixed(2)}</div></div>
    </div>`;
  }).join("")||`<div class="card small">Tiada rekod untuk acara ini lagi.</div>`}`;
}

    <div>${jurulatihAcara(a.ACARA).map(j=>`<span class="chip">${esc(j["NAMA JURULATIH"])} <a href="#" style="color:var(--bad)" onclick="event.preventDefault();buangJ('${esc(a.ACARA)}','${esc(j["EMEL JURULATIH"])}')">✕</a></span>`).join("")||'<span class="chip">Tiada</span>'}</div>
    <button class="btn sm ghost" style="margin-top:8px" onclick="formJurulatih('${esc(a.ACARA)}')">+ Lantik</button></div>`).join("")}`;

/* ---------- Overlay ---------- */
function overlay(html){
  const d=document.createElement("div"); d.className="ov"; d.id="ov";
  d.innerHTML=`<div class="sheet">${html}</div>`;
  d.addEventListener("click",e=>{ if(e.target===d) tutup(); });
  document.body.appendChild(d);
}
function tutup(){ const o=$("#ov"); if(o) o.remove(); }

/* ---------- Mula ---------- */
if("serviceWorker" in navigator) window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
render();
</script>
