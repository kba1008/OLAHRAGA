<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>AtletTrack — Kehadiran & Rekod Latihan Atlet</title>
<meta name="description" content="Sistem kehadiran atlet dan rekod prestasi latihan pusat. Pangkalan data Google Sheet." />
<meta name="theme-color" content="#4f2df5" />
<link rel="manifest" href="./manifest.json" />
<style>
:root{
  --bg:#070b1e; --bg2:#0d1330; --card:rgba(255,255,255,.06); --line:rgba(255,255,255,.14);
  --txt:#f2f5ff; --mut:#9fb0d9;
  --p1:#6d28f9; --p2:#00c6ff; --p3:#ff2d95; --ok:#00e08a; --warn:#ffc400; --bad:#ff4d6d;
  --grad:linear-gradient(135deg,#6d28f9,#00c6ff 55%,#ff2d95);
  --sh:0 18px 40px -18px rgba(0,0,0,.85),0 2px 0 rgba(255,255,255,.09) inset;
  --r:20px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--txt);
  background:
    radial-gradient(900px 500px at 10% -5%,rgba(109,40,249,.45),transparent 60%),
    radial-gradient(800px 480px at 95% 8%,rgba(0,198,255,.32),transparent 60%),
    radial-gradient(700px 500px at 50% 105%,rgba(255,45,149,.28),transparent 60%),
    var(--bg);
  min-height:100vh;padding-bottom:96px
}
.wrap{max-width:880px;margin:0 auto;padding:16px}
.wrap.full{max-width:100%;padding:0}
.wrap.full .top{padding:16px 16px 0}
.wrap.full .mx-tools{padding:0 16px}
.hide{display:none!important}
h1,h2,h3{margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--sh);backdrop-filter:blur(14px);margin-bottom:14px}
.badge{display:inline-block;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:800;letter-spacing:.4px;background:var(--grad);box-shadow:0 6px 14px -6px var(--p1)}
.chip{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;background:rgba(255,255,255,.1);border:1px solid var(--line);color:var(--mut);margin:2px 4px 2px 0}
label{display:block;font-size:12px;font-weight:700;color:var(--mut);margin:10px 0 5px;letter-spacing:.3px}
input,select,textarea{width:100%;padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:rgba(4,8,26,.7);color:var(--txt);font-size:15px;outline:none;font-family:inherit}
input:focus,select:focus,textarea:focus{border-color:var(--p2);box-shadow:0 0 0 3px rgba(0,198,255,.2)}
option{background:#0d1330}
input[type=checkbox],input[type=radio]{width:18px;height:18px;min-width:18px;flex:0 0 auto;padding:0;margin:0;border-radius:5px;accent-color:var(--p2);cursor:pointer}
/* Senarai ahli pasukan (rekod berpasukan) */
.teamBox{max-height:42vh;overflow:auto;border:1px solid var(--line);border-radius:14px;padding:8px;margin-top:6px;background:rgba(4,8,26,.45)}
.teamKat{font-size:11px;font-weight:800;letter-spacing:.6px;color:var(--p2);text-transform:uppercase;margin:10px 4px 6px}
.teamKat:first-child{margin-top:2px}
.teamRow{display:flex;align-items:center;gap:10px;text-align:left;padding:9px 10px;margin:0 0 6px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.04);font-size:13px;font-weight:600;color:var(--txt);cursor:pointer}
.teamRow.off{opacity:.45;cursor:not-allowed}
.teamRow .tinfo{flex:1;min-width:0}
.teamRow .tnama{display:block;font-size:13px;font-weight:700;line-height:1.3;color:var(--txt)}
.teamRow .tsub{display:block;font-size:11px;font-weight:600;color:var(--mut);margin-top:2px}
.teamRow .tsub .ok{color:var(--ok)}
.teamRow .tsub .no{color:var(--warn)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px 16px;margin-top:12px;border:0;border-radius:16px;font-size:15px;font-weight:800;color:#fff;cursor:pointer;
  background:var(--grad);box-shadow:0 12px 26px -12px var(--p1),0 1px 0 rgba(255,255,255,.35) inset;transition:transform .12s,filter .12s}
.btn:active{transform:translateY(2px) scale(.99);filter:brightness(1.1)}
.btn:disabled{opacity:.55;cursor:not-allowed;filter:grayscale(.3)}
.btn.ghost{background:rgba(255,255,255,.07);border:1px solid var(--line);box-shadow:none}
.btn.sm{width:auto;padding:9px 14px;font-size:13px;margin-top:0}
.btn.ok{background:linear-gradient(135deg,#00e08a,#00b3ff)}
.btn.bad{background:linear-gradient(135deg,#ff4d6d,#ff9500)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1;min-width:140px}
.grid3{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:640px){.grid3{grid-template-columns:repeat(3,1fr)}}
.tile{position:relative;border-radius:26px;padding:26px 18px;text-align:center;cursor:pointer;color:#fff;border:1px solid rgba(255,255,255,.22);
  box-shadow:0 26px 44px -22px rgba(0,0,0,.95),0 2px 0 rgba(255,255,255,.4) inset,0 -8px 18px -12px rgba(0,0,0,.7) inset;
  transition:transform .16s ease, box-shadow .16s ease;overflow:hidden}
.tile:active{transform:translateY(4px) scale(.985)}
.tile:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.3),rgba(255,255,255,0) 45%);pointer-events:none}
.t1{background:linear-gradient(150deg,#7a2bff,#3d0fb0)}
.t2{background:linear-gradient(150deg,#00d4ff,#0067b8)}
.t3{background:linear-gradient(150deg,#ff2d95,#ff8a00)}
.tile .ic{font-size:40px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.5))}
.tile .tt{font-size:18px;font-weight:900;margin-top:8px;letter-spacing:.3px}
.tile .ts{font-size:12px;opacity:.9;margin-top:3px}
.dragHandle{cursor:grab;user-select:none;font-size:18px;line-height:1;color:var(--mut,#9aa);padding:4px 6px;border-radius:10px;background:rgba(255,255,255,.06);flex:0 0 auto}
.item.dragging{opacity:.45}
.item.dragOver{outline:2px dashed var(--p2,#7c5cff);outline-offset:2px}
.item{display:flex;align-items:center;gap:12px;padding:12px;border-radius:18px;background:rgba(255,255,255,.055);border:1px solid var(--line);margin-bottom:10px;box-shadow:0 10px 22px -18px #000}
.av{width:48px;height:48px;border-radius:14px;object-fit:cover;background:#111a3d;border:1px solid var(--line);flex:0 0 auto}
.nm{font-weight:800;font-size:14px;line-height:1.25}
.sub{font-size:11.5px;color:var(--mut);margin-top:3px}
.right{margin-left:auto;text-align:right}
.small{font-size:11.5px;color:var(--mut)}
.top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.back{background:rgba(255,255,255,.09);border:1px solid var(--line);color:#fff;border-radius:12px;padding:8px 12px;font-weight:800;cursor:pointer}
.rank{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:900;background:var(--grad);box-shadow:0 8px 18px -10px var(--p2)}
.g1{background:linear-gradient(135deg,#ffd700,#ff9500)}
.g2{background:linear-gradient(135deg,#dfe7f5,#9aa9c4)}
.g3{background:linear-gradient(135deg,#d9822b,#8a4b12)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#101838;border:1px solid var(--line);padding:13px 18px;border-radius:14px;z-index:99;max-width:90%;font-size:13.5px;box-shadow:var(--sh);text-align:center}
.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(8,12,32,.93);border-top:1px solid var(--line);display:flex;padding:8px 6px calc(8px + env(safe-area-inset-bottom));backdrop-filter:blur(16px);z-index:50}
.nav button{flex:1;background:none;border:0;color:var(--mut);font-size:11px;font-weight:800;padding:6px 2px;cursor:pointer}
.nav button.on{color:#fff}
.nav .ni{display:block;font-size:19px}
.hd{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.logo{width:44px;height:44px;border-radius:14px;background:var(--grad);display:flex;align-items:center;justify-content:center;font-weight:900;box-shadow:0 12px 24px -10px var(--p1)}
.stat{text-align:center;padding:12px;border-radius:16px;background:rgba(255,255,255,.06);border:1px solid var(--line)}
.stat b{display:block;font-size:22px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px}
.tabs button{white-space:nowrap;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--mut);font-weight:800;font-size:12.5px;cursor:pointer}
.tabs button.on{background:var(--grad);color:#fff;border-color:transparent}

/* --- Susunan kad atlet lebih kemas pada paparan telefon --- */
@media (max-width: 640px){
  .item{flex-wrap:wrap; align-items:flex-start; gap:10px; padding:12px}
  .item > .rank{width:34px;height:34px;border-radius:10px;font-size:13px}
  .item > .av{width:44px;height:44px;border-radius:12px}
  .item > div[style*="flex:1"]{min-width:0;flex:1 1 60%}
  .item .nm{font-size:13.5px}
  .item .right{
    order:99; width:100%; margin-left:0; text-align:left;
    display:flex; align-items:baseline; gap:6px 14px; flex-wrap:wrap;
    padding:8px 2px 2px; border-top:1px dashed var(--line);
  }
  .item .right .nm{font-size:17px;color:var(--p2)}
  .item .right .sub{margin-top:0}
  .item .right .sub:before{content:"• ";opacity:.55}
  .item .right .sub:first-of-type:before{content:""}
}
.sp{width:34px;height:34px;border:3px solid rgba(255,255,255,.15);border-top-color:var(--p2);border-radius:50%;animation:s 1s linear infinite;margin:24px auto}
@keyframes s{to{transform:rotate(360deg)}}
.ov{position:fixed;inset:0;background:rgba(4,7,20,.82);display:flex;align-items:flex-end;justify-content:center;z-index:80;backdrop-filter:blur(6px)}
.sheet{background:#0d1330;border:1px solid var(--line);border-radius:24px 24px 0 0;padding:18px;width:100%;max-width:880px;max-height:88vh;overflow:auto;box-shadow:0 -20px 50px -20px #000}
.big{font-size:20px;font-weight:900}
hr{border:0;border-top:1px solid var(--line);margin:14px 0}
.pill{display:inline-block;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:800;background:rgba(0,224,138,.15);color:var(--ok);border:1px solid rgba(0,224,138,.35);margin:2px 4px 0 0}
.pill.warn{background:rgba(255,196,0,.12);color:var(--warn);border-color:rgba(255,196,0,.35)}
.sync{position:fixed;top:10px;right:10px;z-index:70;background:#101838;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:11px;font-weight:800;color:var(--mut);display:none}
.sync.on{display:inline-flex;align-items:center;gap:6px}
.sync .dot{width:8px;height:8px;border-radius:50%;background:var(--warn);animation:pl 1s infinite}
@keyframes pl{50%{opacity:.3}}
/* Cropper */
.cropbox{position:relative;width:100%;aspect-ratio:1/1;max-width:340px;margin:8px auto;border-radius:20px;overflow:hidden;background:#000;border:1px solid var(--line);touch-action:none;user-select:none}
.cropbox canvas{display:block;width:100%;height:100%}
.cropbox .mask{position:absolute;inset:0;box-shadow:0 0 0 9999px rgba(0,0,0,.55) inset;border-radius:20px;pointer-events:none}
.fileit{display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;background:rgba(255,255,255,.055);border:1px solid var(--line);margin-bottom:8px}
.fileic{width:38px;height:38px;border-radius:10px;background:var(--grad);display:flex;align-items:center;justify-content:center;font-size:16px;flex:0 0 auto}
@media (max-width:640px){.jl-acara{display:none!important}}

/* ===== Matriks Peserta × Acara (Cek List) ===== */
.mx-wrap{background:#fff;color:#0b1533;border-radius:16px;padding:18px;box-shadow:var(--sh);border:1px solid var(--line)}
.mx-head{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:3px solid #0b1533;padding-bottom:12px;margin-bottom:14px;flex-wrap:wrap}
.mx-title h2{font-size:20px;letter-spacing:.3px;color:#0b1533;margin:0}
.mx-title .mx-sub{font-size:12px;color:#5b6b8f;font-weight:600;letter-spacing:.6px;text-transform:uppercase;margin-top:4px}
.mx-brand{display:flex;align-items:center;gap:10px}
.mx-logo{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#6d28f9,#00c6ff 55%,#ff2d95);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:16px;letter-spacing:.5px}
.mx-tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.mx-tools input,.mx-tools select{background:#fff;color:#0b1533;border:1px solid #d9dfef;font-size:13px;padding:9px 12px;border-radius:10px}
.mx-btn{background:#0b1533;color:#fff;border:0;padding:9px 14px;border-radius:10px;font-weight:700;font-size:12.5px;cursor:pointer;letter-spacing:.3px}
.mx-btn.alt{background:#fff;color:#0b1533;border:1px solid #0b1533}
.mx-scroll{overflow:auto;border:1px solid #e1e6f2;border-radius:12px}
table.mx{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px;color:#0b1533;min-width:640px}
table.mx thead th{position:sticky;top:0;background:#0b1533;color:#fff;font-weight:700;font-size:11px;letter-spacing:.5px;text-transform:uppercase;padding:12px 10px;border-right:1px solid rgba(255,255,255,.1);z-index:2}
table.mx thead th.rot{writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;min-width:36px;height:150px;padding:10px 6px;font-size:11.5px}
table.mx thead th.nm{text-align:left;min-width:220px}
table.mx thead th.sk{text-align:left;min-width:150px}
table.mx thead th.kt{text-align:center;min-width:80px}
table.mx tbody td{padding:10px 10px;border-bottom:1px solid #eef1f8;border-right:1px solid #eef1f8;background:#fff}
table.mx tbody tr:nth-child(even) td{background:#f7f9fd}
table.mx tbody tr:hover td{background:#eef4ff}
table.mx tbody tr.group-start td{border-top:2px solid #0b1533}
table.mx tbody tr.group-start td.nm{font-weight:800}
table.mx td.nm{text-align:left;font-weight:600}
table.mx td.nm .no{color:#8390b3;font-weight:600;margin-right:8px}
table.mx td.sk,table.mx td.kt{text-align:left;color:#4a5878;font-weight:500}
table.mx td.kt{text-align:center}
table.mx td.cx{text-align:center;font-weight:800}
table.mx td.cx.on{color:#0a8f4b;background:#e6f6ee !important;font-size:15px}
table.mx td.cx.off{color:#c8ced9}
table.mx td.tot{text-align:center;font-weight:800;background:#fbfcff !important;color:#0b1533}
table.mx tfoot td{background:#0b1533 !important;color:#fff;font-weight:800;padding:10px;text-align:center;font-size:11.5px;letter-spacing:.4px;border:0}
table.mx tfoot td.lbl{text-align:right;text-transform:uppercase}
.mx-edit{background:transparent;border:0;padding:0;font:inherit;font-weight:700;color:#0b1533;text-align:left;cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}
.mx-edit:hover{color:#6d28f9}
.only-print{display:none}
@media print{.only-print{display:inline}}
.mx-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;color:#4a5878;font-size:12px}
.mx-legend .lg{display:flex;align-items:center;gap:6px}
.mx-legend .sw{display:inline-block;width:14px;height:14px;border-radius:4px;background:#e6f6ee;border:1px solid #0a8f4b}
.mx-foot{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding-top:12px;border-top:1px solid #e1e6f2;color:#5b6b8f;font-size:11.5px;letter-spacing:.3px}
@media print{
  @page{size:A4 landscape;margin:12mm}
  body{background:#fff !important;padding:0 !important}
  .nav,.sync,.top,.hd,.tabs,.btn,#nav,.mx-tools,.no-print{display:none !important}
  .wrap{max-width:none;padding:0;margin:0}
  .mx-wrap{border:0;box-shadow:none;padding:0;border-radius:0}
  table.mx{font-size:10.5px}
  table.mx thead th{background:#0b1533 !important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  table.mx thead th.rot{height:130px;font-size:10.5px}
  table.mx td.cx.on{background:#e6f6ee !important;color:#0a8f4b !important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  table.mx tfoot td{background:#0b1533 !important;color:#fff !important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .mx-scroll{overflow:visible;border:1px solid #0b1533;border-radius:0}
  table.mx tbody tr.group-start td{border-top:2px solid #0b1533;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>

<div class="wrap" id="app"><div class="sp"></div></div>
<div class="nav hide" id="nav"></div>
<div class="sync" id="sync"><span class="dot"></span><span id="syncTxt">Menyegerak…</span></div>

<script>
/* ============================================================
   AtletTrack — PWA (versi kemas)
   SUMBER DATA TUNGGAL: Google Sheet (melalui Apps Script Web App)
   ============================================================ */
const API_URL_LALAI="https://script.google.com/macros/s/AKfycbxpr8m4MH2q2wjC21lhAPafX2k3IIBtuCdFLCpNXxgT2e8a9P7ctBgjZv4qx3OLJpAFag/exec";
const LS_API="at_api_url", LS_USER="at_user", LS_TEK="at_teknision";
const PIN_TEKNISION="101010";
let API=localStorage.getItem(LS_API)||API_URL_LALAI;
let TEKNISION=localStorage.getItem(LS_TEK)==="1";
let U=null; try{U=JSON.parse(localStorage.getItem(LS_USER)||"null")}catch(e){}
let DB=null, VIEW="home", CTX={};
let PENDING=0; /* kiraan penulisan latar belakang */

const $=s=>document.querySelector(s), app=()=>$("#app");
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const isAdmin=()=>U&&U.peranan==="ADMIN";
/* Master Admin ATAU jurulatih yang telah dilantik untuk mana-mana acara */
const isJurulatihDilantik=()=>!!U&&((typeof DB!=="undefined"&&DB&&DB.jurulatih)||[]).some(j=>String(j["EMEL JURULATIH"]||"").toLowerCase().trim()===String(U.emel||"").toLowerCase().trim());
const bolehUrusAtlet=()=>isAdmin()||isJurulatihDilantik();
/* Padam atlet dari keseluruhan sistem — Master Admin sahaja */
const bolehPadamAtlet=()=>isAdmin();
/* Tambah acara: Master Admin ATAU jurulatih yang telah dilantik */
const bolehTambahAcara=()=>isAdmin()||isJurulatihDilantik();

function toast(m,ms=2400){const d=document.createElement("div");d.className="toast";d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),ms)}
function loading(t="Memuatkan data dari Google Sheet..."){app().innerHTML=`<div class="card" style="text-align:center"><div class="sp"></div><div class="small">${esc(t)}</div></div>`}
function syncShow(t){const s=$("#sync");if(!s)return; $("#syncTxt").textContent=t||"Menyegerak…"; s.classList.add("on");}
function syncHide(){const s=$("#sync"); if(s) s.classList.remove("on");}
function bumpPending(d){ PENDING=Math.max(0,PENDING+d); if(PENDING>0) syncShow(`Menyegerak (${PENDING})…`); else syncHide(); }

/* ============================================================
   Diagnostik pangkalan data
   ============================================================ */
const LOG=[];
function logTambah(jenis,mesej,butiran){
  LOG.unshift({masa:new Date().toLocaleString("ms-MY"),jenis,mesej:String(mesej||""),butiran:String(butiran||"")});
  if(LOG.length>80) LOG.pop();
}
function urlSelamat(u){
  if(!u) return "(tiada)";
  if(TEKNISION) return u;
  const m=String(u).match(/\/macros\/s\/([^/]+)/);
  const id=m?m[1]:"";
  return "script.google.com/macros/s/••••••••"+id.slice(-4)+"/exec";
}
const RUJUKAN={
  "DB-001":["URL pangkalan data belum ditetapkan.","Teknision: Mod Teknision → tetapkan URL Web App Apps Script."],
  "DB-002":["Sambungan tamat masa. Google Sheet lambat/terputus.","Semak internet, cuba semula."],
  "DB-003":["Gagal menghubungi skrip.","Deploy → Manage deployments → Web app → Execute as Me, Access Anyone."],
  "DB-004":["Skrip Google Sheet membalas dengan ralat.","Lihat butiran / Apps Script Executions."],
  "DB-005":["Balasan tidak sah.","Kemas kini deployment selepas paste kod baharu."],
  "DB-006":["Sheet/lajur tiada.","Jalankan setupPangkalanData()."],
  "DB-007":["Skrip belum diberi kebenaran Google Drive.","Buka Apps Script → Pilih fungsi authorizeAll → tekan Run → benarkan akses Drive & Sheet. Kemudian Deploy > Manage deployments > Edit > New version."],
  "DB-100":["Fungsi baharu belum wujud pada Web App yang di-deploy.","Di Apps Script: tampal code.gs terkini, Save, kemudian Deploy → Manage deployments → Edit (pensel) → Version: New version → Deploy."]
};
function RalatDB(kod,mesej,mentah,aksi){
  const r=RUJUKAN[kod]||["Ralat tidak dikenali.","Hubungi teknision."];
  const e=new Error(mesej||r[0]);
  e.kod=kod; e.punca=r[0]; e.tindakan=r[1]; e.mentah=mentah||""; e.aksi=aksi||"";
  logTambah("RALAT",`[${kod}] ${e.message}`,`Aksi: ${e.aksi} | ${e.mentah}`);
  return e;
}
window.addEventListener("error",ev=>logTambah("JS",ev.message,(ev.filename||"")+":"+(ev.lineno||"")));
window.addEventListener("unhandledrejection",ev=>logTambah("JS",(ev.reason&&ev.reason.message)||String(ev.reason),""));

/* ---------- Panggilan API ----------
   JSONP untuk data ringan; POST no-cors untuk payload besar (fail/gambar) supaya laju & elak had URL. */
function apiJsonp(action,payload,timeoutMs){
  return new Promise((res,rej)=>{
    if(!API) return rej(RalatDB("DB-001","URL Google Apps Script belum ditetapkan.","",action));
    const mula=Date.now();
    const cb="cb_"+Math.random().toString(36).slice(2);
    const s=document.createElement("script");
    const to=setTimeout(()=>{cleanup();rej(RalatDB("DB-002","Sambungan tamat masa.","Tempoh: "+(timeoutMs||45000)+"ms",action))},timeoutMs||45000);
    function cleanup(){clearTimeout(to);delete window[cb];s.remove()}
    window[cb]=r=>{
      cleanup();
      const ms=Date.now()-mula;
      if(!r||typeof r!=="object") return rej(RalatDB("DB-005","Balasan tidak sah.","Balasan: "+String(r).slice(0,300),action));
      if(r.ok){ logTambah("OK",`Aksi '${action}' berjaya (${ms}ms)`,""); return res(r.data); }
      const kod=r.kod||(/setup|sheet|lajur|column/i.test(r.error||"")?"DB-006":/authoriz|permission|kebenaran/i.test(r.error||"")?"DB-007":"DB-004");
      rej(RalatDB(kod,r.error||"Ralat tidak diketahui.","Aksi: "+action+" | "+JSON.stringify(r).slice(0,600),action));
    };
    s.onerror=()=>{cleanup();rej(RalatDB("DB-003","Gagal menghubungi pangkalan data.","Aksi: "+action,action))};
    s.src=API+(API.includes("?")?"&":"?")+"callback="+cb+"&payload="+encodeURIComponent(JSON.stringify({action,...(payload||{})}));
    logTambah("HANTAR",`Aksi '${action}' dihantar`,"");
    document.body.appendChild(s);
  });
}
function apiPost(action,payload){
  if(!API) return Promise.reject(RalatDB("DB-001","URL belum ditetapkan.","",action));
  return fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action,...(payload||{})})})
    .then(r=>r.json())
    .then(r=>{
      if(!r||typeof r!=="object") throw RalatDB("DB-005","Balasan tidak sah.","",action);
      if(r.ok) return r.data;
      const kod=r.kod||"DB-004"; throw RalatDB(kod,r.error||"Ralat",JSON.stringify(r).slice(0,600),action);
    })
    .catch(e=>{ if(e && e.kod) throw e; throw RalatDB("DB-003",String(e&&e.message||e),"",action); });
}
function api(action,payload){
  // Data besar (base64) → POST supaya lebih laju & tanpa had URL
  const besar = payload && (payload.gambarBase64 || payload.dataBase64);
  return besar ? apiPost(action,payload) : apiJsonp(action,payload);
}

/* ---------- Avatar ---------- */
function avatarLalai(jantina){
  const p=String(jantina||"").toUpperCase().startsWith("P");
  const c1=p?"#ff2d95":"#00c6ff", c2=p?"#8a2be2":"#6d28f9";
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><linearGradient id="a" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient></defs><rect width="100" height="100" fill="url(#a)"/><circle cx="50" cy="38" r="17" fill="#fff" opacity=".92"/><path d="M15 96c3-22 18-32 35-32s32 10 35 32z" fill="#fff" opacity=".92"/></svg>`;
  return "data:image/svg+xml;utf8,"+encodeURIComponent(svg);
}
/* Google menyekat "uc?export=view" untuk <img>. Tukar ke bentuk lh3 yang boleh dipapar. */
function urlGambarBoleh(u){
  const s=String(u||"").trim();
  if(!s) return "";
  if(s.indexOf("lh3.googleusercontent.com")>-1) return s;
  const m=s.match(/[-\w]{25,}/);
  if(s.indexOf("drive.google.com")>-1 && m) return "https://lh3.googleusercontent.com/d/"+m[0]+"=w600";
  return s;
}
function avatar(a){
  const u=urlGambarBoleh(a && a["GAMBAR (URL)"]);
  return esc(u || avatarLalai(a&&a["JANTINA"]));
}
/* Letak pada setiap <img> atlet: jika gambar Drive gagal dimuat, tunjuk avatar lalai. */
function avErr(a){
  return `onerror="this.onerror=null;this.src='${avatarLalai(a&&a["JANTINA"]).replace(/'/g,"%27")}'"`;
}

/* ---------- Format masa larian (jangan tukar semua kepada saat) ----------
   Input diterima: "15.45" (saat), "1:15.45" atau "1.15.45" (1 minit 15.45 saat),
   juga "1:02:03.5" (jam:minit:saat). Disimpan sebagai saat, dipapar semula
   dalam bentuk minit bagi acara jarak jauh (>= 60 saat).                  */
function huraiMasa(teks){
  const t=String(teks==null?"":teks).trim().replace(",",".");
  if(!t) return NaN;
  let bhg=[];
  if(t.indexOf(":")>-1){ bhg=t.split(":"); }
  else {
    const p=t.split(".");
    if(p.length===3) bhg=[p[0], p[1]+"."+p[2]];              /* 1.15.45 = 1 min 15.45 saat */
    else if(p.length===4) bhg=[p[0], p[1], p[2]+"."+p[3]];   /* 1.02.03.50 = 1 jam 2 min 3.50 saat */
    else bhg=[t];
  }
  bhg=bhg.map(x=>String(x).trim());
  if(bhg.some(x=>x===""||isNaN(Number(x)))) return NaN;
  if(bhg.length===1) return Number(bhg[0]);
  if(bhg.length===2) return Number(bhg[0])*60+Number(bhg[1]);
  return Number(bhg[0])*3600+Number(bhg[1])*60+Number(bhg[2]);
}
function fmtSaat(v){
  const x=Number(v); if(!isFinite(x)) return "-";
  if(x<60) return x.toFixed(2);
  const j=Math.floor(x/3600), b=x-j*3600;
  const m=Math.floor(b/60), s=b-m*60;
  const ss=(s<10?"0":"")+s.toFixed(2);
  return j>0 ? j+":"+(m<10?"0":"")+m+":"+ss : m+":"+ss;
}
/* Nilai + unit yang betul mengikut jenis acara */
function fmtNilai(v,info){
  const x=Number(v); if(v==null||!isFinite(x)) return "-";
  if((info&&info.JENIS)==="MASA") return fmtSaat(x)+(x<60?" saat":" min");
  return x.toFixed(2)+((info&&info.UNIT)?" "+info.UNIT:"");
}
function fmtNilaiUnit(v,jenis,unit){ return fmtNilai(v,{JENIS:jenis,UNIT:unit}); }


/* ---------- Format tarikh & masa ----------
   TARIKH : dd/MM/yyyy      MASA : 8.00am / 3.45pm                        */
function masaKunci(v){ /* HH:mm:ss untuk tujuan susunan sahaja */
  if(v===null||v===undefined||v==="") return "";
  if(v instanceof Date) return v.toTimeString().slice(0,8);
  const t=String(v).trim();
  if(t.indexOf("T")>-1 && /Z$/.test(t)){ const d=new Date(t); if(!isNaN(d)) return d.toISOString().slice(11,19); }
  const m=t.match(/(\d{1,2}):(\d{2})(:(\d{2}))?/);
  return m?(("0"+m[1]).slice(-2)+":"+m[2]+":"+(m[4]||"00")):t;
}
function fmtMasa(v){
  const k=masaKunci(v);
  const m=k.match(/^(\d{2}):(\d{2})/);
  if(!m) return k;
  let h=Number(m[1]); const mm=m[2];
  const ap=h<12?"am":"pm";
  h=h%12; if(h===0) h=12;
  return h+"."+mm+ap;
}
function fmtTarikh(v){
  if(v===null||v===undefined||v==="") return "";
  let t;
  if(v instanceof Date) t=v.toISOString().slice(0,10);
  else t=String(v).trim();
  const iso=t.match(/(\d{4})-(\d{2})-(\d{2})/);
  if(iso) return iso[3]+"/"+iso[2]+"/"+iso[1];
  const dmy=t.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);
  if(dmy) return ("0"+dmy[1]).slice(-2)+"/"+("0"+dmy[2]).slice(-2)+"/"+dmy[3];
  return t.slice(0,10);
}
/* Tarikh + masa penuh, cth: 27/07/2026 8.00am */
function fmtTarikhMasa(v){
  if(!v) return "";
  const s=String(v);
  const t=fmtTarikh(s), m=fmtMasa(s);
  return (t?t:"")+(m&&/\d{1,2}[:.]\d{2}/.test(s)?" "+m:"");
}

/* ---------- Navigasi + Sejarah Browser ----------
   Pastikan butang "back" browser/telefon menutup overlay atau kembali ke
   skrin sebelumnya, bukannya menutup app. */
const HIST=[]; /* {view,ctx} tanpa entri semasa */
function go(v,c={}){
  if(VIEW && VIEW!==v){ HIST.push({view:VIEW,ctx:CTX}); }
  VIEW=v; CTX=c||{}; window.scrollTo(0,0); render();
  try{ history.pushState({view:v},"", "#"+v); }catch(e){}
}
function goBack(){
  const o=$("#ov"); if(o){ tutup(); return; }
  const p=HIST.pop();
  if(p){ VIEW=p.view; CTX=p.ctx; window.scrollTo(0,0); render(); }
  else { VIEW="home"; CTX={}; render(); }
}
window.addEventListener("popstate",()=>{ goBack(); try{ history.pushState({view:VIEW},"", "#"+VIEW); }catch(e){} });

function kemasItemK(id){
  const el=document.getElementById("ki-"+id);

async function tandaHadir(id,status){
  if(PENDING_KEH[id]) return;
  const a=atletById(id); if(!a) return;
  // Optimistic: kemas data tempatan + UI serta-merta
  setKehadiranLokal(id,kTarikh,status,a["NAMA PENUH"],a.KATEGORI,a.SEKOLAH);
  PENDING_KEH[id]=true; bumpPending(+1); kemasItemK(id);
  try{
    await api("kehadiran",{tarikh:kTarikh,atletId:id,nama:a["NAMA PENUH"],kategori:a.KATEGORI,sekolah:a.SEKOLAH,status,...who()});

    toastRalat(e);
  }finally{
    PENDING_KEH[id]=false; bumpPending(-1); kemasItemK(id);
  }
}

async function simpanAtlet(id){
  const btn=$("#btnSimpanAtlet"); if(btn){btn.disabled=true;btn.textContent="Menyimpan…";}
  const p={nama:$("#fn").value.trim(),noIc:$("#fi").value.trim(),jantina:$("#fj").value,kategori:$("#fk").value.trim().toUpperCase(),sekolah:$("#fs").value.trim(),catatan:$("#fc").value.trim(),...who()};

  try{
    if(id){
      const r=await api("kemaskiniAtlet",{id,...p});
      // Gantikan rekod atlet tempatan dengan data terkini dari server supaya UI tak perlu refresh.
      const idx=(DB.atlet||[]).findIndex(a=>String(a.ID)===String(id));

}

/* Drag & drop susunan acara — Master Admin sahaja */
let DRAG_EL=null;
function pasangDragAcara(){
  const wrap=document.getElementById("acaraWrap"); if(!wrap) return;
  wrap.querySelectorAll(".item[draggable=true]").forEach(el=>{
    el.addEventListener("dragstart",e=>{ DRAG_EL=el; el.classList.add("dragging"); e.dataTransfer.effectAllowed="move"; try{e.dataTransfer.setData("text/plain",el.dataset.acara)}catch(_){} });
    el.addEventListener("dragend",()=>{ el.classList.remove("dragging"); wrap.querySelectorAll(".item").forEach(x=>x.classList.remove("dragOver")); DRAG_EL=null; simpanSusunanAcara(); });
    el.addEventListener("dragover",e=>{ e.preventDefault(); if(!DRAG_EL||DRAG_EL===el) return; el.classList.add("dragOver");
      const r=el.getBoundingClientRect(); const selepas=(e.clientY-r.top)>r.height/2;
      wrap.insertBefore(DRAG_EL, selepas?el.nextSibling:el); });
    el.addEventListener("dragleave",()=>el.classList.remove("dragOver"));
    el.addEventListener("drop",e=>{ e.preventDefault(); el.classList.remove("dragOver"); });
    /* Sokongan sentuhan: tekan lama pada ikon untuk naik/turun */
    const h=el.querySelector(".dragHandle");
    if(h) h.addEventListener("touchstart",()=>{},{passive:true});
  });
}
async function simpanSusunanAcara(){
  const wrap=document.getElementById("acaraWrap"); if(!wrap) return;
  const senarai=[...wrap.querySelectorAll(".item")].map(el=>el.dataset.acara);
  if(!senarai.length) return;
  /* Kemaskini setempat dahulu supaya paparan kekal */
  senarai.forEach((n,i)=>{ const a=(DB.acara||[]).find(x=>String(x.ACARA)===String(n)); if(a) a.SUSUNAN=i+1; });
  try{ await api("susunAcara",{senarai,...who()}); toast("Susunan acara disimpan"); }
  catch(e){ toastRalat(e); }
}

let AD_KAT="__ALL__", AD_SORT="nama"; /* filter kategori + susunan */
function vAcaraDetail(){
  const n=CTX.acara, info=acaraInfo(n), boleh=bolehRekod(n), jl=jurulatihAcara(n);
  const t=today();
  const semua=penyertaan(n);
  // Senarai kategori unik dalam acara ini
  const kats=[...new Set(semua.map(p=>String(p.KATEGORI||"").toUpperCase()).filter(Boolean))].sort();
  if(AD_KAT!=="__ALL__" && !kats.includes(AD_KAT)) AD_KAT="__ALL__";
  const pl=AD_KAT==="__ALL__"?semua:semua.filter(p=>String(p.KATEGORI||"").toUpperCase()===AD_KAT);
  // Susunan
  const nilai=(p)=>terbaik(n,p["ATLET ID"]);
  const bilHariIni=(p)=>rekodAcara(n).filter(r=>rekodMilik(r,p["ATLET ID"]) && String(r.TARIKH).slice(0,10)===t).length;
  const bilRekod=(p)=>rekodAcara(n).filter(r=>rekodMilik(r,p["ATLET ID"])).length;
  const asc=info.JENIS==="MASA"; /* MASA: kecil dulu; JARAK: besar dulu */
  const susun={
    nama:(a,b)=>String(a["NAMA ATLET"]).localeCompare(String(b["NAMA ATLET"])),
    terbaik:(a,b)=>{ const x=nilai(a),y=nilai(b); if(x==null&&y==null) return 0; if(x==null) return 1; if(y==null) return -1; return asc?x-y:y-x; },
    hariIni:(a,b)=>bilHariIni(b)-bilHariIni(a) || String(a["NAMA ATLET"]).localeCompare(String(b["NAMA ATLET"])),
    rekod:(a,b)=>bilRekod(b)-bilRekod(a) || String(a["NAMA ATLET"]).localeCompare(String(b["NAMA ATLET"])),
    sekolah:(a,b)=>String(a.SEKOLAH||"").localeCompare(String(b.SEKOLAH||"")) || String(a["NAMA ATLET"]).localeCompare(String(b["NAMA ATLET"]))
  };
  const sorted=pl.slice().sort(susun[AD_SORT]||susun.nama);
  // Pengumpulan mengikut kategori bila "Semua" dipilih
  const groups={};
  if(AD_KAT==="__ALL__"){
    sorted.forEach(p=>{ const k=String(p.KATEGORI||"TANPA KATEGORI").toUpperCase(); (groups[k]=groups[k]||[]).push(p); });

    }).join("")}</div>`;
  const sortHtml=`<label>Susun ikut</label><select onchange="AD_SORT=this.value;render()">
    <option value="nama" ${AD_SORT==="nama"?"selected":""}>Nama (A-Z)</option>
    <option value="terbaik" ${AD_SORT==="terbaik"?"selected":""}>Rekod Terbaik</option>
    <option value="hariIni" ${AD_SORT==="hariIni"?"selected":""}>Rekod Hari Ini (banyak dulu)</option>
    <option value="rekod" ${AD_SORT==="rekod"?"selected":""}>Jumlah Rekod (banyak dulu)</option>
    <option value="sekolah" ${AD_SORT==="sekolah"?"selected":""}>Sekolah</option>
  </select>`;

  app().innerHTML=`${topbar(n,"acara")}
  <div class="card">
    <span class="badge">${info.JENIS==="MASA"?"MASA (saat / minit — cth 1:15.45)":"JARAK (METER)"}</span>
    <div class="small" style="margin-top:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap">
      <span>Jurulatih dilantik (${jl.length}/10)</span>
      <button class="btn sm ghost" onclick="(function(el){var w=document.getElementById('jlListWrap');var show=w.style.display==='none';w.style.display=show?'block':'none';el.textContent=show?'Sembunyi senarai':'Papar senarai';})(this)">Papar senarai</button>
    </div>
    <div id="jlListWrap" style="display:none">${jl.map(j=>`<span class="chip">👤 ${esc(j["NAMA JURULATIH"])} ${boleh?`<a href="#" onclick="event.preventDefault();buangJ('${esc(n)}','${esc(j["EMEL JURULATIH"])}')" style="color:var(--bad)">✕</a>`:""}</span>`).join("")||'<span class="chip">Tiada</span>'}</div>
    ${boleh?`<button class="btn sm ghost" style="margin-top:10px" onclick="formJurulatih('${esc(n)}')">+ Lantik Jurulatih Pembantu</button>`:""}
    ${boleh?`<button class="btn sm" style="margin-top:10px" onclick="formPenyertaan('${esc(n)}')">+ Tambah Atlet ke Acara</button>`:`<div class="small" style="margin-top:10px">Hanya jurulatih acara ini atau Master Admin boleh menambah/merekod.</div>`}
    ${boleh && isBerpasukan(n)?`<button class="btn sm" style="margin-top:8px;background:var(--p2)" onclick="formRekodRelay('${esc(n)}')">👥 + Rekod Berpasukan</button><div class="small" style="margin-top:4px">Acara berpasukan — satu rekod dikongsi oleh semua atlet dalam pasukan.</div>`:""}
    <button class="btn ghost sm" style="margin-top:10px" onclick="go('sejarah',{acara:'${esc(n)}'})">🕘 Sejarah Rekod Acara</button>

    Object.keys(groups).sort().map(k=>{
      const list=groups[k];

      return hdr + list.map(p=>itemAcaraDetail(n,p,info,boleh,t)).join("");
    }).join("")}

async function simpanKejohanan(n,id){
  const btn=$("#btnK"); const info=acaraInfo(n);
  const kategori=$("#kk").value.trim().toUpperCase();
  const mentah=$("#kv").value;
  const nilai=info.JENIS==="MASA"?huraiMasa(mentah):parseFloat(String(mentah).replace(",","."));
  if(!kategori) return toast("Kategori diperlukan");
  if(!(nilai>0)) return toast("Masukkan nilai rekod yang sah");
  if(btn){btn.disabled=true;btn.textContent="Menyimpan…";}
  const p={acara:n,id:id||"",kategori,namaKejohanan:$("#kn").value.trim(),tahun:$("#kt").value.trim(),
    pemegang:$("#kp").value.trim(),nilai,keputusan:fmtNilai(nilai,info),catatan:$("#kc").value.trim(),...who()};
  try{
    const r=await api("rekodKejohanan",p);
    DB.kejohanan=(DB.kejohanan||[]).filter(k=>!(String(k.ACARA)===n && String(k.KATEGORI).toUpperCase()===kategori));
    if(r&&r.rekod) DB.kejohanan.push(r.rekod);
    tutup(); render(); toast("Rekod kejohanan disimpan");
  }catch(e){ toastRalat(e); if(btn){btn.disabled=false;btn.textContent="Simpan";} }
}
async function padamKejohanan(n,id){

}
function itemAcaraDetail(n,p,info,boleh,t){
  const a=atletById(p["ATLET ID"])||{"NAMA PENUH":p["NAMA ATLET"],KATEGORI:p.KATEGORI,SEKOLAH:p.SEKOLAH,ID:p["ATLET ID"]};
  const b=terbaik(n,p["ATLET ID"]), hadir=hadirHariIni(p["ATLET ID"],t);
  const lagiBaik=(x,y)=>info.JENIS==="MASA"?x-y:y-x; /* terbaik dahulu */
  const rHariIni=rekodAcara(n).filter(r=>rekodMilik(r,p["ATLET ID"]) && String(r.TARIKH).slice(0,10)===t)
    .sort((x,y)=>{
      const vx=Number(x.NILAI), vy=Number(y.NILAI);
      const ox=isFinite(vx)&&vx>0, oy=isFinite(vy)&&vy>0;
      if(ox&&oy) return lagiBaik(vx,vy) || masaKunci(x.MASA).localeCompare(masaKunci(y.MASA));
      if(ox) return -1; if(oy) return 1;
      return masaKunci(x.MASA).localeCompare(masaKunci(y.MASA));
    });
  const bHariIni=rHariIni.length?Number(rHariIni[0].NILAI):null;
  const chips=rHariIni.length
    ? `<div style="margin-top:6px">${rHariIni.map((r,i)=>{
        const gaya=i===0?'style="cursor:pointer;border-color:var(--ok);color:var(--ok)"':'style="cursor:pointer"';
        return boleh
          ? `<span class="pill" ${gaya} onclick="event.stopPropagation();formEditRekod('${esc(n)}','${esc(r.ID)}')">${i===0?"★ ":""}${esc(r.KEPUTUSAN)} ✎</span>`
          : `<span class="pill" ${i===0?'style="border-color:var(--ok);color:var(--ok)"':""}>${i===0?"★ ":""}${esc(r.KEPUTUSAN)}</span>`;
      }).join("")}</div>`
    : "";
  const rp=String(p["REKOD PERIBADI"]||"").trim();
  /* Bandingkan pencapaian terbaik atlet dengan rekod kejohanan kategori dia */
  const rk=kejohananKat(n,p.KATEGORI);
  let jurang="";
  if(rk && b!==null && Number(rk.NILAI)>0){
    const target=Number(rk.NILAI);
    const capai=info.JENIS==="MASA"? b<=target : b>=target;
    const beza=Math.abs(b-target);
    jurang=capai
      ? `<span style="color:var(--ok)">• ✅ sudah mencapai rekod</span>`
      : `<span style="color:var(--warn)">• perlu ${info.JENIS==="MASA"?"laju":"tambah"} ${esc(fmtNilai(beza,info))} lagi</span>`;
  }
  const barisInfo=`<div class="sub" style="display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center">
    <span>🏅 Rekod Peribadi: <b>${rp?esc(rp):"-"}</b></span>
    <span>⭐ Terbaik Latihan: <b>${b!==null?fmtNilai(b,info):"-"}</b></span>
    <span>📅 Terbaik Hari Ini: <b>${bHariIni!==null&&isFinite(bHariIni)&&bHariIni>0?fmtNilai(bHariIni,info):"-"}</b></span>
    ${rk?`<span>🏆 Sasaran (${esc(rk.KATEGORI)}): <b>${esc(rk.KEPUTUSAN||fmtNilai(Number(rk.NILAI),info))}</b></span>${jurang}`:""}
    ${hadir?'<span style="color:var(--ok)">• hadir hari ini</span>':'<span style="color:var(--warn)">• belum tanda kehadiran</span>'}
  </div>`;
  return `<div class="item" id="ad-${esc(n)}-${esc(p["ATLET ID"])}">
    <img class="av" src="${avatar(a)}" ${avErr(a)}/>
    <div style="flex:1" onclick="go('profil',{id:'${esc(p["ATLET ID"])}'})">
      <div class="nm">${esc(p["NAMA ATLET"])}</div>
      <div class="sub">${esc(p.KATEGORI)} • ${esc(p.SEKOLAH)}</div>
      ${barisInfo}
      ${rHariIni.length?`<div class="sub">Rekod hari ini (${rHariIni.length}) — terbaik di hadapan:</div>${chips}`:""}
    </div>
    ${boleh && !isBerpasukan(n)?`<div class="right"><button class="btn sm" onclick="formRekod('${esc(n)}','${esc(p["ATLET ID"])}')">+ Rekod</button></div>`:""}
  </div>`;
}

let CROP=null; /* {img,scale,tx,ty} */
function formGambarAtlet(id){
  const a=atletById(id); if(!a) return;
  overlay(`<div class="big">Kemas Gambar Atlet</div>
    <div class="small">${esc(a["NAMA PENUH"])}</div>

    <div class="row" style="gap:8px">
      <button class="btn sm ghost" onclick="cropZoom(1.15)">🔍+</button>
      <button class="btn sm ghost" onclick="cropZoom(0.87)">🔍−</button>
      <button class="btn sm ghost" onclick="cropReset()">↺ Reset</button>
      <button class="btn sm ghost" onclick="$('#pkrGambar').click()">📁 Pilih Gambar</button>
    </div>
    <input type="file" id="pkrGambar" accept="image/*" class="hide" onchange="cropLoad(event)"/>
    <p class="small">Seret untuk gerak, guna butang zoom untuk perbesarkan bahagian muka. Gambar akan dipotong bulat 600×600.</p>
    <button class="btn" id="btnGmb" onclick="simpanGambar('${esc(id)}')">Simpan Gambar</button>
    <button class="btn ghost" onclick="tutup()">Batal</button>`);
  setTimeout(cropInit,50);
}
function cropInit(){
  const box=$("#cropbox"), cv=$("#cropcv");
  CROP={img:null,scale:1,tx:0,ty:0};
  // muat gambar sedia ada jika ada URL
  const src=CTX && CTX.id ? (atletById(CTX.id)||{})["GAMBAR (URL)"] : "";
  if(src && src.startsWith("http")){
    const im=new Image(); im.crossOrigin="anonymous";
    im.onload=()=>{ CROP.img=im; cropReset(); };
    im.onerror=()=>{};
    im.src=src;
  }
  // interaksi
  let drag=false,lx=0,ly=0,pinch=null;
  const rect=()=>box.getBoundingClientRect();
  box.addEventListener("pointerdown",e=>{ box.setPointerCapture(e.pointerId); drag=true; lx=e.clientX; ly=e.clientY; });
  box.addEventListener("pointermove",e=>{
    if(!drag||!CROP.img) return;
    const r=rect(); const dx=(e.clientX-lx)*(cv.width/r.width); const dy=(e.clientY-ly)*(cv.height/r.height);
    CROP.tx+=dx; CROP.ty+=dy; lx=e.clientX; ly=e.clientY; cropDraw();
  });
  box.addEventListener("pointerup",()=>drag=false);
  box.addEventListener("pointercancel",()=>drag=false);
  box.addEventListener("wheel",e=>{ e.preventDefault(); cropZoom(e.deltaY<0?1.1:0.9); },{passive:false});
  cropDraw();
}
function cropReset(){
  if(!CROP||!CROP.img){ cropDraw(); return; }
  const cv=$("#cropcv"); const s=Math.max(cv.width/CROP.img.width, cv.height/CROP.img.height);
  CROP.scale=s; CROP.tx=(cv.width - CROP.img.width*s)/2; CROP.ty=(cv.height - CROP.img.height*s)/2; cropDraw();
}
function cropZoom(f){ if(!CROP||!CROP.img) return; const cv=$("#cropcv"); const cx=cv.width/2, cy=cv.height/2;
  CROP.tx = cx - (cx-CROP.tx)*f; CROP.ty = cy - (cy-CROP.ty)*f; CROP.scale*=f; cropDraw(); }
function cropDraw(){
  const cv=$("#cropcv"); if(!cv) return; const ctx=cv.getContext("2d");
  ctx.fillStyle="#050816"; ctx.fillRect(0,0,cv.width,cv.height);
  if(!CROP||!CROP.img){ ctx.fillStyle="#9fb0d9"; ctx.font="bold 22px system-ui"; ctx.textAlign="center"; ctx.fillText("Pilih gambar untuk mula",cv.width/2,cv.height/2); return; }
  ctx.drawImage(CROP.img, CROP.tx, CROP.ty, CROP.img.width*CROP.scale, CROP.img.height*CROP.scale);
}
function cropLoad(ev){
  const f=ev.target.files&&ev.target.files[0]; if(!f) return;
  const r=new FileReader(); r.onload=()=>{ const im=new Image(); im.onload=()=>{ CROP.img=im; cropReset(); }; im.src=r.result; }; r.readAsDataURL(f);
}
async function simpanGambar(id){
  if(!CROP||!CROP.img) return toast("Sila pilih gambar dahulu");
  const btn=$("#btnGmb"); if(btn){btn.disabled=true;btn.textContent="Menyimpan…";}

  try{
    const r=await api("kemaskiniAtlet",{id, gambarBase64:data, ...who()});
    const at=atletById(id); if(at && r && r.gambar) at["GAMBAR (URL)"]=r.gambar;

/* ================= LAPORAN RANKING BOLEH CETAK =================
   mod = "acara"  : Acara → Kategori → kedudukan atlet
   mod = "atlet"  : Kategori → Nama atlet (A-Z) → pencapaian setiap acara
   Kedua-duanya kekal tersusun mengikut KATEGORI.                 */
function kiraRanking(namaAcara){
  const info=acaraInfo(namaAcara), grp={};
  rekodAcara(namaAcara).forEach(r=>{
    const id=String(r["ATLET ID"]); if(!Number(r.NILAI)) return;
    const g=(grp[id]=grp[id]||{nama:r["NAMA ATLET"],kategori:String(r.KATEGORI||"TIADA KATEGORI"),sekolah:r.SEKOLAH,v:[],rek:[]});
    g.v.push(Number(r.NILAI));
    g.rek.push({nilai:Number(r.NILAI),tarikh:r.TARIKH||""});
  });
  const asc=info.JENIS==="MASA";
  /* Rekod peribadi kejohanan lepas (dari senarai penyertaan) */
  const rpMap={};
  penyertaan(namaAcara).forEach(p=>{ const t=String(p["REKOD PERIBADI"]||"").trim(); if(t) rpMap[String(p["ATLET ID"])]=t; });
  const rank=Object.keys(grp).map(id=>({
    id,...grp[id],
    purata:purata(grp[id].v),
    terbaik:asc?Math.min.apply(null,grp[id].v):Math.max.apply(null,grp[id].v),
    rekodPeribadi:rpMap[id]||"",
    top3:grp[id].rek.slice().sort((a,b)=>asc?a.nilai-b.nilai:b.nilai-a.nilai).slice(0,3),
    n:grp[id].v.length
  }));
  /* Kedudukan dikira dalam kategori masing-masing */
  const ikutKat={};
  rank.forEach(r=>{ (ikutKat[r.kategori]=ikutKat[r.kategori]||[]).push(r); });
  Object.keys(ikutKat).forEach(k=>{
    ikutKat[k].sort((a,b)=>asc?a.terbaik-b.terbaik:b.terbaik-a.terbaik);
    ikutKat[k].forEach((r,i)=>{ r.kedudukan=i+1; });
  });
  return {info,rank,ikutKat,asc};
}

/* Rekod peribadi kejohanan lepas — dipaparkan merah */
function selRP(r){ return r.rekodPeribadi?`<span class="rp">${esc(r.rekodPeribadi)}</span>`:`<span style="color:#98a2b3">—</span>`; }

function selTop3(r,unit,jenis){
  if(!r.top3||!r.top3.length) return `<span style="color:#98a2b3">—</span>`;
  return `<div class="t3">`+r.top3.map((t,i)=>`${i+1}. <b>${fmtNilaiUnit(t.nilai,jenis||(String(unit).toLowerCase()==="saat"?"MASA":"JARAK"),unit)}</b>${t.tarikh?` <span class="d">(${esc(fmtTarikh(t.tarikh))})</span>`:""}`).join("<br/>")+`</div>`;
}
/* Rekod kejohanan (per kategori) — untuk laporan */
function selRK(rk,info){
  if(!rk) return `<span style="color:#98a2b3">—</span>`;
  const nilai=rk.KEPUTUSAN||(rk.NILAI?fmtNilai(Number(rk.NILAI),info):"-");
  const meta=[rk["NAMA KEJOHANAN"]||"",rk.TAHUN||"",rk["PEMEGANG REKOD"]||""].filter(Boolean).join(" • ");
  return `<div><b style="color:#0b3b6f">🏆 ${esc(nilai)}</b>${meta?`<div class="d" style="color:#667085;font-size:10.5px">${esc(meta)}</div>`:""}</div>`;
}

function cetakLaporan(mod){
  const senaraiAcara=acaraList();
  if(!senaraiAcara.length) return toast("Tiada acara untuk dilaporkan.");

  if(mod==="acara"){
    let isi="";
    senaraiAcara.forEach(ac=>{
      const n=ac.ACARA, {info,ikutKat}=kiraRanking(n);
      const kats=Object.keys(ikutKat).sort();
      isi+=`<div class="blok"><h2 class="acara">ACARA: ${esc(n)} <span style="font-weight:400;font-size:11px">(${esc(info.JENIS||"")}${info.UNIT?" • "+esc(info.UNIT):""}${info.JENIS==="MASA"?" • masa terendah = terbaik":" • nilai tertinggi = terbaik"})</span></h2>`;
      if(!kats.length){ isi+=`<div class="kosong">Tiada rekod bagi acara ini.</div></div>`; return; }
      kats.forEach(k=>{
        const rkKat=kejohananKat(n,k);
        const rkTxt=rkKat?` <span style="font-weight:400;text-transform:none;color:#0b3b6f">• 🏆 ${esc(rkKat.KEPUTUSAN||fmtNilai(Number(rkKat.NILAI),info))}${rkKat["NAMA KEJOHANAN"]?" ("+esc(rkKat["NAMA KEJOHANAN"])+(rkKat.TAHUN?" "+esc(rkKat.TAHUN):"")+")":""}${rkKat["PEMEGANG REKOD"]?" — "+esc(rkKat["PEMEGANG REKOD"]):""}</span>`:"";
        isi+=`<h3 class="kat">Kategori: ${esc(k)} — ${ikutKat[k].length} atlet${rkTxt}</h3>
        <table><thead><tr><th>#</th><th>Nama Atlet</th><th>Sekolah</th><th style="text-align:right">Rekod Peribadi (Kejohanan Lepas)</th><th>3 Rekod Terbaik (Latihan)</th><th style="text-align:right">Terbaik</th><th style="text-align:right">Bil.</th></tr></thead><tbody>`;
        ikutKat[k].forEach(r=>{
          isi+=`<tr class="${r.kedudukan===1?"emas":""}"><td class="no">${r.kedudukan}</td><td>${esc(r.nama)}</td><td>${esc(r.sekolah||"-")}</td><td class="num">${selRP(r)}</td><td>${selTop3(r,info.UNIT,info.JENIS)}</td><td class="num">${fmtNilai(r.terbaik,info)}</td><td class="num">${r.n}</td></tr>`;
        });
        isi+=`</tbody></table>`;
      });
      isi+=`</div>`;
    });
    return bukaLaporan("Laporan Ranking Mengikut Acara",isi);
  }

  /* mod === "atlet" : kekal tersusun mengikut kategori */
  const semua={}; /* kategori -> nama atlet -> baris */
  senaraiAcara.forEach(ac=>{
    const n=ac.ACARA, {info,ikutKat}=kiraRanking(n);
    Object.keys(ikutKat).forEach(k=>{
      ikutKat[k].forEach(r=>{
        const kat=semua[k]=semua[k]||{};
        (kat[r.nama]=kat[r.nama]||{sekolah:r.sekolah,baris:[]}).baris.push({
          acara:n,unit:info.UNIT||"",jenis:info.JENIS||"",terbaik:r.terbaik,n:r.n,kedudukan:r.kedudukan,jumlah:ikutKat[k].length,
          rekodPeribadi:r.rekodPeribadi,top3:r.top3,rk:kejohananKat(n,k),info:info
        });
      });
    });
  });
  const kats=Object.keys(semua).sort();
  if(!kats.length) return toast("Tiada rekod untuk dijana.");
  let isi="";
  kats.forEach(k=>{
    isi+=`<div class="blok"><h2 class="acara">KATEGORI: ${esc(k)}</h2>`;
    Object.keys(semua[k]).sort((a,b)=>a.localeCompare(b)).forEach(nama=>{
      const d=semua[k][nama];
      isi+=`<h3 class="kat">${esc(nama)} <span style="font-weight:400;text-transform:none;color:#667085">— ${esc(d.sekolah||"-")}</span></h3>
      <table><thead><tr><th>Acara</th><th style="text-align:right">Rekod Kejohanan (Kategori)</th><th style="text-align:right">Rekod Peribadi (Kejohanan Lepas)</th><th>3 Rekod Terbaik (Latihan)</th><th style="text-align:right">Terbaik</th><th style="text-align:right">Bil.</th><th style="text-align:right">Kedudukan Kategori</th></tr></thead><tbody>`;
      d.baris.sort((x,y)=>x.acara.localeCompare(y.acara)).forEach(b=>{
        isi+=`<tr class="${b.kedudukan===1?"emas":""}"><td>${esc(b.acara)}</td><td class="num">${selRK(b.rk,b.info)}</td><td class="num">${selRP(b)}</td><td>${selTop3(b,b.unit,b.jenis)}</td><td class="num">${fmtNilaiUnit(b.terbaik,b.jenis,b.unit)}</td><td class="num">${b.n}</td><td class="num">${b.kedudukan} / ${b.jumlah}</td></tr>`;
      });
      isi+=`</tbody></table>`;
    });
    isi+=`</div>`;
  });
  bukaLaporan("Laporan Ranking Mengikut Nama Atlet",isi);
}

let mxCari="", mxSekolah="", mxKategori="", mxSortAtlet="kat-nama";
function sortAtlet(arr){
  const byNama=(x,y)=>String(x["NAMA PENUH"]||"").localeCompare(String(y["NAMA PENUH"]||""));
  const byKat=(x,y)=>String(x.KATEGORI||"").localeCompare(String(y.KATEGORI||""));
  const bySek=(x,y)=>String(x.SEKOLAH||"").localeCompare(String(y.SEKOLAH||""));
  const a=arr.slice();
  switch(mxSortAtlet){
    case "nama": return a.sort(byNama);
    case "sekolah-nama": return a.sort((x,y)=>bySek(x,y)||byNama(x,y));
    case "sekolah-kat": return a.sort((x,y)=>bySek(x,y)||byKat(x,y)||byNama(x,y));
    case "kat-sekolah": return a.sort((x,y)=>byKat(x,y)||bySek(x,y)||byNama(x,y));
    case "kat-nama": default: return a.sort((x,y)=>byKat(x,y)||byNama(x,y));
  }
}

      ${sekolahOpt.map(s=>`<option value="${esc(s)}" ${s===mxSekolah?"selected":""}>${esc(s)}</option>`).join("")}
    </select>
    <select onchange="mxKategori=this.value;vMatriks()">
      <option value="">Semua Kategori</option>
      ${kategoriOpt.map(k=>`<option value="${esc(k)}" ${k===mxKategori?"selected":""}>${esc(k)}</option>`).join("")}
    </select>
    <select onchange="mxSortAtlet=this.value;vMatriks()">
      <option value="kat-nama" ${mxSortAtlet==="kat-nama"?"selected":""}>Susun: Kategori → Nama</option>
      <option value="nama" ${mxSortAtlet==="nama"?"selected":""}>Susun: Nama</option>
      <option value="sekolah-nama" ${mxSortAtlet==="sekolah-nama"?"selected":""}>Susun: Sekolah → Nama</option>
      <option value="sekolah-kat" ${mxSortAtlet==="sekolah-kat"?"selected":""}>Susun: Sekolah → Kategori</option>

    </select>
    <button class="mx-btn" onclick="window.print()">🖨 Cetak / Simpan PDF</button>
    <button class="mx-btn alt" onclick="mxCari='';mxSekolah='';mxKategori='';mxSortAtlet='kat-nama';vMatriks()">Reset</button>
  </div>
  ${isAdmin()?`<div class="mx-tools no-print" style="margin-top:-4px"><div style="font-size:12px;color:#9fb0d9;font-weight:600">✎ Mod Master Admin: klik <b>nama peserta</b> untuk tanda / buang acara mereka terus dari senarai ini — tidak perlu buka acara satu per satu.</div></div>`:""}

  <div class="mx-wrap">
    <div class="mx-head">
      <div class="mx-brand">
        <div class="mx-logo">AT</div>
        <div class="mx-title">
          <h2>Matriks Penyertaan Peserta × Acara</h2>
          <div class="mx-sub">AtletTrack • Laporan Rasmi Pusat Latihan</div>
        </div>
      </div>
      <div style="text-align:right">
        <div style="font-size:12px;color:#5b6b8f;font-weight:700;text-transform:uppercase;letter-spacing:.5px">Tarikh Cetak</div>
        <div style="font-size:14px;color:#0b1533;font-weight:800">${esc(tarikhCetak)}</div>
        <div style="font-size:11.5px;color:#5b6b8f;margin-top:2px">${esc(sekolahUtama)}</div>
      </div>
    </div>

    ${acara.length===0?`<div style="padding:24px;text-align:center;color:#5b6b8f">Tiada acara aktif direkodkan.</div>`:
    atlet.length===0?`<div style="padding:24px;text-align:center;color:#5b6b8f">Tiada peserta padan dengan tapisan.</div>`:`
    <div class="mx-scroll">
      <table class="mx">
        <thead>
          <tr>
            <th class="nm" rowspan="2">Nama Peserta</th>
            <th class="sk" rowspan="2">Sekolah</th>
            <th class="kt" rowspan="2">Kategori</th>
            <th colspan="${acara.length}" style="text-align:center">Acara</th>
            <th class="kt" rowspan="2">Jumlah</th>
          </tr>
          <tr>
            ${acara.map(ev=>`<th class="rot" title="${esc(ev.ACARA)}">${esc(ev.ACARA)}</th>`).join("")}
          </tr>
        </thead>
        <tbody>
          ${(()=>{let prevKat="", isKat=["kat-nama","kat-sekolah"].includes(mxSortAtlet); return atlet.map((a,i)=>{
            const id=String(a.ID);
            const set=daftar[id]||new Set();
            const kat=String(a.KATEGORI||"—");
            const groupStart=isKat && kat!==prevKat ? (prevKat=kat, "group-start") : "";
            return `<tr class="${groupStart}">
              <td class="nm">${isAdmin()
                ? `<span class="no">${String(i+1).padStart(2,"0")}</span><button class="mx-edit no-print" onclick="mxUbahAcara('${esc(id)}')" title="Ubah acara peserta ini">${esc(a["NAMA PENUH"]||"")} ✎</button><span class="only-print">${esc(a["NAMA PENUH"]||"")}</span>`
                : `<span class="no">${String(i+1).padStart(2,"0")}</span>${esc(a["NAMA PENUH"]||"")}`}</td>
              <td class="sk">${esc(a.SEKOLAH||"—")}</td>
              <td class="kt">${esc(kat)}</td>
              ${acara.map(ev=>{
                const on=set.has(ev.ACARA);
                return `<td class="cx ${on?"on":"off"}">${on?"✕":"·"}</td>`;
              }).join("")}
              <td class="tot">${set.size}</td>
            </tr>`;
          }).join("")})()}
        </tbody>
        <tfoot>
          <tr>
            <td class="lbl" colspan="3">Jumlah Peserta / Acara</td>
            ${acara.map(ev=>`<td>${totLajur(ev.ACARA)}</td>`).join("")}

          </tr>

      </table>

    <div class="mx-legend">
      <div class="lg"><span class="sw"></span> ✕ = Peserta berdaftar dalam acara</div>
      <div class="lg">· = Tidak menyertai</div>
      <div class="lg"><b>${atlet.length}</b> peserta • <b>${acara.length}</b> acara</div>
    </div>
    <div class="mx-foot">
      <div>Dokumen dijana oleh sistem AtletTrack</div>
      <div>Disahkan oleh: ${esc((U&&U.nama)||"—")} • ${esc((U&&U.jawatan)||"")}</div>
    </div>`}
  </div>`;
}

/* ---------- Master Admin: ubah acara peserta secara pukal ---------- */
function mxUbahAcara(id){
  if(!isAdmin()) return toast("Hanya Master Admin boleh mengubah acara peserta.");
  const a=atletById(id); if(!a) return toast("Atlet tidak dijumpai");
  const semua=acaraList();
  const ada=new Set(semua.filter(ev=>penyertaan(ev.ACARA).some(p=>String(p["ATLET ID"])===String(id))).map(ev=>ev.ACARA));
  const baris=semua.map(ev=>{
    const cari=(String(ev.ACARA||"")+" "+String(ev.JENIS||"")).toLowerCase();
    return `<label class="atletPick" data-cari="${esc(cari)}" style="display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.06);cursor:pointer">
      <input type="checkbox" class="mxAc" value="${esc(ev.ACARA)}" ${ada.has(ev.ACARA)?"checked":""}/>
      <span style="flex:1;min-width:0"><div style="font-weight:600">${esc(ev.ACARA)}</div><div class="small">${esc(ev.JENIS==="MASA"?"Masa":"Jarak")}${ev.MOD?" • "+esc(ev.MOD):""}</div></span>
    </label>`;
  }).join("");
  overlay(`<div class="big">Ubah Acara — ${esc(a["NAMA PENUH"]||"")}</div>
  <div class="small">${esc(a.KATEGORI||"")} • ${esc(a.SEKOLAH||"")}</div>
  <p class="small">Tanda semua acara yang disertai peserta ini, kemudian Simpan. Tiada syarat kehadiran bagi Master Admin.</p>
  <label>Cari acara</label>
  <input id="paCari" placeholder="Taip nama acara…" autocomplete="off" oninput="tapisAtletPick(this.value)"/>
  <div id="paSenarai" style="max-height:45vh;overflow:auto;border:1px solid rgba(255,255,255,.12);border-radius:10px;margin-top:6px">${baris||'<div class="small" style="padding:10px">Tiada acara aktif.</div>'}</div>
  <div class="small" id="paKira" style="margin-top:4px">${semua.length} acara</div>
  <button class="btn" id="btnMX" onclick="simpanAcaraAtlet('${esc(id)}')">Simpan</button>
  <button class="btn ghost" onclick="tutup()">Batal</button>`);
}
async function simpanAcaraAtlet(id){
  const btn=$("#btnMX"); if(btn){btn.disabled=true;btn.textContent="Menyimpan…";}
  const a=atletById(id)||{};
  const pilih=[...document.querySelectorAll("#paSenarai input.mxAc:checked")].map(el=>el.value);
  try{
    await api("tetapkanAcaraAtlet",{atletId:id,acara:pilih.join("|"),...who()});
    const kekal=new Set(pilih);
    DB.penyertaan=(DB.penyertaan||[]).filter(p=>String(p["ATLET ID"])!==String(id)||kekal.has(p.ACARA));
    const sedia=new Set((DB.penyertaan||[]).filter(p=>String(p["ATLET ID"])===String(id)).map(p=>p.ACARA));
    pilih.forEach(n=>{ if(!sedia.has(n)) DB.penyertaan.push({ACARA:n,"ATLET ID":id,"NAMA ATLET":a["NAMA PENUH"],KATEGORI:a.KATEGORI,SEKOLAH:a.SEKOLAH,"REKOD PERIBADI":"","DIMASUKKAN OLEH":U.nama,TARIKH:new Date().toLocaleString()}); });
    tutup(); render(); toast("Acara peserta dikemas kini ("+pilih.length+" acara)");
  }catch(e){ toastRalat(e); if(btn){btn.disabled=false;btn.textContent="Simpan";} }
}

  </div>
  <div class="card"><button class="btn bad" onclick="keluarTeknision()">Keluar Mod Teknision</button></div>`;

/* ---------- Overlay ---------- */
function overlay(html){
  const d=document.createElement("div"); d.className="ov"; d.id="ov";
  d.innerHTML=`<div class="sheet">${html}</div>`;
  d.addEventListener("click",e=>{ if(e.target===d) tutup(); });
  document.body.appendChild(d);
  try{ history.pushState({ov:1},"", "#ov"); }catch(e){}
}
function tutup(){ const o=$("#ov"); if(o) o.remove(); }

/* ---------- Mula ---------- */
if("serviceWorker" in navigator) window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
try{ history.replaceState({view:"home"},"", "#home"); }catch(e){}
render();
</script>
